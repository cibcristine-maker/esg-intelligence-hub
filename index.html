// MAIN APP
// ════════════════════════════════════════════════════════════════════════════
function FupProjetos() {
  const [activeProject, setActiveProject] = useState(null);
  const [state, setState] = useState(() => fupLoadData());
  const [toast, setToast] = useState(null);
  const [saveTimer, setSaveTimer] = useState(null);
  const [syncing, setSyncing] = useState(true);

  // Load from Supabase on mount
  useEffect(() => {
    fupLoadRemote().then((remote) => {
      if (remote && Object.keys(remote).length > 0) {
        setState(remote);
        fupSaveData(remote);
      }
      setSyncing(false);
    });
  }, []);

  // Auto-save with debounce — saves to both localStorage and Supabase
  const persistData = useCallback((newState) => {
    if (saveTimer) clearTimeout(saveTimer);
    const timer = setTimeout(() => {
      fupSaveData(newState);
      fupSaveRemote(newState).then((ok) => {
        setToast({ msg: ok ? "✓ Salvo para o time" : "✓ Salvo localmente", type: ok ? "success" : "info" });
        setTimeout(() => setToast(null), FUP_TOAST_DUR);
      });
    }, 600);
    setSaveTimer(timer);
  }, [saveTimer]);

  const updateProject = (key, value) => {
    const newState = { ...state, [key]: value };
    setState(newState);
    persistData(newState);
  };

  // Per-project stats for landing overview
  const pStats = {
    esgDay: {
      eventos: state.esgDay?.length || 0,
      compareceram: state.esgDay?.reduce((a, r) => a + (+r.compareceram || 0), 0) || 0,
      procedimentos: state.esgDay?.reduce((a, r) => a + (+r.procedimentos30d || 0), 0) || 0,
      receita: state.esgDay?.reduce((a, r) => a + ((+r.procedimentos30d || 0) * (+r.ticketMedio || 0)), 0) || 0,
      conv: (() => {
        const comp = state.esgDay?.reduce((a, r) => a + (+r.compareceram || 0), 0) || 0;
        const proc = state.esgDay?.reduce((a, r) => a + (+r.procedimentos30d || 0), 0) || 0;
        return comp > 0 ? ((proc / comp) * 100).toFixed(0) : 0;
      })(),
    },
    aulasRef: {
      medicos: (state.aulasReferidores?.eventos || []).reduce((a, ev) => a + (ev.referidores||[]).length, 0),
      comCRM: (state.aulasReferidores?.eventos || []).reduce((a, ev) => a + (ev.referidores||[]).filter((r) => r.possuiCRM === "Sim").length, 0),
      indicacoes: (state.aulasReferidores?.eventos || []).reduce((a, ev) => (ev.referidores||[]).reduce((b, r) => b + (+r.indicacoesM1||0) + (+r.indicacoesM2||0) + (+r.indicacoesM3||0), a), 0),
      procedimentos: (state.aulasReferidores?.eventos || []).reduce((a, ev) => (ev.referidores||[]).reduce((b, r) => b + (+r.procedimentosGerados||0), a), 0),
    },
    leap: {
      leads: state.campanhaInterna?.length || 0,
      contatados: state.campanhaInterna?.filter((r) => !["Novo Lead","Tentativa 1","Tentativa 2"].includes(r.statusFunil) && r.statusFunil !== "Perdido").length || 0,
      convertidos: state.campanhaInterna?.filter((r) => r.conversao === "Sim").length || 0,
      perdidos: state.campanhaInterna?.filter((r) => r.statusFunil === "Perdido").length || 0,
    },
    bariatricos: {
      medicos: state.cursoBariatricos?.medicos?.length || 0,
      fups: state.cursoBariatricos?.followups?.length || 0,
      procedimentos: (state.cursoBariatricos?.followups || []).reduce((a, f) => a + (+f.procedimentos || 0), 0),
      scoreMedio: (() => {
        const fups = (state.cursoBariatricos?.followups || []).filter((f) => f.scoreImpl);
        return fups.length > 0 ? (fups.reduce((a, f) => a + (+f.scoreImpl || 0), 0) / fups.length).toFixed(1) : "—";
      })(),
      riscosVermelhos: (state.cursoBariatricos?.followups || []).filter((f) => f.risco === "Vermelho").length,
    },
    endoscopistas: {
      medicos: state.cursoEndoscopistas?.medicos?.filter((m) => m.nome).length || 0,
      fups: state.cursoEndoscopistas?.followups?.length || 0,
      procedimentos: (state.cursoEndoscopistas?.followups || []).reduce((a, f) => a + (+f.procedimentos30d || 0), 0),
      avaliacoes: (state.cursoEndoscopistas?.followups || []).reduce((a, f) => a + (+f.avaliacoesAgendadas || 0), 0),
    },
    pacRef: {
      leads: state.pacientesReferidores?.length || 0,
      compareceram: state.pacientesReferidores?.filter((r) => r.statusComparecimento === "Compareceu").length || 0,
      procedimentos: state.pacientesReferidores?.filter((r) => r.procedimentoFechado === "Sim").length || 0,
      perdidos: state.pacientesReferidores?.filter((r) => r.statusFunil === "Perdido").length || 0,
      conv: (() => {
        const t = state.pacientesReferidores?.length || 0;
        const p = state.pacientesReferidores?.filter((r) => r.procedimentoFechado === "Sim").length || 0;
        return t > 0 ? ((p / t) * 100).toFixed(0) : 0;
      })(),
    },
    imersao: {
      medicos: state.imersaoMarketing?.medicos?.length || 0,
      fups: state.imersaoMarketing?.acoes?.length || 0,
      leadsOrganicos: (state.imersaoMarketing?.acoes || []).reduce((a, f) => a + (+f.leadsOrganicos || 0), 0),
      procedimentos: (state.imersaoMarketing?.acoes || []).reduce((a, f) => a + (+f.procedimentosGerados || 0), 0),
      geoMedio: (() => {
        const fups = (state.imersaoMarketing?.acoes || []).filter((f) => f.geoScore);
        return fups.length > 0 ? (fups.reduce((a, f) => a + (+f.geoScore || 0), 0) / fups.length).toFixed(1) : "—";
      })(),
    },
  };

  // Grand totals
  const aggStats = {
    totalProcedimentos: pStats.esgDay.procedimentos + pStats.aulasRef.procedimentos + pStats.leap.convertidos + pStats.bariatricos.procedimentos + pStats.endoscopistas.procedimentos + pStats.pacRef.procedimentos + pStats.imersao.procedimentos,
    totalLeads: pStats.leap.leads + pStats.pacRef.leads,
    totalMedicos: pStats.aulasRef.medicos + pStats.bariatricos.medicos + pStats.endoscopistas.medicos + pStats.imersao.medicos,
    totalEventos: pStats.esgDay.eventos,
    receitaESG: pStats.esgDay.receita,
  };

  const projectComponents = {
    esgDay: <EsgDayProject data={state.esgDay} onChange={(v) => updateProject("esgDay", v)} />,
    aulasReferidores: <AulasReferidoresProject data={state.aulasReferidores} onChange={(v) => updateProject("aulasReferidores", v)} />,
    campanhaInterna: <CampanhaInternaProject data={state.campanhaInterna} onChange={(v) => updateProject("campanhaInterna", v)} />,
    cursoBariatricos: <CursoBariatricosProject data={state.cursoBariatricos} onChange={(v) => updateProject("cursoBariatricos", v)} />,
    cursoEndoscopistas: <CursoEndoscopistasProject data={state.cursoEndoscopistas} onChange={(v) => updateProject("cursoEndoscopistas", v)} />,
    pacientesReferidores: <PacientesReferidoresProject data={state.pacientesReferidores} onChange={(v) => updateProject("pacientesReferidores", v)} />,
    imersaoMarketing: <ImersaoMarketingProject data={state.imersaoMarketing} onChange={(v) => updateProject("imersaoMarketing", v)} />,
  };

  const activeProjectMeta = FUP_PROJECTS.find((p) => p.id === activeProject);

  return (
    <div style={{ background: FUP_C.bg, minHeight: "100vh", color: FUP_C.text, fontFamily: "'DM Sans', 'Sora', system-ui, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: ${FUP_C.bg}; }
        ::-webkit-scrollbar-thumb { background: ${FUP_C.border}; border-radius: 3px; }
        input, select, textarea { font-family: inherit; }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
      `}</style>

      {/* HEADER */}
      <div style={{
        background: FUP_C.card, borderBottom: `1px solid ${FUP_C.border}`,
        padding: "16px 32px", display: "flex", alignItems: "center", gap: 16,
        position: "sticky", top: 0, zIndex: 100,
      }}>
        {activeProject && (
          <button onClick={() => setActiveProject(null)} style={{
            background: "transparent", border: `1px solid ${FUP_C.border}`, borderRadius: 8,
            color: FUP_C.textMuted, padding: "6px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600,
          }}>← Voltar</button>
        )}
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 32, height: 32, background: `linear-gradient(135deg, ${FUP_C.teal}, ${FUP_C.tealDark})`, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>📌</div>
          <div>
            <div style={{ color: FUP_C.textDim, fontSize: 11, fontWeight: 600, letterSpacing: "0.08em", textTransform: "uppercase" }}>ESG Intelligence Hub</div>
            <div style={{ color: FUP_C.text, fontSize: 15, fontWeight: 700 }}>
              {activeProjectMeta ? activeProjectMeta.label : "FUP Projetos"}
            </div>
          </div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 16, alignItems: "center" }}>
          {!activeProject && (
            <>
              <div style={{ textAlign: "right" }}>
                <div style={{ color: FUP_C.textDim, fontSize: 10, letterSpacing: "0.06em" }}>PROCEDIMENTOS</div>
                <div style={{ color: FUP_C.teal, fontSize: 18, fontWeight: 800 }}>{aggStats.totalProcedimentos}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ color: FUP_C.textDim, fontSize: 10, letterSpacing: "0.06em" }}>MÉDICOS</div>
                <div style={{ color: FUP_C.text, fontSize: 18, fontWeight: 800 }}>{aggStats.totalMedicos}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ color: FUP_C.textDim, fontSize: 10, letterSpacing: "0.06em" }}>LEADS</div>
                <div style={{ color: FUP_C.purple, fontSize: 18, fontWeight: 800 }}>{aggStats.totalLeads}</div>
              </div>
            </>
          )}
          {activeProjectMeta && (
            <div style={{
              width: 36, height: 36, borderRadius: 10,
              background: `${activeProjectMeta.color}22`, border: `1px solid ${activeProjectMeta.color}44`,
              display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18,
            }}>{activeProjectMeta.icon}</div>
          )}
        </div>
      </div>

      <div style={{ padding: "32px" }}>
        {!activeProject ? (
          <>
            {/* ── GRAND TOTAL BAR ── */}
            <div style={{
              background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 14,
              padding: "18px 24px", marginBottom: 24,
              display: "flex", gap: 0, flexWrap: "wrap", overflow: "hidden",
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", marginBottom: 14 }}>
                <div style={{ color: FUP_C.textDim, fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>
                  {syncing ? "🔄 Sincronizando dados do time..." : "Consolidado — Todos os 7 Projetos"}
                </div>
                {!syncing && <button onClick={() => { setSyncing(true); fupLoadRemote().then((r) => { if (r && Object.keys(r).length > 0) { setState(r); fupSaveData(r); } setSyncing(false); }); }} style={{ background: "transparent", border: "1px solid " + FUP_C.border, borderRadius: 8, color: FUP_C.textMuted, fontSize: 11, fontWeight: 600, cursor: "pointer", padding: "4px 12px", fontFamily: "inherit" }}>🔄 Sincronizar</button>}
              </div>
              {[
                { label: "Procedimentos Totais", value: aggStats.totalProcedimentos, color: FUP_C.green, icon: "✓" },
                { label: "Leads em Funil", value: aggStats.totalLeads, color: FUP_C.purple, icon: "👥" },
                { label: "Médicos Engajados", value: aggStats.totalMedicos, color: FUP_C.blue, icon: "👨‍⚕️" },
                { label: "Eventos Realizados", value: aggStats.totalEventos, color: FUP_C.teal, icon: "🎯" },
                { label: "Receita ESG Day", value: aggStats.receitaESG > 0 ? `R$ ${(aggStats.receitaESG/1000).toFixed(0)}k` : "—", color: FUP_C.teal, icon: "💰" },
              ].map((s, i) => (
                <div key={i} style={{
                  flex: 1, minWidth: 120, padding: "0 20px",
                  borderLeft: i > 0 ? `1px solid ${FUP_C.border}` : "none",
                }}>
                  <div style={{ color: FUP_C.textDim, fontSize: 10, fontWeight: 600, letterSpacing: "0.08em", marginBottom: 6 }}>{s.label}</div>
                  <div style={{ color: s.color, fontSize: 26, fontWeight: 800, lineHeight: 1 }}>{s.value}</div>
                </div>
              ))}
            </div>

            {/* ── PER-PROJECT SNAPSHOT STRIP ── */}
            <div style={{ marginBottom: 28 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
                <div style={{ width: 4, height: 20, background: FUP_C.teal, borderRadius: 2 }} />

              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 10 }}>
                {/* ESG Day */}
                <div onClick={() => setActiveProject("esgDay")} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 16, cursor: "pointer", borderLeft: `3px solid ${FUP_C.teal}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                    <span style={{ color: FUP_C.teal, fontSize: 13, fontWeight: 700 }}>🎯 ESG Day</span>
                    <span style={{ color: FUP_C.textDim, fontSize: 11 }}>{pStats.esgDay.eventos} eventos</span>
                  </div>
                  <div style={{ display: "flex", gap: 16 }}>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>COMPARECERAM</div><div style={{ color: FUP_C.text, fontSize: 18, fontWeight: 700 }}>{pStats.esgDay.compareceram}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>PROCEDIMENTOS</div><div style={{ color: FUP_C.green, fontSize: 18, fontWeight: 700 }}>{pStats.esgDay.procedimentos}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>CONVERSÃO</div><div style={{ color: +pStats.esgDay.conv >= 40 ? FUP_C.green : +pStats.esgDay.conv >= 25 ? FUP_C.yellow : FUP_C.red, fontSize: 18, fontWeight: 700 }}>{pStats.esgDay.conv}%</div></div>
                  </div>
                </div>
                {/* Aulas Referidores */}
                <div onClick={() => setActiveProject("aulasReferidores")} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 16, cursor: "pointer", borderLeft: `3px solid ${FUP_C.blue}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                    <span style={{ color: FUP_C.blue, fontSize: 13, fontWeight: 700 }}>📚 Aulas Referidores</span>
                    <span style={{ color: FUP_C.textDim, fontSize: 11 }}>{pStats.aulasRef.medicos} médicos</span>
                  </div>
                  <div style={{ display: "flex", gap: 16 }}>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>COM CRM</div><div style={{ color: FUP_C.blue, fontSize: 18, fontWeight: 700 }}>{pStats.aulasRef.comCRM}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>INDICAÇÕES</div><div style={{ color: FUP_C.text, fontSize: 18, fontWeight: 700 }}>{pStats.aulasRef.indicacoes}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>PROCED.</div><div style={{ color: FUP_C.green, fontSize: 18, fontWeight: 700 }}>{pStats.aulasRef.procedimentos}</div></div>
                  </div>
                </div>
                {/* Leap Plus */}
                <div onClick={() => setActiveProject("campanhaInterna")} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 16, cursor: "pointer", borderLeft: `3px solid ${FUP_C.purple}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                    <span style={{ color: FUP_C.purple, fontSize: 13, fontWeight: 700 }}>🔗 Campanha Interna</span>
                    <span style={{ color: FUP_C.textDim, fontSize: 11 }}>{pStats.leap.leads} leads</span>
                  </div>
                  <div style={{ display: "flex", gap: 16 }}>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>CONTATADOS</div><div style={{ color: FUP_C.text, fontSize: 18, fontWeight: 700 }}>{pStats.leap.contatados}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>CONVERTIDOS</div><div style={{ color: FUP_C.green, fontSize: 18, fontWeight: 700 }}>{pStats.leap.convertidos}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>PERDIDOS</div><div style={{ color: FUP_C.red, fontSize: 18, fontWeight: 700 }}>{pStats.leap.perdidos}</div></div>
                  </div>
                </div>
                {/* Curso Bariatricos */}
                <div onClick={() => setActiveProject("cursoBariatricos")} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 16, cursor: "pointer", borderLeft: `3px solid ${FUP_C.orange}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                    <span style={{ color: FUP_C.orange, fontSize: 13, fontWeight: 700 }}>🏥 Cirurgiões Bariátricos</span>
                    <span style={{ color: FUP_C.textDim, fontSize: 11 }}>{pStats.bariatricos.medicos} médicos</span>
                  </div>
                  <div style={{ display: "flex", gap: 16 }}>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>FUPs</div><div style={{ color: FUP_C.text, fontSize: 18, fontWeight: 700 }}>{pStats.bariatricos.fups}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>PROCED.</div><div style={{ color: FUP_C.green, fontSize: 18, fontWeight: 700 }}>{pStats.bariatricos.procedimentos}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>SCORE MÉD.</div><div style={{ color: pStats.bariatricos.scoreMedio >= 7 ? FUP_C.green : pStats.bariatricos.scoreMedio >= 4 ? FUP_C.yellow : FUP_C.textDim, fontSize: 18, fontWeight: 700 }}>{pStats.bariatricos.scoreMedio}</div></div>
                    {pStats.bariatricos.riscosVermelhos > 0 && <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>⚠ RISCO</div><div style={{ color: FUP_C.red, fontSize: 18, fontWeight: 700 }}>{pStats.bariatricos.riscosVermelhos}</div></div>}
                  </div>
                </div>
                {/* Curso Endoscopistas */}
                <div onClick={() => setActiveProject("cursoEndoscopistas")} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 16, cursor: "pointer", borderLeft: `3px solid ${FUP_C.green}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                    <span style={{ color: FUP_C.green, fontSize: 13, fontWeight: 700 }}>🔬 Endoscopistas</span>
                    <span style={{ color: FUP_C.textDim, fontSize: 11 }}>{pStats.endoscopistas.medicos} médicos</span>
                  </div>
                  <div style={{ display: "flex", gap: 16 }}>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>FUPs</div><div style={{ color: FUP_C.text, fontSize: 18, fontWeight: 700 }}>{pStats.endoscopistas.fups}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>PROCED.</div><div style={{ color: FUP_C.green, fontSize: 18, fontWeight: 700 }}>{pStats.endoscopistas.procedimentos}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>AVALIAÇÕES</div><div style={{ color: FUP_C.teal, fontSize: 18, fontWeight: 700 }}>{pStats.endoscopistas.avaliacoes}</div></div>
                  </div>
                </div>
                {/* Pacientes Referidores */}
                <div onClick={() => setActiveProject("pacientesReferidores")} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 16, cursor: "pointer", borderLeft: "3px solid #F43F5E" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                    <span style={{ color: "#F43F5E", fontSize: 13, fontWeight: 700 }}>👥 Pac. Referidores</span>
                    <span style={{ color: FUP_C.textDim, fontSize: 11 }}>{pStats.pacRef.leads} leads</span>
                  </div>
                  <div style={{ display: "flex", gap: 16 }}>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>COMPAREC.</div><div style={{ color: FUP_C.text, fontSize: 18, fontWeight: 700 }}>{pStats.pacRef.compareceram}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>PROCED.</div><div style={{ color: FUP_C.green, fontSize: 18, fontWeight: 700 }}>{pStats.pacRef.procedimentos}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>CONV.</div><div style={{ color: +pStats.pacRef.conv >= 40 ? FUP_C.green : +pStats.pacRef.conv >= 25 ? FUP_C.yellow : FUP_C.textDim, fontSize: 18, fontWeight: 700 }}>{pStats.pacRef.conv}%</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>PERDIDOS</div><div style={{ color: FUP_C.red, fontSize: 18, fontWeight: 700 }}>{pStats.pacRef.perdidos}</div></div>
                  </div>
                </div>
                {/* Imersão Marketing */}
                <div onClick={() => setActiveProject("imersaoMarketing")} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 16, cursor: "pointer", borderLeft: `3px solid ${FUP_C.yellow}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
                    <span style={{ color: FUP_C.yellow, fontSize: 13, fontWeight: 700 }}>📡 Imersão Marketing</span>
                    <span style={{ color: FUP_C.textDim, fontSize: 11 }}>{pStats.imersao.medicos} médicos</span>
                  </div>
                  <div style={{ display: "flex", gap: 16 }}>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>GEO MÉD.</div><div style={{ color: FUP_C.yellow, fontSize: 18, fontWeight: 700 }}>{pStats.imersao.geoMedio}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>LEADS ORG.</div><div style={{ color: FUP_C.teal, fontSize: 18, fontWeight: 700 }}>{pStats.imersao.leadsOrganicos}</div></div>
                    <div><div style={{ color: FUP_C.textDim, fontSize: 10 }}>PROCED.</div><div style={{ color: FUP_C.green, fontSize: 18, fontWeight: 700 }}>{pStats.imersao.procedimentos}</div></div>
                  </div>
                </div>
              </div>
            </div>

            {/* PROJECT GRID */}
            <div style={{ marginBottom: 20 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 24 }}>
                <div style={{ width: 4, height: 24, background: FUP_C.teal, borderRadius: 2 }} />
                <h2 style={{ color: FUP_C.text, fontSize: 20, fontWeight: 700 }}>Projetos em Andamento</h2>
                <span style={{ color: FUP_C.textDim, fontSize: 13, marginLeft: 4 }}>{FUP_PROJECTS.length} projetos</span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 16 }}>
                {FUP_PROJECTS.map((p) => {
                  // get record count for badge
                  let count = 0;
                  if (p.id === "esgDay") count = state.esgDay?.length || 0;
                  else if (p.id === "aulasReferidores") count = state.aulasReferidores?.length || 0;
                  else if (p.id === "campanhaInterna") count = state.campanhaInterna?.length || 0;
                  else if (p.id === "cursoBariatricos") count = state.cursoBariatricos?.medicos?.length || 0;
                  else if (p.id === "cursoEndoscopistas") count = state.cursoEndoscopistas?.medicos?.filter((m) => m.nome).length || 0;
                  else if (p.id === "pacientesReferidores") count = state.pacientesReferidores?.length || 0;
                  else if (p.id === "imersaoMarketing") count = state.imersaoMarketing?.medicos?.length || 0;

                  return (
                    <div key={p.id}
                      onClick={() => setActiveProject(p.id)}
                      style={{
                        background: FUP_C.card, border: `1px solid ${FUP_C.border}`,
                        borderRadius: 14, padding: 24, cursor: "pointer",
                        transition: "all 0.2s", position: "relative", overflow: "hidden",
                      }}
                      onMouseEnter={(e) => {
                        e.currentTarget.style.border = `1px solid ${p.color}44`;
                        e.currentTarget.style.background = FUP_C.cardHover;
                        e.currentTarget.style.transform = "translateY(-2px)";
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.border = `1px solid ${FUP_C.border}`;
                        e.currentTarget.style.background = FUP_C.card;
                        e.currentTarget.style.transform = "translateY(0)";
                      }}
                    >
                      {/* accent bar */}
                      <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3, background: p.color, borderRadius: "14px 14px 0 0" }} />
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                        <div style={{ fontSize: 28 }}>{p.icon}</div>
                        <div style={{
                          background: `${p.color}22`, border: `1px solid ${p.color}44`,
                          color: p.color, fontSize: 11, fontWeight: 700, padding: "3px 10px", borderRadius: 20,
                        }}>{count} registros</div>
                      </div>
                      <div style={{ color: FUP_C.text, fontWeight: 700, fontSize: 15, marginBottom: 8 }}>{p.label}</div>
                      <div style={{ color: FUP_C.textMuted, fontSize: 12, lineHeight: 1.5 }}>{p.desc}</div>
                      <div style={{ marginTop: 16, display: "flex", justifyContent: "flex-end" }}>
                        <span style={{ color: p.color, fontSize: 12, fontWeight: 600 }}>Acessar →</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        ) : (
          <div>
            {/* Project header */}
            <div style={{
              background: FUP_C.card, border: `1px solid ${FUP_C.border}`,
              borderRadius: 14, padding: "20px 24px", marginBottom: 24,
              borderTop: `3px solid ${activeProjectMeta?.color}`,
            }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ fontSize: 28 }}>{activeProjectMeta?.icon}</span>
                <div>
                  <div style={{ color: activeProjectMeta?.color, fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase" }}>Projeto Ativo</div>
                  <div style={{ color: FUP_C.text, fontSize: 22, fontWeight: 800 }}>{activeProjectMeta?.label}</div>
                  <div style={{ color: FUP_C.textMuted, fontSize: 13, marginTop: 2 }}>{activeProjectMeta?.desc}</div>
                </div>
              </div>
            </div>
            {projectComponents[activeProject]}
          </div>
        )}
      </div>

      {toast && <FupProjToast msg={toast.msg} type={toast.type} />}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("dashboard");

  return (
    <div className="app">
      <style>{css}</style>
      <header className="header">
        <div className="header-brand">
          <div className="header-logo">E</div>
          <div>
            <div className="header-title">ESG Intelligence Hub</div>
            <div className="header-sub">Boston Scientific · Endura</div>
          </div>
        </div>
        <nav className="nav">
          {TABS.map(t => (
            <button
              key={t.id}
              className={`nav-btn ${tab === t.id ? "active" : ""}`}
              onClick={() => setTab(t.id)}
            >
              {t.icon} {t.label}
            </button>
          ))}
        </nav>
      </header>
      <main className="main">
        {tab === "dashboard" && <Dashboard />}
        {tab === "visitas"   && <Visitas />}
        {tab === "medicos"   && <Medicos />}
        {tab === "ativacao"  && <Ativacao />}
        {tab === "intel"     && <Inteligencia />}
        {tab === "cartilha"  && <Cartilha />}
        {tab === "metas"     && <Metas />}
        {tab === "historico"  && <Historico />}
        {tab === "basedados"  && <BaseDados />}
        {tab === "consulta"   && <ConsultaMedico />}
        {tab === "fup"        && <FupProjetos />}
      </main>
    </div>
  );
}

// ─── METAS (injected) ──────────────────────────────────────────────────────


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
