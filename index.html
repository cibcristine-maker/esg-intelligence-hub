                      <div style={{fontSize:11.5,color:PLANO_C.muted}}>{stepInfo.foco}</div>
                      <div style={{fontSize:10,color:PLANO_C.muted,textTransform:"uppercase",margin:"12px 0 6px"}}>SLA de cobertura (Tier {c.score.raw.tier||"—"})</div>
                      <div style={{fontSize:11.5,color: c.score.raw.subVisita||c.score.raw.overVisiting ? PLANO_C.warn : PLANO_C.green}}>
                        {c.score.raw.visitas90Count} visita(s) em 90d — mín {c.score.raw.cadMin}, ideal {c.score.raw.cadIdeal}, máx {c.score.raw.cadMax}
                        {c.score.raw.subVisita && " — sub-cobertura"}
                        {c.score.raw.overVisiting && " — over-visiting"}
                      </div>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:PLANO_C.muted,textTransform:"uppercase",marginBottom:6}}>3 Pilares ESG (últimas 3 visitas)</div>
                      {[["glp1_esg","ESG pós-GLP-1"],["ancoragem","Ancoragem na consulta"],["crm","CRM / base parada"]].map(([k,lbl]) => (
                        <div key={k} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,marginBottom:6}}>
                          <span style={{color: c.score.pilares[k] ? PLANO_C.green : PLANO_C.red}}>{c.score.pilares[k] ? "✅" : "⬜"}</span>
                          <span style={{color:PLANO_C.text}}>{lbl}</span>
                        </div>
                      ))}
                      <div style={{fontSize:10,color:PLANO_C.muted,textTransform:"uppercase",margin:"12px 0 6px"}}>Ações prioritárias</div>
                      {c.acoes.length === 0
                        ? <div style={{fontSize:11.5,color:PLANO_C.green}}>✅ Nenhuma ação pendente no momento</div>
                        : c.acoes.map((a,i) => <div key={i} style={{fontSize:11.5,color:PLANO_C.text,marginBottom:4}}>• {a}</div>)
                      }
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
        {filtradas.length === 0 && (
          <div style={{textAlign:"center",padding:40,color:PLANO_C.muted}}>Nenhuma conta encontrada com esses filtros.</div>
        )}
      </div>
    </div>
  );
}

function PhysicianHealthScore() {
  const { data: medicos, loading: loadMed } = useSupabase("perfil_medico");
  const { data: todasVisitas, loading: loadVis } = useSupabase("visitas");
  const [selected, setSelected] = React.useState(null);
  const [filterZone, setFilterZone] = React.useState("all");
  const [search, setSearch] = React.useState("");
  const [activeView, setActiveView] = React.useState("portfolio");
  // GeoTrack data
  const [geoMedicos, setGeoMedicos] = React.useState([]);
  const [geoRegistros, setGeoRegistros] = React.useState([]);
  const [geoLoading, setGeoLoading] = React.useState(true);
  const [geoLastUpdate, setGeoLastUpdate] = React.useState(null);
  const [geoErro, setGeoErro] = React.useState(null);
  const [fupDataPHS, setFupDataPHS] = React.useState(null);

  React.useEffect(() => {
    // Busca fupData para calcular temEvento (ESG Day, cursos, etc.)
    if (supabaseClient) {
      supabaseClient.from("fup_projetos").select("data").eq("id","shared").single()
        .then(({ data }) => { if (data?.data) setFupDataPHS(data.data); });
    }
  }, []);

  React.useEffect(() => {
    async function loadGeo() {
      setGeoLoading(true);
      const [meds, regsGeo] = await Promise.all([
        fetchGeoTrack("medicos", "nome"),
        fetchGeoTrack("geo_monitor"),
      ]);
      // Só aceita arrays válidos
      if (Array.isArray(meds)) {
        setGeoMedicos(meds);
      } else {
        const errMsg = meds?._body ? `${meds._error}: ${String(meds._body).slice(0,60)}` : String(meds?._error || "desconhecido");
        setGeoErro(errMsg);
      }
      if (Array.isArray(regsGeo) && regsGeo.length > 0) {
        setGeoRegistros(regsGeo);
      } else if (regsGeo?._error) {
        setGeoErro(prev => prev || `geo_monitor: ${regsGeo._error}`);
      }
      setGeoLastUpdate(new Date());
      setGeoLoading(false);
    }
    loadGeo();
  }, []);

  // Normaliza string para matching tolerante
  function normStr(s) {
    if (!s) return "";
    var r = s.toLowerCase().normalize("NFD");
    var clean = "";
    for (var i = 0; i < r.length; i++) {
      var code = r.charCodeAt(i);
      if (code < 768 || code > 879) clean += r[i];
    }
    clean = clean.trim();
    if (clean.slice(0,4) === "dra.") clean = clean.slice(4).trim();
    else if (clean.slice(0,3) === "dr.") clean = clean.slice(3).trim();
    else if (clean.slice(0,4) === "dra ") clean = clean.slice(4).trim();
    else if (clean.slice(0,3) === "dr ") clean = clean.slice(3).trim();
    return clean;
  }

  // Extrai sobrenomes relevantes (ignora partículas)
  function sobrenomes(s) {
    const stop = new Set(["de","da","do","dos","das","e"]);
    return normStr(s).split(/\s+/).filter(w => w.length > 2 && !stop.has(w));
  }

  // Calcula score GEO para um médico pelo nome — matching multi-estratégia
  function calcGeoScore(medicoNome) {
    if (!geoMedicos.length) return null;

    // geoRegistros pode ser vazio mesmo com médicos — geo_monitor sem dados ainda
    // Continua para encontrar o médico e retornar null com contexto

    const nNorm = normStr(medicoNome);
    const nSobs = sobrenomes(medicoNome);

    // Estratégia 1: nomesBatem (função padrão do Hub)
    // Estratégia 2: comparação normalizada direta
    // Estratégia 3: slug do GeoTrack contém sobrenomes do Hub
    // Estratégia 4: dois ou mais sobrenomes em comum
    // Matching direto: normaliza os dois nomes e verifica se tokens do GeoTrack
    // estão todos presentes no nome do Hub (ou vice-versa)
    var geoMed = null;
    for (var gi = 0; gi < geoMedicos.length; gi++) {
      var gm = geoMedicos[gi];
      var gmNorm = normStr(gm.nome);
      var gmToks = sobrenomes(gm.nome);
      // Teste 1: exato
      if (gmNorm === nNorm) { geoMed = gm; break; }
      // Teste 2: substring
      if (nNorm.length > 4 && gmNorm.length > 4) {
        if (nNorm.indexOf(gmNorm) >= 0 || gmNorm.indexOf(nNorm) >= 0) { geoMed = gm; break; }
      }
      // Teste 3: todos tokens GeoTrack no Hub
      if (gmToks.length >= 1) {
        var allIn = true;
        for (var ti = 0; ti < gmToks.length; ti++) {
          if (nNorm.indexOf(gmToks[ti]) < 0) { allIn = false; break; }
        }
        if (allIn) { geoMed = gm; break; }
      }
      // Teste 4: todos tokens Hub no GeoTrack
      if (nSobs.length >= 1 && nSobs.length <= 3) {
        var allIn2 = true;
        for (var ti2 = 0; ti2 < nSobs.length; ti2++) {
          if (gmNorm.indexOf(nSobs[ti2]) < 0) { allIn2 = false; break; }
        }
        if (allIn2) { geoMed = gm; break; }
      }
      // Teste 5: primeiro token igual + sobrenome em comum
      if (gmToks.length >= 1 && nSobs.length >= 1) {
        if (gmToks[0] === nSobs[0]) {
          for (var si = 1; si < gmToks.length; si++) {
            if (nNorm.indexOf(gmToks[si]) >= 0) { geoMed = gm; break; }
          }
          if (geoMed) break;
          for (var si2 = 1; si2 < nSobs.length; si2++) {
            if (gmNorm.indexOf(nSobs[si2]) >= 0) { geoMed = gm; break; }
          }
          if (geoMed) break;
        }
      }
    }

    if (!geoMed) return null;
    // Pega todos os registros desse médico na tabela geo_monitor
    const regs = geoRegistros.filter(r => r.medico_id === geoMed.id);
    if (!regs.length) {
      // Médico encontrado mas sem registros de score ainda
      return { pct: 0, porPlat: [], semRegistros: true };
    }
    // Média de score por plataforma (escala 0-3 → 0-100)
    const PLATAFORMAS = ["chatgpt","gemini","perplexity","claude","grok"];
    const scoresPorPlat = PLATAFORMAS.map(pl => {
      const regsPlat = regs.filter(r => r.plataforma === pl && r.score != null);
      if (!regsPlat.length) return null;
      const avg = regsPlat.reduce((s, r) => s + Number(r.score), 0) / regsPlat.length;
      return avg;
    }).filter(s => s !== null);
    if (!scoresPorPlat.length) return null;
    const mediaGeral = scoresPorPlat.reduce((a, b) => a + b, 0) / scoresPorPlat.length;
    return {
      pct: Math.round((mediaGeral / 3) * 100),
      porPlat: PLATAFORMAS.map(pl => {
        const regsPlat = regs.filter(r => r.plataforma === pl && r.score != null);
        if (!regsPlat.length) return { pl, score: null };
        const avg = regsPlat.reduce((s, r) => s + Number(r.score), 0) / regsPlat.length;
        return { pl, score: Math.round((avg / 3) * 100) };
      }),
      geoMed,
    };
  }

  // ── Paleta interna (alinha com Hub) ──────────────────────────────────────
  const PC = {
    navy:    "#0D1B2A",
    navyMid: "#1A2E42",
    navyLt:  "#243B55",
    green:   "#00C896",
    amber:   "#F5A623",
    red:     "#E8445A",
    slate:   "#8FA3B8",
    white:   "#FFFFFF",
    offWhite:"#F0F4F8",
  };

  // ── Períodos de referência ─────────────────────────────────────────────
  const now = new Date();
  const cutoff90 = new Date(now); cutoff90.setDate(now.getDate() - 90);
  const cutoff45 = new Date(now); cutoff45.setDate(now.getDate() - 45);
  const cutoffPrev = new Date(now); cutoffPrev.setDate(now.getDate() - 180);

  // ── Cálculo do score por médico ───────────────────────────────────────
  function calcScore(medico, visitas, calcGeoScoreFn, fupData) {
    const visMed = visitas.filter(v => nomesBatem(v.medico_nome, medico.nome));
    const vis90  = visMed.filter(v => new Date(v.data_contato) >= cutoff90);
    const visPrev = visMed.filter(v => new Date(v.data_contato) >= cutoffPrev && new Date(v.data_contato) < cutoff90);

    // — DIMENSÃO 1: Volume de procedimentos (peso 30%) ————————————————
    const esgAtual  = vis90.reduce((s, v) => s + (Number(v.proc_realizados_esg) || 0), 0);
    const esgAnterior = visPrev.reduce((s, v) => s + (Number(v.proc_realizados_esg) || 0), 0);
    const bibAtual  = vis90.reduce((s, v) => {
      const b = v.baloes_estoque;
      return s + (typeof b === "number" ? b : 0);
    }, 0);

    // Score ESG: 0=0, 4=40, 8=80, 12+=100
    const scoreEsg = Math.min(100, esgAtual * 10);
    // Tendência ESG
    let scoreTrend = 50;
    if (esgAnterior > 0) {
      const delta = (esgAtual - esgAnterior) / esgAnterior;
      scoreTrend = delta >= 0.1 ? 90 : delta >= -0.1 ? 60 : 20;
    } else if (esgAtual > 0) {
      scoreTrend = 70;
    }
    // BIB não entra no score de procedimentos (produto separado)
    // Se zero ESG → score 0
    const dimProc = esgAtual === 0
      ? 0
      : Math.round((scoreEsg * 0.8 + scoreTrend * 0.2));

    // — DIMENSÃO 2: Coerência de Cobertura (peso 30%) ————————————————
    // Mede se a intensidade de visita é coerente com o potencial do médico (Tier)
    // Pontuação em U invertido: ideal = 100, sub-visita e over-visiting penalizam
    // Cadência esperada por trimestre (presencial + online):
    //   ST  → mín 3, ideal 4+ (sem teto)
    //   T1  → mín 2, ideal 3, máx 4
    //   T2/T3 → mín 1, ideal 2, máx 3
    //   T4/T5 → mín 1, ideal 1, máx 2
    const visitas90Count = vis90.length;
    const diasUltimaVisita = visMed.length > 0
      ? Math.floor((now - new Date([...visMed].sort((a,b) => new Date(b.data_contato)-new Date(a.data_contato))[0].data_contato)) / 86400000)
      : 999;

    const tier = String(medico.tier || "");
    const CADENCIA = {
      "ST": { min: 3, ideal: 4, max: Infinity },
      "1":  { min: 2, ideal: 3, max: 4 },
      "2":  { min: 1, ideal: 2, max: 3 },
      "3":  { min: 1, ideal: 2, max: 3 },
      "4":  { min: 1, ideal: 1, max: 2 },
      "5":  { min: 1, ideal: 1, max: 2 },
    };
    const cad = CADENCIA[tier] || { min: 1, ideal: 2, max: 3 };
    const v = visitas90Count;

    let dimEng;
    if (v === 0) {
      dimEng = 0; // zero visitas = zero score sempre
    } else if (tier === "ST") {
      // ST: sem teto — escala linear até ideal, depois mantém 100
      dimEng = v >= cad.ideal ? 100 : Math.round((v / cad.ideal) * 80);
    } else if (v < cad.min) {
      // Sub-visita: escala 0 → 60 até atingir mínimo
      dimEng = Math.round((v / cad.min) * 60);
    } else if (v <= cad.ideal) {
      // Entre mínimo e ideal: escala 70 → 100
      dimEng = Math.round(70 + ((v - cad.min) / (cad.ideal - cad.min)) * 30);
    } else if (v <= cad.max) {
      // Entre ideal e máximo: mantém 100
      dimEng = 100;
    } else {
      dimEng = 100;
    }

    // Alerta de sub-cobertura ou over-visiting
    const overVisiting = cad.max !== Infinity && v > cad.max;
    const subVisita = v < cad.min && v > 0;

    // — DIMENSÃO 3: Presença Digital / GEO (peso 20%) ———————————————
    // Dados reais do GeoTrack (Supabase separado) — tabela geo_monitor
    // Escala 0-3 por questão/plataforma → média → 0-100
    const geoResult = calcGeoScoreFn ? calcGeoScoreFn(medico.nome) : null;
    let dimGeo;
    let geoSemDados = false;
    if (geoResult && !geoResult.semRegistros) {
      dimGeo = geoResult.pct;
    } else if (medico.geo_score != null) {
      dimGeo = Math.round((medico.geo_score / 3) * 100);
    } else {
      dimGeo = null;
      geoSemDados = true;
    }

    // — DIMENSÃO 4: Desfechos Clínicos (peso 15%) ————————————————————
    // Proxy: % visitas com proc_realizados > 0 e consistência trimestral
    const visComEsg = vis90.filter(v => Number(v.proc_realizados_esg) > 0).length;
    const consistencia = vis90.length > 0 ? (visComEsg / vis90.length) : 0;
    // Sem dados diretos de EWL, usamos consistência de realização como proxy
    const dimDesfechos = vis90.length === 0 ? 30 : Math.round(
      consistencia >= 0.8 ? 85 :
      consistencia >= 0.5 ? 65 :
      consistencia >= 0.2 ? 45 : 25
    );

    // — DIMENSÃO 5 REMOVIDA (lealdade sem dado confiável no contexto ESG)

    // — DIMENSÃO 4 REDEFINIDA: Adoção do Ecossistema (peso 10%) ————————
    // 50% Proctor | 30% LeãoPlus ativo | 20% Evento Endura (FUP Projetos)
    const isProctor = !!medico.is_proctor;
    // LeãoPlus: usa últimas 3 visitas — se maioria = adocao_ativa, pontua cheio
    const vis3 = visMed.slice(0, 3);
    const leaoAtivo = vis3.filter(v => v.leao_plus_abordado === "adocao_ativa").length;
    const leaoEvol  = vis3.filter(v => v.leao_plus_abordado === "em_avaliacao").length;
    const scoreLeao = vis3.length === 0 ? 0
      : leaoAtivo >= 2 ? 100
      : leaoAtivo === 1 ? 70
      : leaoEvol  >= 1 ? 35
      : 0;
    // Evento Endura: via FUP Projetos — verifica se médico aparece em algum projeto
    const temEvento = fupData ? (
      (fupData.cursoBariatricos?.medicos||[]).some(m2 => nomesBatem(m2.nome, medico.nome)) ||
      (fupData.cursoEndoscopistas?.medicos||[]).some(m2 => nomesBatem(m2.nome, medico.nome)) ||
      (fupData.imersaoMarketing?.medicos||[]).some(m2 => nomesBatem(m2.nome, medico.nome)) ||
      (fupData.aulasReferidores?.eventos||[]).some(e => nomesBatem(e.medico, medico.nome)) ||
      (fupData.esgDay||[]).some(e => nomesBatem(e.medico, medico.nome) || nomesBatem(e.clinica, medico.nome))
    ) : false;
    const scoreEvento = temEvento ? 100 : 0;
    const dimAdocao = Math.round(
      (isProctor ? 100 : 0) * 0.50 +
      scoreLeao              * 0.30 +
      scoreEvento            * 0.20
    );

    // — SCORE FINAL (ponderado) ————————————————————————————————————————
    // Se GEO sem dados: redistribui 20% para Procedimentos (25%) e Engajamento (15%)
    // Com dados: Procedimentos 40% | Engajamento 30% | GEO 20% | Adoção 10%
    const _proc = isNaN(dimProc) ? 0 : dimProc;
    const _eng  = isNaN(dimEng)  ? 0 : dimEng;
    const _geo  = isNaN(dimGeo)  ? 0 : (dimGeo || 0);
    const _adoc = isNaN(dimAdocao) ? 0 : dimAdocao;
    // Zero ESG em 90 dias → score total 0 (sem procedimentos = sem resultado comercial)
    const total = esgAtual === 0 ? 0 : (geoSemDados
      ? Math.round(_proc * 0.50 + _eng * 0.35 + _adoc * 0.15)
      : Math.round(_proc * 0.40 + _eng * 0.30 + _geo  * 0.20 + _adoc * 0.10));

    // — ALERTAS ————————————————————————————————————————————————————————
    const alertas = [];
    if (esgAnterior > 0 && (esgAtual / esgAnterior) < 0.85) alertas.push("⚠ Queda >15% em procedimentos");
    if (total < 40) alertas.push("🔴 Score crítico — intervenção urgente");
    if (!geoSemDados && dimGeo < 35) alertas.push("🌐 Invisibilidade digital crítica");
    if (geoSemDados) alertas.push("🌐 Sem dados GEO — cadastrar no GeoTrack");
    if (diasUltimaVisita > 45 && total < 80) alertas.push(`📅 Sem visita há ${diasUltimaVisita}d`);
    if (overVisiting) alertas.push(`📋 Over-visiting — ${v} visitas para Tier ${tier} (máx ${cad.max})`);
    if (subVisita) alertas.push(`📋 Sub-cobertura — ${v} visita(s) para Tier ${tier} (mín ${cad.min})`);

    const visComDado = vis90.filter(v2 => v2.proc_realizados_esg !== null && v2.proc_realizados_esg !== undefined && v2.proc_realizados_esg !== "").length;
    const confiabilidade = vis90.length > 0 ? Math.round((visComDado / vis90.length) * 100) : null;
    if (confiabilidade !== null && confiabilidade < 50 && vis90.length >= 2) alertas.push("⚠ Dado incompleto: preencher proc_realizados nas visitas");

    return {
      total,
      dims: {
        procedimentos: dimProc,
        engajamento:   dimEng,
        digital:       dimGeo,
        adocao:        dimAdocao,
      },
      raw: { esgAtual, esgAnterior, bibAtual, visitas90Count, diasUltimaVisita,
             consistencia, isProctor, scoreLeao, temEvento,
             cadMin: cad.min, cadIdeal: cad.ideal, cadMax: cad.max === Infinity ? "∞" : cad.max,
             overVisiting, subVisita, tier,
             geoResult, geoSemDados, dimGeo,
             visComDado, confiabilidade },
      alertas,
    };
  }

  // ── Zona e cor ────────────────────────────────────────────────────────
  function zone(score) { return score >= 80 ? "green" : score >= 50 ? "yellow" : "red"; }
  function zoneColor(z) { return { green: PC.green, yellow: PC.amber, red: PC.red }[z]; }
  function zoneLabel(z) { return { green: "Saudável", yellow: "Atenção", red: "Em Risco" }[z]; }

  // ── Dados computados ──────────────────────────────────────────────────
  const scoredMedicos = React.useMemo(() => {
    if (!medicos || !todasVisitas) return [];
    return medicos.map(m => ({
      ...m,
      _score: calcScore(m, todasVisitas, calcGeoScore, fupDataPHS),
    })).sort((a, b) => b._score.total - a._score.total);
  }, [medicos, todasVisitas, geoMedicos, geoRegistros, fupDataPHS]);

  const filtrados = scoredMedicos.filter(m => {
    const z = zone(m._score.total);
    if (filterZone !== "all" && z !== filterZone) return false;
    if (search && !m.nome?.toLowerCase().includes(search.toLowerCase()) &&
        !m.estado?.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const counts = { green: 0, yellow: 0, red: 0 };
  scoredMedicos.forEach(m => counts[zone(m._score.total)]++);
  const validScores = scoredMedicos.filter(m => !isNaN(m._score.total) && m._score.total != null);
  const avgScore = validScores.length
    ? Math.round(validScores.reduce((s, m) => s + m._score.total, 0) / validScores.length)
    : 0;

  // ── Eficiência de Visitas por Tier (Over/Under Visiting) ────────────────
  const visitEfficiencyByTier = React.useMemo(() => {
    const tiers = {};
    scoredMedicos.forEach(m => {
      const raw = m._score?.raw;
      if (!raw) return;
      const t = raw.tier || "—";
      if (!tiers[t]) tiers[t] = { tier: t, over: 0, under: 0, ideal: 0, total: 0, cadMin: raw.cadMin, cadIdeal: raw.cadIdeal, cadMax: raw.cadMax };
      tiers[t].total++;
      if (raw.overVisiting) tiers[t].over++;
      else if (raw.subVisita) tiers[t].under++;
      else tiers[t].ideal++;
    });
    const order = ["ST", "1", "2", "3", "4", "5", "—"];
    return Object.values(tiers).sort((a, b) => order.indexOf(a.tier) - order.indexOf(b.tier));
  }, [scoredMedicos]);

  const totalOver = visitEfficiencyByTier.reduce((s, t) => s + t.over, 0);
  const totalUnder = visitEfficiencyByTier.reduce((s, t) => s + t.under, 0);
  const totalIdeal = visitEfficiencyByTier.reduce((s, t) => s + t.ideal, 0);

  // ── Alerta de Inatividade — cruza dias sem visita com intervalo esperado por Tier ──
  const inactivityAlerts = React.useMemo(() => {
    return scoredMedicos.map(m => {
      const raw = m._score?.raw;
      if (!raw) return null;
      const dias = raw.diasUltimaVisita;
      const cadIdeal = raw.cadIdeal || 2;
      // Intervalo esperado entre visitas = 90 dias / cadência ideal no período
      const intervaloEsperado = Math.round(90 / cadIdeal);
      const atrasoRatio = dias === 999 ? Infinity : dias / intervaloEsperado;
      let nivel = null;
      if (dias === 999) nivel = "nunca"; // sem nenhuma visita registrada
      else if (atrasoRatio >= 2) nivel = "critico"; // 2x+ o intervalo esperado
      else if (atrasoRatio >= 1.3) nivel = "atencao"; // 30%+ acima do esperado
      if (!nivel) return null;
      return { nome: m.nome, tier: raw.tier || "—", dias, intervaloEsperado, nivel };
    }).filter(Boolean).sort((a, b) => (b.dias === 999 ? 9999 : b.dias) - (a.dias === 999 ? 9999 : a.dias));
  }, [scoredMedicos]);

  const [showInactivityDetail, setShowInactivityDetail] = React.useState(false);
  const countCritico = inactivityAlerts.filter(a => a.nivel === "critico").length;
  const countNunca = inactivityAlerts.filter(a => a.nivel === "nunca").length;
  const countAtencao = inactivityAlerts.filter(a => a.nivel === "atencao").length;

  // ── Playbooks ─────────────────────────────────────────────────────────


  const DIM_LABELS = [
    { id: "procedimentos", label: "Procedimentos",    icon: "🔬", weight: "40%" },
    { id: "engajamento",   label: "Cobertura",        icon: "📅", weight: "30%" },
    { id: "digital",       label: "GEO Digital",      icon: "🌐", weight: "20%" },
    { id: "adocao",        label: "Adoção Ecossistema", icon: "🏅", weight: "10%" },
  ];

  // ── ScoreRing ─────────────────────────────────────────────────────────
  function ScoreRing({ score, size = 64 }) {
    const z = zone(score);
    const color = zoneColor(z);
    const r = (size - 6) / 2;
    const circ = 2 * Math.PI * r;
    const dash = (score / 100) * circ;
    return (
      <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
        <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={PC.navyLt} strokeWidth={5} />
          <circle cx={size/2} cy={size/2} r={r} fill="none"
            stroke={color} strokeWidth={5}
            strokeDasharray={`${dash} ${circ-dash}`} strokeLinecap="round"
            style={{ transition: "stroke-dasharray 0.5s ease" }}
          />
        </svg>
        <div style={{ position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
          <span style={{ fontSize: size*0.28, fontWeight:800, color, lineHeight:1 }}>{score}</span>
        </div>
      </div>
    );
  }

  if (loadMed || loadVis) return (
    <div style={{ padding: 40, textAlign: "center", color: PC.slate }}>
      Carregando dados dos médicos...
    </div>
  );

  // Badge de status GeoTrack
  const GeoBadge = () => (
    <div style={{
      display:"inline-flex", alignItems:"center", gap:6,
      background: geoLoading ? "rgba(245,166,35,0.12)" : geoErro ? "rgba(232,68,90,0.12)" : geoMedicos.length ? "rgba(0,200,150,0.12)" : "rgba(245,166,35,0.12)",
      border: `1px solid ${geoLoading ? "rgba(245,166,35,0.3)" : geoErro ? "rgba(232,68,90,0.3)" : geoMedicos.length ? "rgba(0,200,150,0.3)" : "rgba(245,166,35,0.3)"}`,
      borderRadius:20, padding:"3px 10px", fontSize:10, fontWeight:700,
      color: geoLoading ? PC.amber : geoMedicos.length ? PC.green : PC.red,
    }}>
      <div style={{ width:6, height:6, borderRadius:"50%", 
        background: geoLoading ? PC.amber : geoMedicos.length ? PC.green : PC.red,
        animation: geoLoading ? "pulse 1.5s infinite" : "none"
      }}/>
      {geoLoading ? "GeoTrack carregando..." 
        : geoErro ? `GeoTrack ✗ erro: ${geoErro}`
        : geoMedicos.length && geoRegistros.length ? `GeoTrack ✓ ${geoMedicos.length} médicos · ${geoRegistros.length} scores`
        : geoMedicos.length ? `GeoTrack: ${geoMedicos.length} médicos · geo_monitor vazio`
        : geoLoading ? "GeoTrack carregando..."
        : "GeoTrack: sem dados"}
    </div>
  );

  const sel = selected ? scoredMedicos.find(m => m.id === selected) : null;

  return (
    <div style={{ padding: "20px 24px", fontFamily: "'DM Sans', sans-serif", color: PC.white }}>

      {/* Header */}
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:20, flexWrap:"wrap", gap:12 }}>
        <div>
          <div style={{ fontSize:10, color: PC.green, fontWeight:700, letterSpacing:2, marginBottom:4 }}>
            ESG INTELLIGENCE HUB · CUSTOMER SUCCESS
          </div>
          <h2 style={{ margin:0, fontSize:22, fontWeight:800,
            background:`linear-gradient(90deg, ${PC.white}, ${PC.green})`,
            WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>
            Saúde da Conta
          </h2>
          <div style={{ fontSize:12, color: PC.slate, marginTop:3 }}>
            Score 0–100 calculado com dados reais de visitas · {scoredMedicos.length} médicos na carteira
          </div>
          <div style={{ marginTop:8, display:"flex", alignItems:"center", gap:8 }}>
            <GeoBadge />
            {(geoErro || (!geoLoading && !geoMedicos.length)) && (
              <span style={{ fontSize:10, color:"#E8445A", background:"rgba(232,68,90,0.1)",
                border:"1px solid rgba(232,68,90,0.3)", borderRadius:6, padding:"2px 8px" }}>
                {geoErro ? `Erro: ${geoErro}` : "Não conectou"}
              </span>
            )}
          </div>
        </div>
        <div style={{ display:"flex", gap:6 }}>
          {["portfolio","framework"].map(v => (
            <button key={v} onClick={() => setActiveView(v)} style={{
              background: activeView===v ? PC.green : PC.navyLt,
              color: activeView===v ? PC.navy : PC.slate,
              border:"none", borderRadius:8, padding:"8px 16px",
              fontSize:12, fontWeight:700, cursor:"pointer", transition:"all 0.2s",
            }}>
              {v === "portfolio" ? "📋 Portfólio" : "🏗️ Framework"}
            </button>
          ))}
        </div>
      </div>

      {activeView === "framework" ? (
        /* ─── FRAMEWORK VIEW ─────────────────────────────────────────────── */
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
          {/* Dimensões */}
          <div style={{ background: PC.navyMid, borderRadius:12, padding:"18px 20px", border:`1px solid ${PC.navyLt}` }}>
            <div style={{ fontSize:11, color: PC.green, fontWeight:700, letterSpacing:1, marginBottom:14 }}>
              5 DIMENSÕES PONDERADAS
            </div>
            {DIM_LABELS.map(d => (
              <div key={d.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 0",
                borderBottom:`1px solid ${PC.navyLt}` }}>
                <span style={{ fontSize:20 }}>{d.icon}</span>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:600, color: PC.offWhite }}>{d.label}</div>
                </div>
                <span style={{ background:`${PC.green}22`, color: PC.green, fontSize:12, fontWeight:700,
                  padding:"3px 10px", borderRadius:20, border:`1px solid ${PC.green}44` }}>
                  {d.weight}
                </span>
              </div>
            ))}
          </div>

          {/* Zonas e alertas */}
          <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
            {[
              { z:"green", label:"VERDE 80–100", desc:"Expansão: Advisory Board, co-criação, novos produtos" },
              { z:"yellow", label:"AMARELO 50–79", desc:"Reativação: diagnóstico, briefing IA, refresh protocolo" },
              { z:"red", label:"VERMELHO < 50", desc:"Intervenção: reunião urgente, GEO, investigar concorrente" },
            ].map(({ z, label, desc }) => (
              <div key={z} style={{ background: zoneColor(z)+"14", border:`1.5px solid ${zoneColor(z)}44`,
                borderRadius:10, padding:"14px 16px" }}>
                <div style={{ fontSize:13, fontWeight:700, color: zoneColor(z), marginBottom:4 }}>{label}</div>
                <div style={{ fontSize:12, color: PC.slate, lineHeight:1.5 }}>{desc}</div>
              </div>
            ))}
            <div style={{ background: PC.navyMid, borderRadius:10, padding:"14px 16px", border:`1px solid ${PC.navyLt}` }}>
              <div style={{ fontSize:11, color: PC.amber, fontWeight:700, letterSpacing:1, marginBottom:8 }}>
                ALERTAS AUTOMÁTICOS
              </div>
              {[
                "Queda >15% em procedimentos vs. período anterior",
                "Score total abaixo de 40",
                "Invisibilidade digital crítica (GEO < 35)",
                "Sem visita há mais de 45 dias (contas Amarelas/Vermelhas)",
              ].map((a,i) => (
                <div key={i} style={{ fontSize:11, color: PC.offWhite, padding:"5px 0",
                  borderBottom: i<3 ? `1px solid ${PC.navyLt}` : "none" }}>
                  ⚠ {a}
                </div>
              ))}
            </div>
          </div>

          {/* Nota metodológica */}
          <div style={{ gridColumn:"1/-1", background: PC.navyMid, borderRadius:10, padding:"14px 18px",
            border:`1px solid ${PC.navyLt}`, fontSize:12, color: PC.slate, lineHeight:1.6 }}>
            <span style={{ color: PC.white, fontWeight:600 }}>Dados utilizados automaticamente: </span>
            <strong style={{ color: PC.offWhite }}>Procedimentos</strong> (proc_realizados_esg, baloes_estoque das Visitas) ·{" "}
            <strong style={{ color: PC.offWhite }}>Engajamento</strong> (frequência + canal + recência das Visitas) ·{" "}
            <strong style={{ color: PC.offWhite }}>GEO Digital</strong> (GeoTrack — tabela geo_monitor, média por plataforma, tempo real) ·{" "}
            <strong style={{ color: PC.offWhite }}>Desfechos</strong> (consistência de realização vs. agendamento) ·{" "}
            <strong style={{ color: PC.offWhite }}>Lealdade</strong> (Tier do perfil_medico).
            Score calculado ao vivo — atualiza a cada nova visita registrada.
          </div>
        </div>

      ) : (
        /* ─── PORTFOLIO VIEW ─────────────────────────────────────────────── */
        <div>

        {/* ─── PAINEL: EFICIÊNCIA DE VISITAS POR TIER ──────────────────── */}
        <div style={{ background: PC.navyMid, borderRadius:12, padding:"16px 18px",
          border:`1px solid ${PC.navyLt}`, marginBottom:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
            <div style={{ fontSize:12, fontWeight:800, color: PC.text, letterSpacing:0.3 }}>
              📊 Eficiência de Visitas — Over vs. Under Visiting por Tier
            </div>
            <div style={{ display:"flex", gap:14, fontSize:10.5 }}>
              <span style={{ color: PC.red }}>■ Over-visiting: <b>{totalOver}</b></span>
              <span style={{ color: PC.green }}>■ Cadência ideal: <b>{totalIdeal}</b></span>
              <span style={{ color: PC.amber }}>■ Sub-cobertura: <b>{totalUnder}</b></span>
            </div>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:`repeat(${visitEfficiencyByTier.length}, 1fr)`, gap:10 }}>
            {visitEfficiencyByTier.map(t => {
              const pctOver = t.total ? Math.round((t.over/t.total)*100) : 0;
              const pctIdeal = t.total ? Math.round((t.ideal/t.total)*100) : 0;
              const pctUnder = t.total ? Math.round((t.under/t.total)*100) : 0;
              return (
                <div key={t.tier} style={{ background: PC.navy, borderRadius:8, padding:"10px 12px", border:`1px solid ${PC.navyLt}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:6 }}>
                    <span style={{ fontSize:12, fontWeight:800, color: PC.text }}>Tier {t.tier}</span>
                    <span style={{ fontSize:9, color: PC.slate }}>{t.total} médico{t.total !== 1 ? "s" : ""}</span>
                  </div>
                  <div style={{ fontSize:8.5, color: PC.slate, marginBottom:8 }}>
                    Cadência: {t.cadMin}–{t.cadMax === "∞" ? "∞" : t.cadMax} visitas/90d (ideal {t.cadIdeal})
                  </div>
                  {/* Stacked bar */}
                  <div style={{ display:"flex", height:8, borderRadius:4, overflow:"hidden", marginBottom:8 }}>
                    {t.over > 0 && <div style={{ width:`${pctOver}%`, background: PC.red }} title={`Over-visiting: ${t.over}`} />}
                    {t.ideal > 0 && <div style={{ width:`${pctIdeal}%`, background: PC.green }} title={`Ideal: ${t.ideal}`} />}
                    {t.under > 0 && <div style={{ width:`${pctUnder}%`, background: PC.amber }} title={`Sub-cobertura: ${t.under}`} />}
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:9.5 }}>
                    <span style={{ color: PC.red, fontWeight:700 }}>{t.over}</span>
                    <span style={{ color: PC.green, fontWeight:700 }}>{t.ideal}</span>
                    <span style={{ color: PC.amber, fontWeight:700 }}>{t.under}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* ─── PAINEL: ALERTA DE INATIVIDADE ─────────────────────────────── */}
        <div style={{ background: PC.navyMid, borderRadius:12, padding:"16px 18px",
          border:`1px solid ${(countCritico + countNunca) > 0 ? PC.red+"55" : PC.navyLt}`, marginBottom:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", cursor:"pointer" }}
            onClick={() => setShowInactivityDetail(!showInactivityDetail)}>
            <div style={{ fontSize:12, fontWeight:800, color: PC.text, letterSpacing:0.3 }}>
              ⏱ Alerta de Inatividade — dias sem visita vs. intervalo esperado pelo Tier
            </div>
            <div style={{ display:"flex", gap:14, fontSize:10.5, alignItems:"center" }}>
              <span style={{ color: PC.red }}>■ Sem visita registrada: <b>{countNunca}</b></span>
              <span style={{ color: PC.red }}>■ Crítico (2x+ atraso): <b>{countCritico}</b></span>
              <span style={{ color: PC.amber }}>■ Atenção: <b>{countAtencao}</b></span>
              <span style={{ color: PC.slate, fontSize:9 }}>{showInactivityDetail ? "▲ ocultar" : "▼ ver lista"}</span>
            </div>
          </div>
          {showInactivityDetail && (
            <div style={{ marginTop:14, borderTop:`1px solid ${PC.navyLt}`, paddingTop:12 }}>
              {inactivityAlerts.length === 0 ? (
                <div style={{ fontSize:11, color: PC.slate, textAlign:"center", padding:"10px 0" }}>
                  Nenhum médico com atraso significativo. Cobertura em dia.
                </div>
              ) : (
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                  {inactivityAlerts.map((a, i) => (
                    <div key={i} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                      background: PC.navy, borderRadius:6, padding:"7px 10px",
                      border:`1px solid ${a.nivel === "nunca" || a.nivel === "critico" ? PC.red+"44" : PC.amber+"44"}` }}>
                      <div>
                        <div style={{ fontSize:10.5, fontWeight:700, color: PC.text }}>{a.nome}</div>
                        <div style={{ fontSize:9, color: PC.slate }}>Tier {a.tier} · esperado a cada {a.intervaloEsperado}d</div>
                      </div>
                      <div style={{ textAlign:"right" }}>
                        <div style={{ fontSize:12, fontWeight:800,
                          color: a.nivel === "nunca" || a.nivel === "critico" ? PC.red : PC.amber }}>
                          {a.dias === 999 ? "sem registro" : `${a.dias}d`}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>

        <div style={{ display:"grid", gridTemplateColumns:"300px 1fr", gap:16, alignItems:"start" }}>

          {/* Sidebar */}
          <div>
            {/* KPIs resumo */}
            <div style={{ background: PC.navyMid, borderRadius:10, padding:"14px 16px",
              border:`1px solid ${PC.navyLt}`, marginBottom:12 }}>
              <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                {[
                  { label:"Saudável", count: counts.green, color: PC.green },
                  { label:"Atenção",  count: counts.yellow, color: PC.amber },
                  { label:"Em Risco", count: counts.red,   color: PC.red },
                ].map(z => (
                  <div key={z.label} onClick={() => setFilterZone(filterZone === z.label.toLowerCase().split(" ")[0] ? "all" : zone(z.color === PC.green ? 100 : z.color === PC.amber ? 65 : 30))}
                    style={{ flex:1, background:`${z.color}18`, border:`1px solid ${z.color}44`,
                      borderRadius:8, padding:"8px 4px", textAlign:"center", cursor:"pointer" }}>
                    <div style={{ fontSize:20, fontWeight:800, color: z.color }}>{z.count}</div>
                    <div style={{ fontSize:9, color: PC.slate, marginTop:2 }}>{z.label}</div>
                  </div>
                ))}
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:11,
                padding:"8px 0", borderTop:`1px solid ${PC.navyLt}` }}>
                <span style={{ color: PC.slate }}>Score médio da carteira</span>
                <span style={{ fontWeight:700, color: zoneColor(zone(avgScore)) }}>{avgScore}</span>
              </div>
            </div>

            {/* Filtros */}
            <div style={{ display:"flex", gap:6, marginBottom:10 }}>
              {["all","green","yellow","red"].map(f => (
                <button key={f} onClick={() => setFilterZone(f)} style={{
                  flex:1, background: filterZone===f
                    ? (f==="all" ? PC.navyLt : zoneColor(f)+"33")
                    : "transparent",
                  color: f==="all" ? PC.slate : zoneColor(f),
                  border: `1px solid ${filterZone===f ? (f==="all" ? PC.navyLt : zoneColor(f)) : PC.navyLt}`,
                  borderRadius:6, padding:"5px 0", fontSize:10, fontWeight:700, cursor:"pointer",
                }}>
                  {f==="all" ? "Todos" : f==="green" ? "🟢" : f==="yellow" ? "🟡" : "🔴"}
                </button>
              ))}
            </div>
            <div style={{ position:"relative", marginBottom:10 }}>
              <span style={{ position:"absolute", left:10, top:"50%", transform:"translateY(-50%)",
                fontSize:14, pointerEvents:"none" }}>🔍</span>
              <input
                placeholder="Digite o nome do médico..."
                value={search}
                onChange={e => {
                  const val = e.target.value;
                  setSearch(val);
                  // auto-seleciona se encontrar exatamente 1 médico
                  if (val.length >= 3) {
                    const matches = scoredMedicos.filter(m =>
                      m.nome?.toLowerCase().includes(val.toLowerCase())
                    );
                    if (matches.length === 1) setSelected(matches[0].id);
                  }
                }}
                style={{ width:"100%", background: PC.navyLt, border:`1px solid ${search ? PC.green+"88" : "#243B55"}`,
                  borderRadius:8, padding:"8px 12px 8px 32px", color: PC.white, fontSize:12,
                  fontFamily:"inherit", boxSizing:"border-box", outline:"none",
                  transition:"border-color 0.2s" }}
              />
              {search && (
                <button onClick={() => { setSearch(""); }}
                  style={{ position:"absolute", right:8, top:"50%", transform:"translateY(-50%)",
                    background:"none", border:"none", color: PC.slate, cursor:"pointer",
                    fontSize:14, lineHeight:1, padding:0 }}>✕</button>
              )}
            </div>

            {/* Lista */}
            <div style={{ display:"flex", flexDirection:"column", gap:6, maxHeight:"60vh", overflowY:"auto" }}>
              {filtrados.map(m => {
                const sc = m._score.total;
                const z = zone(sc);
                const color = zoneColor(z);
                const isSel = selected === m.id;
                return (
                  <div key={m.id} onClick={() => setSelected(isSel ? null : m.id)} style={{
                    background: isSel ? PC.navyMid : PC.navyLt,
                    border: `1.5px solid ${isSel ? color : "transparent"}`,
                    borderRadius:10, padding:"12px 14px", cursor:"pointer",
                    transition:"all 0.2s", display:"flex", alignItems:"center", gap:12,
                  }}>

function fupLoadData() {
  try {
    const raw = localStorage.getItem(FUP_STORAGE_KEY);
    if (!raw) return fupInitialState;
    const parsed = JSON.parse(raw);
    // deep merge to preserve new fields
    return {
      ...fupInitialState,
      ...parsed,
      cursoBariatricos: {
        ...fupInitialState.cursoBariatricos,
        ...parsed.cursoBariatricos,
        medicos: parsed.cursoBariatricos?.medicos?.length
          ? parsed.cursoBariatricos.medicos
          : fupInitialState.cursoBariatricos.medicos,
      },
      cursoEndoscopistas: {
        ...fupInitialState.cursoEndoscopistas,
        ...parsed.cursoEndoscopistas,
      },
      imersaoMarketing: {
        ...fupInitialState.imersaoMarketing,
        ...parsed.imersaoMarketing,
      },
      congressoMetabolica: Object.assign({}, fupInitialState.congressoMetabolica, parsed.congressoMetabolica || {}),
    };
  } catch (e) {
    console.error("Load error:", e);
    return fupInitialState;
  }
}

// Sanitiza ticketMedio — evita valores absurdos salvos por engano
const safeTicket = (val, def = 1680) => {
  const n = +val;
  return (n > 0 && n <= 30000) ? n : def;
};

// Formata receita: < 1000 → "R$ 850", < 1M → "R$ 850k", >= 1M → "R$ 1.1M"
function fmtReceita(val, prefix = "$") {
  if (!val || val === 0) return "—";
  if (val >= 1000000) return `${prefix} ${(val / 1000000).toFixed(1).replace(".", ",")}M`;
  if (val >= 1000)    return `${prefix} ${(val / 1000).toFixed(0)}k`;
  return `${prefix} ${val.toFixed(0)}`;
}

function FupObsExpandable({ obs, color, style = {} }) {
  const [exp, setExp] = React.useState(false);
  if (!obs) return null;
  const longa = obs.length > 70;
  return (
    <span
      onClick={() => longa && setExp(v => !v)}
      style={{ color: color || FUP_C.textMuted, fontStyle: "italic", cursor: longa ? "pointer" : "default",
               display: "block", marginTop: 2, ...style }}
    >
      💬 {exp || !longa ? obs : obs.slice(0, 70) + "… "}{longa && <span style={{ color: FUP_C.teal, fontSize: 11 }}>{exp ? "▲" : "▼"}</span>}
    </span>
  );
}

const CRITERIOS_VISITA = [
  { id:"obs", label:"Observação preenchida", peso:50 },
  { id:"acao", label:"Ação prevista registrada", peso:50 },
];
const CRITERIOS_CARTEIRA = [
  { label:"T1/T2 visitados presencialmente no mês", meta:"≥ 80%" },
  { label:"Visitas com obs + ação prevista", meta:"≥ 70%" },
  { label:"Nenhum T1/T2 sem presencial há +30 dias", meta:"100%" },
];
const FUP_PROJECTS = [
  { id: "esgDay", label: "ESG Day", icon: "🎯", desc: "Eventos em clínicas com pacientes elegíveis. Seguimento de comparecimento, fechamento e ROI.", color: FUP_C.teal },
  { id: "aulasReferidores", label: "Aulas Referidores", icon: "📚", desc: "Capacitação de médicos referidores. KPIs de engajamento, indicações e conversão.", color: FUP_C.blue },
  { id: "campanhaInterna", label: "Campanha Indicação Interna", icon: "🔗", desc: "Campanha Leap Plus — colaboradores indicando pacientes para procedimentos.", color: FUP_C.purple },
  { id: "cursoBariatricos", label: "Curso IAS — Cirurgiões Bariátricos", icon: "🏥", desc: "10 cirurgiões capacitados. Seguimento pós-curso, ativação do CRM e geração de ESGs.", color: FUP_C.orange },
  { id: "cursoEndoscopistas", label: "Curso IAS — Endoscopistas", icon: "🔬", desc: "3 médicos endoscopistas. Capacitação para execução. KPIs de ativação e produção.", color: FUP_C.green },
  { id: "pacientesReferidores", label: "Pacientes Indicados — Referidores", icon: "👥", desc: "Funil de pacientes indicados por médicos referidores. SLA de contato e conversão.", color: "#F43F5E" },
  { id: "imersaoMarketing", label: "Imersão Marketing", icon: "📡", desc: "Visibilidade digital dos médicos parceiros. KPIs de GEO, presença online e conversão.", color: FUP_C.yellow },
  { id: "congressoMetabolica", label: "Congresso Metabólica Pantanal", icon: "🏆", desc: "Simpósio + caso ao vivo ESG. KPIs de contatos qualificados, perfil de interesse e SLAs de follow-up.", color: "#F59E0B" },
];
// ════════════════════════════════════════════════════════════════════════════
// ESG DAY
// ════════════════════════════════════════════════════════════════════════════
function EsgDayProject({ data, onChange }) {
  const [modal, setModal] = useState(false);
  const [editModal, setEditModal] = useState(null); // record being edited
  const [detalheId, setDetalheId] = useState(null); // clinica detail view
  const [fupModal, setFupModal] = useState(null); // clinica id for new follow-up
  const [fupForm, setFupForm] = useState({ data: "", tipo: "Visita presencial", procedimentosFechados: "", obs: "" });
  const [form, setForm] = useState({
    medico: "", clinica: "", cidade: "", data: "", responsavel: "",
    pacientesElegiveis: "", convidados: "", confirmados: "", compareceram: "",
    procedimentos30d: "", ticketMedio: "", custoEvento: "", obs: "",
  });
  const [activeTab, setActiveTab] = useState("form");
  const records = data || [];
  const totals = records.reduce((a, r) => {
    const procVisitas = (r.followups||[]).filter(f=>!f.syncedFromVisitas).reduce((s,f) => s + (+f.procedimentosFechados||0), 0);
    const procTotal = (+r.procedimentos30d || 0) + procVisitas;
    return {
      eventos: a.eventos + 1,
      compareceram: a.compareceram + (+r.compareceram || 0),
      procedimentos: a.procedimentos + procTotal,
      receita: a.receita + (procTotal * (safeTicket(r.ticketMedio))),
      custo: a.custo + (+r.custoEvento || 0),
    };
  }, { eventos: 0, compareceram: 0, procedimentos: 0, receita: 0, custo: 0 });
  const conversaoMediaRaw = totals.compareceram > 0 ? (totals.procedimentos / totals.compareceram) * 100 : 0;
  const conversaoMedia = conversaoMediaRaw > 100 ? "100+" : conversaoMediaRaw.toFixed(1);
  const roi = totals.custo > 0
    ? (((totals.receita - totals.custo) / totals.custo) * 100).toFixed(0)
    : "—";
  const save = () => {
    const newRec = { ...form, id: fupUid() };
    onChange([...records, newRec]);
    setModal(false);
    setForm({ medico: "", clinica: "", cidade: "", data: "", responsavel: "", pacientesElegiveis: "", convidados: "", confirmados: "", compareceram: "", procedimentos30d: "", ticketMedio: "", custoEvento: "", obs: "" });
  };
  const del = (id) => onChange(records.filter((r) => r.id !== id));
  const saveEdit = (updated) => { onChange(records.map((r) => r.id === updated.id ? updated : r)); setEditModal(null); };
  const saveFup = () => {
    if (!fupModal) return;
    const rid = typeof fupModal === "string" ? fupModal : fupModal.rid;
    const isEdit = typeof fupModal === "object" && fupModal.fupId !== undefined;
    onChange(records.map((r) => r.id === rid
      ? { ...r, followups: isEdit
          ? (r.followups||[]).map((f, idx) => (idx === fupModal.fupId || f.id === fupModal.fupId) ? { ...f, ...fupForm } : f)
          : [...(r.followups||[]), { ...fupForm, id: fupUid() }] }
      : r));
    setFupModal(null);
    setFupForm({ data: "", tipo: "Visita presencial", procedimentosFechados: "", obs: "" });
  };
  const updateProcedimentos = (id, val) => onChange(records.map((r) => r.id === id ? { ...r, procedimentos30d: val } : r));
  const chartData = records.map((r) => ({
    name: r.clinica || "—",
    Convidados: +r.convidados || 0,
    Compareceram: +r.compareceram || 0,
    Fechados: +r.procedimentos30d || 0,
  }));
  const roiData = records
    .filter((r) => +r.custoEvento > 0)
    .map((r) => {
      const rec = (+r.procedimentos30d || 0) * (safeTicket(r.ticketMedio, 0));
      const custo = +r.custoEvento;
      return { name: r.clinica, ROI: +((((rec - custo) / custo) * 100).toFixed(0)) };
    });
  return (
    <div>
      {/* KPIs */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 28 }}>
        <FupKPICard label="Total Eventos" value={totals.eventos} icon="🎯" />
        <FupKPICard label="Compareceram" value={totals.compareceram} icon="👥" />
        <FupKPICard label="Procedimentos 30d" value={totals.procedimentos} color={FUP_C.green} icon="✓" />
        <FupKPICard label="Conversão Média" value={conversaoMedia === "100+" ? "100+ ⚠" : `${conversaoMedia}%`} color={conversaoMedia === "100+" ? FUP_C.yellow : conversaoMediaRaw >= 40 ? FUP_C.green : conversaoMediaRaw >= 25 ? FUP_C.yellow : FUP_C.red} sub="Meta: ≥ 40%" icon="📊" />
        <FupKPICard label="Receita Total" value={totals.receita > 0 ? fmtReceita(totals.receita) : "—"} color={FUP_C.teal} icon="💰" />
        <FupKPICard label="ROI Médio" value={`${roi}%`} color={FUP_C.purple} sub="Custo vs Receita" icon="📈" />
      </div>
      {/* Tabs */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {["form", "dashboard"].map((t) => (
          <button key={t} onClick={() => setActiveTab(t)} style={{
            padding: "8px 20px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
            background: activeTab === t ? FUP_C.teal : "transparent",
            color: activeTab === t ? "#fff" : FUP_C.textMuted,
            border: `1px solid ${activeTab === t ? FUP_C.teal : FUP_C.border}`,
          }}>{t === "form" ? "📋 Registros" : "📊 Dashboard"}</button>
        ))}
        <FupBtn onClick={() => setModal(true)} style={{ marginLeft: "auto" }}>+ Novo Evento</FupBtn>
      </div>
      {activeTab === "form" ? (
        <div>
          {records.length === 0 ? (
            <div style={{ textAlign: "center", padding: 48, color: FUP_C.textDim }}>
              <div style={{ fontSize: 40, marginBottom: 12 }}>🎯</div>
              <div>Nenhum evento cadastrado ainda.</div>
              <div style={{ fontSize: 12, marginTop: 6 }}>Clique em "+ Novo Evento" para adicionar.</div>
            </div>
          ) : (
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr style={{ borderBottom: `1px solid ${FUP_C.border}` }}>
                    {["Médico", "Cidade", "Data", "Responsável", "Compareceram", "Fechados", "Receita", "ROI", ""].map((h) => (
                      <th key={h} style={{ padding: "10px 12px", textAlign: "left", color: FUP_C.textMuted, fontWeight: 600, fontSize: 11, letterSpacing: "0.06em" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {records.map((r) => {
                    const rec = (+r.procedimentos30d || 0) * (safeTicket(r.ticketMedio, 0));
                    const custo = +r.custoEvento || 0;
                    const roi = custo > 0 ? (((rec - custo) / custo) * 100).toFixed(0) + "%" : "—";
                    return (
                      <React.Fragment key={r.id}>
                      <tr key={r.id + "_row"} style={{ borderBottom: `1px solid ${FUP_C.border}`, transition: "background 0.15s" }}
                        onMouseEnter={(e) => (e.currentTarget.style.background = FUP_C.cardHover)}
                        onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}>
                        <td style={{ padding: "12px 12px", color: FUP_C.text, fontWeight: 600 }}>{r.clinica || "—"}</td>
                        <td style={{ padding: "12px 12px", color: FUP_C.textMuted }}>{r.cidade || "—"}</td>
                        <td style={{ padding: "12px 12px", color: FUP_C.textMuted }}>{r.data || "—"}</td>
                        <td style={{ padding: "12px 12px", color: FUP_C.textMuted }}>{r.responsavel || "—"}</td>
                        <td style={{ padding: "12px 12px", color: FUP_C.text, textAlign: "center" }}>{r.compareceram || 0}</td>
                        <td style={{ padding: "12px 12px", textAlign: "center", fontWeight: 700 }}>{(() => { const total = (+r.procedimentos30d||0) + (r.followups||[]).filter(f=>!f.syncedFromVisitas).reduce((s,f)=>s+(+f.procedimentosFechados||0),0); const over = (+r.compareceram||0) > 0 && total > (+r.compareceram||0); return <span style={{color: over ? FUP_C.yellow : FUP_C.green}}>{total}{over?" ⚠":""}</span>; })()}</td>
                        <td style={{ padding: "12px 12px", color: FUP_C.teal }}>{rec > 0 ? fmtReceita(rec, "R$") : "—"}</td>
                        <td style={{ padding: "12px 12px" }}>
                          <FupPill label={roi} color={roi !== "—" && +roi >= 0 ? "verde" : "vermelho"} />
                        </td>
                        <td style={{ padding: "12px 12px" }}>
                          <div style={{ display: "flex", gap: 6 }}>
                            <FupBtn size="sm" variant="ghost" onClick={() => setDetalheId(r.id)}>📋</FupBtn>
                            <FupBtn size="sm" variant="ghost" onClick={() => setEditModal({ ...r })}>✏️</FupBtn>
                            <FupBtn variant="danger" size="sm" onClick={() => del(r.id)}>✕</FupBtn>
                          </div>
                        </td>
                      </tr>
                      {detalheId === r.id && (
                        <tr key={r.id + "_det"}>
                          <td colSpan={9} style={{ padding: "0 12px 16px", background: FUP_C.bg }}>
                            <div style={{ borderLeft: `3px solid ${FUP_C.teal}`, paddingLeft: 16, paddingTop: 12 }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                                <span style={{ color: FUP_C.teal, fontWeight: 700, fontSize: 13 }}>Seguimento — {r.medico||r.clinica}</span>
                                <FupBtn size="sm" onClick={() => setFupModal(r.id)} style={{ background: FUP_C.teal, border: "none" }}>+ Nova Visita</FupBtn>
                              </div>
                              <div style={{ display: "flex", gap: 16, marginBottom: 12, flexWrap: "wrap" }}>
                                <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Procedimentos fechados: <b style={{ color: FUP_C.green }}>{r.procedimentos30d || 0}</b></span>
                                <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Visitas registradas: <b style={{ color: FUP_C.text }}>{(r.followups || []).length}</b></span>
                              </div>
                              <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 12 }}>
                                <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Atualizar procedimentos fechados:</span>
                                <input type="number" defaultValue={r.procedimentos30d || 0}
                                  onBlur={(e) => updateProcedimentos(r.id, e.target.value)}
                                  style={{ width: 60, background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 6, padding: "4px 8px", color: FUP_C.text, fontSize: 12 }} />
                              </div>
                              {(r.followups || []).length > 0 && (
                                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                                  {(r.followups || []).map((f, fi) => (
                                    <div key={f.id || fi} style={{ background: FUP_C.card, borderRadius: 8, padding: "8px 14px", border: `1px solid ${FUP_C.border}`, borderLeft: `3px solid ${FUP_C.teal}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 16px", flex: 1 }}>
                                        <span style={{ color: FUP_C.text, fontWeight: 600, fontSize: 12 }}>{"V" + (fi+1) + " · " + (f.data || "—") + " · " + (f.tipo || "")}</span>
                                        {f.procedimentosFechados && <span style={{ color: FUP_C.green, fontSize: 12 }}>{"✓ " + f.procedimentosFechados + " fechado(s)"}</span>}
                                        <FupObsExpandable obs={f.obs} style={{ fontSize: 12 }} />
                                      </div>
                                      <div style={{ display: "flex", gap: 4, marginLeft: 8 }}>
                                        <button onClick={() => { setFupForm({ data: f.data||"", tipo: f.tipo||"Visita presencial", procedimentosFechados: f.procedimentosFechados||"", obs: f.obs||"" }); setFupModal({ rid: r.id, fupId: fi }); }} style={{ background: "none", border: `1px solid ${FUP_C.border}`, borderRadius: 5, color: FUP_C.textMuted, fontSize: 11, cursor: "pointer", padding: "2px 6px" }}>✏️</button>
                                        <button onClick={() => onChange(records.map((x) => x.id === r.id ? { ...x, followups: (x.followups||[]).filter((_, idx) => idx !== fi) } : x))} style={{ background: "none", border: `1px solid ${FUP_C.red}`, borderRadius: 5, color: FUP_C.red, fontSize: 11, cursor: "pointer", padding: "2px 6px" }}>✕</button>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          </td>
                        </tr>
                      )}
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
          <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
            <FupSectionTitle>Funil por Clínica</FupSectionTitle>
            <div style={{color:"#4A6580",textAlign:"center",padding:"20px",fontSize:12}}>📊 Gráfico disponível após inserir dados</div>
          </div>
          <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
            <FupSectionTitle>ROI por Clínica (%)</FupSectionTitle>
            {roiData.length > 0 ? (
              <div style={{color:"#4A6580",textAlign:"center",padding:"20px",fontSize:12}}>📊 Gráfico disponível após inserir dados</div>
            ) : <div style={{ color: FUP_C.textDim, textAlign: "center", paddingTop: 80 }}>Adicione eventos com custo para ver o ROI.</div>}
          </div>
          {/* SLAs */}
          <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20, gridColumn: "span 2" }}>
            <FupSectionTitle>📋 Rota de KPIs e SLAs — ESG Day</FupSectionTitle>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
              {[
                { kpi: "Taxa de Comparecimento", meta: "≥ 50% dos convidados", freq: "Por evento", alerta: "< 40% = revisar convite/CRM" },
                { kpi: "Taxa de Conversão 30d", meta: "≥ 40% dos que vieram", freq: "D+30 do evento", alerta: "< 25% = revisar seleção pacientes" },
                { kpi: "Custo por Comparecimento", meta: "< R$ 500", freq: "Pós-evento", alerta: "Otimizar logística" },
                { kpi: "ROI do Evento", meta: "≥ 50%", freq: "D+45 do evento", alerta: "ROI < 0 = evento ineficiente" },
                { kpi: "Follow-up D+7", meta: "100% dos compareceram", freq: "Semanal pós-evento", alerta: "Não feito = lead perdido" },
                { kpi: "Follow-up D+30", meta: "100% sem fechamento", freq: "D+30 do evento", alerta: "Relembrar proposta" },
              ].map((s, i) => (
                <div key={i} style={{ background: FUP_C.bg, borderRadius: 8, padding: 14, border: `1px solid ${FUP_C.border}` }}>
                  <div style={{ color: FUP_C.teal, fontSize: 12, fontWeight: 700, marginBottom: 6 }}>{s.kpi}</div>
                  <div style={{ color: FUP_C.text, fontSize: 13, fontWeight: 600 }}>Meta: {s.meta}</div>
                  <div style={{ color: FUP_C.textMuted, fontSize: 11, marginTop: 4 }}>Freq: {s.freq}</div>
                  <div style={{ color: FUP_C.red, fontSize: 11, marginTop: 4 }}>⚠ {s.alerta}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      {/* Modal Editar Evento */}
      <FupModal open={!!editModal} onClose={() => setEditModal(null)} title="Editar Evento ESG Day">
        {editModal && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <FupInput label="Clínica" value={editModal.clinica} onChange={(v) => setEditModal({ ...editModal, clinica: v })} />
            <FupInput label="Cidade" value={editModal.cidade} onChange={(v) => setEditModal({ ...editModal, cidade: v })} />
            <FupInput label="Data" type="date" value={editModal.data} onChange={(v) => setEditModal({ ...editModal, data: v })} />
            <FupInput label="Responsável" value={editModal.responsavel} onChange={(v) => setEditModal({ ...editModal, responsavel: v })} />
            <FupInput label="Compareceram" type="number" value={editModal.compareceram} onChange={(v) => setEditModal({ ...editModal, compareceram: v })} />
            <FupInput label="Procedimentos 30d" type="number" value={editModal.procedimentos30d} onChange={(v) => setEditModal({ ...editModal, procedimentos30d: v })} />
            <FupInput label="Ticket Médio (USD)" type="number" value={editModal.ticketMedio} onChange={(v) => { const n = +v; if (n > 9999 || n < 0) return; setEditModal({ ...editModal, ticketMedio: v }); }} placeholder="Ex: 1680" />
            <FupInput label="Custo Evento R$" type="number" value={editModal.custoEvento} onChange={(v) => setEditModal({ ...editModal, custoEvento: v })} />
            <div style={{ gridColumn: "span 2" }}><FupInput label="Obs" value={editModal.obs} onChange={(v) => setEditModal({ ...editModal, obs: v })} /></div>
            <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end", gap: 12 }}>
              <FupBtn variant="ghost" onClick={() => setEditModal(null)}>Cancelar</FupBtn>
              <FupBtn onClick={() => saveEdit(editModal)}>Salvar Alterações</FupBtn>
            </div>
          </div>
        )}
      </FupModal>
      {/* Modal Nova Visita de Seguimento */}
      <FupModal open={!!fupModal} onClose={() => setFupModal(null)} title="Registrar Nova Visita de Seguimento">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data" type="date" value={fupForm.data} onChange={(v) => setFupForm({ ...fupForm, data: v })} />
          <FupSelect label="Tipo" value={fupForm.tipo} onChange={(v) => setFupForm({ ...fupForm, tipo: v })} options={["Visita presencial","Call","WhatsApp","E-mail"].map(s => ({ value: s, label: s }))} />
          <FupInput label="Procedimentos fechados nesta visita" type="number" value={fupForm.procedimentosFechados} onChange={(v) => setFupForm({ ...fupForm, procedimentosFechados: v })} />
          <div style={{ gridColumn: "span 1" }}><FupInput label="Observações" value={fupForm.obs} onChange={(v) => setFupForm({ ...fupForm, obs: v })} /></div>
          <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end", gap: 12 }}>
            <FupBtn variant="ghost" onClick={() => setFupModal(null)}>Cancelar</FupBtn>
            <FupBtn onClick={saveFup} style={{ background: FUP_C.teal, border: "none" }}>Registrar Visita</FupBtn>
          </div>
        </div>
      </FupModal>
      {/* Modal Novo Evento */}
      <FupModal open={modal} onClose={() => setModal(false)} title="Registrar Evento ESG Day">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Médico responsável" value={form.medico} onChange={(v) => setForm({ ...form, medico: v })} required />
          <FupInput label="Cidade" value={form.cidade} onChange={(v) => setForm({ ...form, cidade: v })} />
          <FupInput label="Data do Evento" type="date" value={form.data} onChange={(v) => setForm({ ...form, data: v })} />
          <FupInput label="Responsável (Account)" value={form.responsavel} onChange={(v) => setForm({ ...form, responsavel: v })} />
          <FupInput label="Médico" value={form.medico} onChange={(v) => setForm({ ...form, medico: v })} />
          <FupInput label="Pacientes Elegíveis (CRM)" type="number" value={form.pacientesElegiveis} onChange={(v) => setForm({ ...form, pacientesElegiveis: v })} />
          <FupInput label="Convidados" type="number" value={form.convidados} onChange={(v) => setForm({ ...form, convidados: v })} />
          <FupInput label="Confirmados" type="number" value={form.confirmados} onChange={(v) => setForm({ ...form, confirmados: v })} />
          <FupInput label="Compareceram" type="number" value={form.compareceram} onChange={(v) => setForm({ ...form, compareceram: v })} />
          <FupInput label="Procedimentos Fechados (30d)" type="number" value={form.procedimentos30d} onChange={(v) => setForm({ ...form, procedimentos30d: v })} />
          <FupInput label="Ticket Médio (USD)" type="number" value={form.ticketMedio} onChange={(v) => { const n = +v; if (n > 9999 || n < 0) return; setForm({ ...form, ticketMedio: v }); }} placeholder="Ex: 1680" />
          <FupInput label="Custo do Evento (R$)" type="number" value={form.custoEvento} onChange={(v) => setForm({ ...form, custoEvento: v })} />
          <div style={{ gridColumn: "span 2" }}>
            <FupInput label="Observações" value={form.obs} onChange={(v) => setForm({ ...form, obs: v })} />
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
          <FupBtn variant="ghost" onClick={() => setModal(false)}>Cancelar</FupBtn>
          <FupBtn onClick={save}>Salvar Evento</FupBtn>
        </div>
      </FupModal>
    </div>
  );
}
