                <div key={i} style={{ background: FUP_C.bg, borderRadius: 8, padding: 14, border: `1px solid ${FUP_C.border}` }}>
                  <div style={{ color: FUP_C.teal, fontSize: 12, fontWeight: 700, marginBottom: 6 }}>{s.kpi}</div>
                  <div style={{ color: FUP_C.text, fontSize: 13, fontWeight: 600 }}>Meta: {s.meta}</div>
                  <div style={{ color: FUP_C.textMuted, fontSize: 11, marginTop: 4 }}>Freq: {s.freq}</div>
                  <div style={{ color: FUP_C.red, fontSize: 11, marginTop: 4 }}>⚠ {s.alerta}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Modal Editar Evento */}
      <FupModal open={!!editModal} onClose={() => setEditModal(null)} title="Editar Evento ESG Day">
        {editModal && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <FupInput label="Clínica" value={editModal.clinica} onChange={(v) => setEditModal({ ...editModal, clinica: v })} />
            <FupInput label="Cidade" value={editModal.cidade} onChange={(v) => setEditModal({ ...editModal, cidade: v })} />
            <FupInput label="Data" type="date" value={editModal.data} onChange={(v) => setEditModal({ ...editModal, data: v })} />
            <FupInput label="Responsável" value={editModal.responsavel} onChange={(v) => setEditModal({ ...editModal, responsavel: v })} />
            <FupInput label="Compareceram" type="number" value={editModal.compareceram} onChange={(v) => setEditModal({ ...editModal, compareceram: v })} />
            <FupInput label="Procedimentos 30d" type="number" value={editModal.procedimentos30d} onChange={(v) => setEditModal({ ...editModal, procedimentos30d: v })} />
            <FupInput label="Ticket Médio R$" type="number" value={editModal.ticketMedio} onChange={(v) => setEditModal({ ...editModal, ticketMedio: v })} />
            <FupInput label="Custo Evento R$" type="number" value={editModal.custoEvento} onChange={(v) => setEditModal({ ...editModal, custoEvento: v })} />
            <div style={{ gridColumn: "span 2" }}><FupInput label="Obs" value={editModal.obs} onChange={(v) => setEditModal({ ...editModal, obs: v })} /></div>
            <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end", gap: 12 }}>
              <FupBtn variant="ghost" onClick={() => setEditModal(null)}>Cancelar</FupBtn>
              <FupBtn onClick={() => saveEdit(editModal)}>Salvar Alterações</FupBtn>
            </div>
          </div>
        )}
      </FupModal>

      {/* Modal Nova Visita de Seguimento */}
      <FupModal open={!!fupModal} onClose={() => setFupModal(null)} title="Registrar Nova Visita de Seguimento">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data" type="date" value={fupForm.data} onChange={(v) => setFupForm({ ...fupForm, data: v })} />
          <FupSelect label="Tipo" value={fupForm.tipo} onChange={(v) => setFupForm({ ...fupForm, tipo: v })} options={["Visita presencial","Call","WhatsApp","E-mail"].map(s => ({ value: s, label: s }))} />
          <FupInput label="Procedimentos fechados nesta visita" type="number" value={fupForm.procedimentosFechados} onChange={(v) => setFupForm({ ...fupForm, procedimentosFechados: v })} />
          <div style={{ gridColumn: "span 1" }}><FupInput label="Observações" value={fupForm.obs} onChange={(v) => setFupForm({ ...fupForm, obs: v })} /></div>
          <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end", gap: 12 }}>
            <FupBtn variant="ghost" onClick={() => setFupModal(null)}>Cancelar</FupBtn>
            <FupBtn onClick={saveFup} style={{ background: FUP_C.teal, border: "none" }}>Registrar Visita</FupBtn>
          </div>
        </div>
      </FupModal>

      {/* Modal Novo Evento */}
      <FupModal open={modal} onClose={() => setModal(false)} title="Registrar Evento ESG Day">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Clínica" value={form.clinica} onChange={(v) => setForm({ ...form, clinica: v })} required />
          <FupInput label="Cidade" value={form.cidade} onChange={(v) => setForm({ ...form, cidade: v })} />
          <FupInput label="Data do Evento" type="date" value={form.data} onChange={(v) => setForm({ ...form, data: v })} />
          <FupInput label="Responsável (Account)" value={form.responsavel} onChange={(v) => setForm({ ...form, responsavel: v })} />
          <FupInput label="Médico" value={form.medico} onChange={(v) => setForm({ ...form, medico: v })} />
          <FupInput label="Pacientes Elegíveis (CRM)" type="number" value={form.pacientesElegiveis} onChange={(v) => setForm({ ...form, pacientesElegiveis: v })} />
          <FupInput label="Convidados" type="number" value={form.convidados} onChange={(v) => setForm({ ...form, convidados: v })} />
          <FupInput label="Confirmados" type="number" value={form.confirmados} onChange={(v) => setForm({ ...form, confirmados: v })} />
          <FupInput label="Compareceram" type="number" value={form.compareceram} onChange={(v) => setForm({ ...form, compareceram: v })} />
          <FupInput label="Procedimentos Fechados (30d)" type="number" value={form.procedimentos30d} onChange={(v) => setForm({ ...form, procedimentos30d: v })} />
          <FupInput label="Ticket Médio (R$)" type="number" value={form.ticketMedio} onChange={(v) => setForm({ ...form, ticketMedio: v })} />
          <FupInput label="Custo do Evento (R$)" type="number" value={form.custoEvento} onChange={(v) => setForm({ ...form, custoEvento: v })} />
          <div style={{ gridColumn: "span 2" }}>
            <FupInput label="Observações" value={form.obs} onChange={(v) => setForm({ ...form, obs: v })} />
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
          <FupBtn variant="ghost" onClick={() => setModal(false)}>Cancelar</FupBtn>
          <FupBtn onClick={save}>Salvar Evento</FupBtn>
        </div>
      </FupModal>
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
// AULAS REFERIDORES
// ════════════════════════════════════════════════════════════════════════════
function AulasReferidoresProject({ data, onChange }) {
  const [activeTab, setActiveTab] = useState("eventos");
  const [eventoModal, setEventoModal] = useState(false);
  const [refModal, setRefModal] = useState(null); // eventoId
  const [eventoForm, setEventoForm] = useState({
    nome: "", dataEvento: "", cidade: "", medicoExecutor: "", local: "", obs: "",
  });
  const [refForm, setRefForm] = useState({
    medico: "", especialidade: "", possuiCRM: "Não", indicacoesM1: "", indicacoesM2: "", indicacoesM3: "", procedimentosGerados: "", obs: "",
  });
  const [visitaModal, setVisitaModal] = useState(null);
  const [expandedRef, setExpandedRef] = useState(null);
  const [visitaForm, setVisitaForm] = useState({ data: "", tipo: "Visita presencial", indicacoes: "", procedimentos: "", obs: "" });
  const [editEventoModal, setEditEventoModal] = useState(null);
  const [editRefModal, setEditRefModal] = useState(null);

  const eventos = data?.eventos || [];
  const updateEventos = (e) => onChange({ eventos: e });

  const saveEvento = () => {
    updateEventos([...eventos, { ...eventoForm, id: fupUid(), referidores: [] }]);
    setEventoModal(false);
    setEventoForm({ nome: "", dataEvento: "", cidade: "", medicoExecutor: "", local: "", obs: "" });
  };

  const saveReferidor = () => {
    const updated = eventos.map((ev) =>
      ev.id === refModal
        ? { ...ev, referidores: [...(ev.referidores || []), { ...refForm, id: fupUid() }] }
        : ev
    );
    updateEventos(updated);
    setRefModal(null);
    setRefForm({ medico: "", especialidade: "", possuiCRM: "Não", indicacoesM1: "", indicacoesM2: "", indicacoesM3: "", procedimentosGerados: "", obs: "" });
  };

  const saveVisita = () => {
    if (!visitaModal) return;
    const { evId, refId } = visitaModal;
    updateEventos(eventos.map((ev) => ev.id === evId
      ? { ...ev, referidores: (ev.referidores||[]).map((r) => r.id === refId
          ? { ...r, visitas: [...(r.visitas||[]), { ...visitaForm, id: fupUid() }] }
          : r) }
      : ev));
    setVisitaModal(null);
    setVisitaForm({ data: "", tipo: "Visita presencial", indicacoes: "", procedimentos: "", obs: "" });
  };

  const saveEditEvento = (ev) => { updateEventos(eventos.map((e) => e.id === ev.id ? ev : e)); setEditEventoModal(null); };
  const saveEditRef = ({ evId, ref }) => { updateEventos(eventos.map((ev) => ev.id === evId ? { ...ev, referidores: (ev.referidores||[]).map((r) => r.id === ref.id ? ref : r) } : ev)); setEditRefModal(null); };
  const delEvento = (id) => updateEventos(eventos.filter((e) => e.id !== id));
  const delRef = (evId, refId) => updateEventos(eventos.map((ev) => ev.id === evId ? { ...ev, referidores: (ev.referidores||[]).filter((r) => r.id !== refId) } : ev));

  const totals = {
    eventos: eventos.length,
    referidores: eventos.reduce((a, ev) => a + (ev.referidores||[]).length, 0),
    comCRM: eventos.reduce((a, ev) => a + (ev.referidores||[]).filter((r) => r.possuiCRM === "Sim").length, 0),
    indicacoes: eventos.reduce((a, ev) => (ev.referidores||[]).reduce((b, r) => b + (+r.indicacoesM1||0) + (+r.indicacoesM2||0) + (+r.indicacoesM3||0), a), 0),
    procedimentos: eventos.reduce((a, ev) => (ev.referidores||[]).reduce((b, r) => b + (+r.procedimentosGerados||0), a), 0),
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 28 }}>
        <FupKPICard label="Eventos Realizados" value={totals.eventos} icon="📚" />
        <FupKPICard label="Referidores Treinados" value={totals.referidores} color={FUP_C.blue} />
        <FupKPICard label="Com CRM" value={totals.comCRM} color={FUP_C.teal} />
        <FupKPICard label="Indicações" value={totals.indicacoes} />
        <FupKPICard label="Procedimentos" value={totals.procedimentos} color={FUP_C.green} icon="✓" />
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {["eventos", "dashboard"].map((t) => (
          <button key={t} onClick={() => setActiveTab(t)} style={{
            padding: "8px 20px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
            background: activeTab === t ? FUP_C.blue : "transparent",
            color: activeTab === t ? "#fff" : FUP_C.textMuted,
            border: `1px solid ${activeTab === t ? FUP_C.blue : FUP_C.border}`,
          }}>{t === "eventos" ? "📋 Eventos" : "📊 Dashboard"}</button>
        ))}
        <FupBtn onClick={() => setEventoModal(true)} style={{ marginLeft: "auto" }}>+ Novo Evento</FupBtn>
      </div>

      {activeTab === "eventos" ? (
        eventos.length === 0 ? (
          <div style={{ textAlign: "center", padding: 48, color: FUP_C.textDim }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>📚</div>
            <div>Nenhum evento cadastrado. Clique em "+ Novo Evento".</div>
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {eventos.map((ev) => (
              <div key={ev.id} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                  <div>
                    <div style={{ color: FUP_C.text, fontWeight: 700, fontSize: 15 }}>{ev.nome || "Evento sem nome"}</div>
                    <div style={{ display: "flex", gap: 16, marginTop: 4, flexWrap: "wrap" }}>
                      {ev.dataEvento && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>📅 {ev.dataEvento}</span>}
                      {ev.cidade && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>📍 {ev.cidade}</span>}
                      {ev.medicoExecutor && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>👨‍⚕️ {ev.medicoExecutor}</span>}
                      <span style={{ color: FUP_C.blue, fontSize: 12 }}>{(ev.referidores||[]).length} referidor(es)</span>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <FupBtn size="sm" onClick={() => setRefModal(ev.id)} style={{ background: FUP_C.blue, border: "none" }}>+ Referidor</FupBtn>
                    <FupBtn size="sm" variant="danger" onClick={() => delEvento(ev.id)}>✕</FupBtn>
                  </div>
                </div>
                {(ev.referidores||[]).length > 0 && (
                  <div style={{ overflowX: "auto" }}>
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                      <thead>
                        <tr style={{ borderBottom: `1px solid ${FUP_C.border}` }}>
                          {["Médico Referidor", "Especialidade", "CRM?", "Ind. M1", "Ind. M2", "Ind. M3", "Proced.", ""].map((h) => (
                            <th key={h} style={{ padding: "8px 10px", textAlign: "left", color: FUP_C.textMuted, fontWeight: 600, fontSize: 11 }}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {(ev.referidores||[]).map((r) => (
                          <tr key={r.id} style={{ borderBottom: `1px solid ${FUP_C.border}` }}>
                            <td style={{ padding: "8px 10px", color: FUP_C.text, fontWeight: 600 }}>{r.medico || "—"}</td>
                            <td style={{ padding: "8px 10px", color: FUP_C.textMuted }}>{r.especialidade || "—"}</td>
                            <td style={{ padding: "8px 10px" }}><FupPill label={r.possuiCRM} color={r.possuiCRM === "Sim" ? "verde" : "vermelho"} /></td>
                            <td style={{ padding: "8px 10px", color: FUP_C.text, textAlign: "center" }}>{r.indicacoesM1 || 0}</td>
                            <td style={{ padding: "8px 10px", color: FUP_C.text, textAlign: "center" }}>{r.indicacoesM2 || 0}</td>
                            <td style={{ padding: "8px 10px", color: FUP_C.text, textAlign: "center" }}>{r.indicacoesM3 || 0}</td>
                            <td style={{ padding: "8px 10px", color: FUP_C.green, fontWeight: 700, textAlign: "center" }}>{r.procedimentosGerados || 0}</td>
                            <td style={{ padding: "8px 10px" }}>
                              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                                <button onClick={() => setVisitaModal({ evId: ev.id, refId: r.id })} style={{ background: FUP_C.blue, color: "#fff", border: "none", borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>+ Visita</button>
                                {(r.visitas||[]).length > 0 && <button onClick={() => setExpandedRef(expandedRef === r.id ? null : r.id)} style={{ background: "transparent", color: FUP_C.blue, border: "1px solid " + FUP_C.blue, borderRadius: 6, padding: "4px 8px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>{expandedRef === r.id ? "▼" : "▶ " + (r.visitas||[]).length}</button>}
                                <button onClick={() => delRef(ev.id, r.id)} style={{ background: "transparent", color: FUP_C.red, border: "1px solid " + FUP_C.red, borderRadius: 6, padding: "4px 8px", fontSize: 11, cursor: "pointer" }}>✕</button>
                              </div>
                              {expandedRef === r.id && (r.visitas||[]).length > 0 && (
                                <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
                                  {(r.visitas||[]).map((v, vi) => (
                                    <div key={v.id||vi} style={{ background: FUP_C.bg, borderRadius: 6, padding: "6px 10px", border: "1px solid " + FUP_C.border, borderLeft: "3px solid " + FUP_C.blue, fontSize: 12 }}>
                                      <span style={{ color: FUP_C.text, fontWeight: 600 }}>{"V" + (vi+1) + " · " + (v.data||"—") + " · " + (v.tipo||"")}</span>
                                      {v.indicacoes && <span style={{ color: FUP_C.teal, marginLeft: 10 }}>{"Ind: " + v.indicacoes}</span>}
                                      {v.procedimentos && <span style={{ color: FUP_C.green, marginLeft: 10 }}>{"Proced: " + v.procedimentos}</span>}
                                      {v.obs && <span style={{ color: FUP_C.textMuted, marginLeft: 10, fontStyle: "italic" }}>{"💬 " + v.obs}</span>}
                                    </div>
                                  ))}
                                </div>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            ))}
          </div>
        )
      ) : (
        <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
          <FupSectionTitle accent={FUP_C.blue}>📋 KPIs e SLAs — Aulas Referidores</FupSectionTitle>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
            {[
              { kpi: "Indicações por Referidor/mês", meta: "≥ 2", freq: "Mensal", alerta: "< 1 = visita de reativação" },
              { kpi: "CRM Estruturado", meta: "100% dos treinados", freq: "30d pós-aula", alerta: "Sem CRM = baixa rastreabilidade" },
              { kpi: "Devolutiva ao Referidor", meta: "≤ 7 dias após consulta", freq: "Por paciente", alerta: "Sem devolutiva = desmotiva indicação" },
              { kpi: "Taxa Conv. Indicação→Proced.", meta: "≥ 30%", freq: "Trimestral", alerta: "< 20% = revisar perfil indicado" },
              { kpi: "Visita de follow-up", meta: "Mensal (M1, M2, M3)", freq: "Mensal", alerta: "Sem visita = engagement cai 60%" },
              { kpi: "NPS do Referidor", meta: "≥ 8", freq: "Trimestral", alerta: "< 7 = risco de perder canal" },
            ].map((s, i) => (
              <div key={i} style={{ background: FUP_C.bg, borderRadius: 8, padding: 14, border: `1px solid ${FUP_C.border}` }}>
                <div style={{ color: FUP_C.blue, fontSize: 12, fontWeight: 700, marginBottom: 6 }}>{s.kpi}</div>
                <div style={{ color: FUP_C.text, fontSize: 13, fontWeight: 600 }}>Meta: {s.meta}</div>
                <div style={{ color: FUP_C.textMuted, fontSize: 11, marginTop: 4 }}>Freq: {s.freq}</div>
                <div style={{ color: FUP_C.red, fontSize: 11, marginTop: 4 }}>⚠ {s.alerta}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Modal Novo Evento */}
      <FupModal open={eventoModal} onClose={() => setEventoModal(false)} title="Cadastrar Evento — Aula Referidores">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Nome do Evento" value={eventoForm.nome} onChange={(v) => setEventoForm({ ...eventoForm, nome: v })} required style={{ gridColumn: "span 2" }} />
          <FupInput label="Data do Evento" type="date" value={eventoForm.dataEvento} onChange={(v) => setEventoForm({ ...eventoForm, dataEvento: v })} />
          <FupInput label="Cidade" value={eventoForm.cidade} onChange={(v) => setEventoForm({ ...eventoForm, cidade: v })} />
          <FupInput label="Médico Executor (ministra a aula)" value={eventoForm.medicoExecutor} onChange={(v) => setEventoForm({ ...eventoForm, medicoExecutor: v })} style={{ gridColumn: "span 2" }} />
          <FupInput label="Local" value={eventoForm.local} onChange={(v) => setEventoForm({ ...eventoForm, local: v })} />
          <FupInput label="Observações" value={eventoForm.obs} onChange={(v) => setEventoForm({ ...eventoForm, obs: v })} />
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
          <FupBtn variant="ghost" onClick={() => setEventoModal(false)}>Cancelar</FupBtn>
          <FupBtn onClick={saveEvento}>Salvar Evento</FupBtn>
        </div>
      </FupModal>

      {/* Modal Nova Visita */}
      <FupModal open={!!visitaModal} onClose={() => setVisitaModal(null)} title="Nova Visita ao Referidor">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data" type="date" value={visitaForm.data} onChange={(v) => setVisitaForm({ ...visitaForm, data: v })} />
          <FupSelect label="Tipo" value={visitaForm.tipo} onChange={(v) => setVisitaForm({ ...visitaForm, tipo: v })} options={["Visita presencial","Call","WhatsApp","E-mail"].map((s) => ({ value: s, label: s }))} />
          <FupInput label="Indicações geradas" type="number" value={visitaForm.indicacoes} onChange={(v) => setVisitaForm({ ...visitaForm, indicacoes: v })} />
          <FupInput label="Procedimentos gerados" type="number" value={visitaForm.procedimentos} onChange={(v) => setVisitaForm({ ...visitaForm, procedimentos: v })} />
          <div style={{ gridColumn: "span 2" }}><FupInput label="Observações" value={visitaForm.obs} onChange={(v) => setVisitaForm({ ...visitaForm, obs: v })} /></div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 20 }}>
          <FupBtn variant="ghost" onClick={() => setVisitaModal(null)}>Cancelar</FupBtn>
          <FupBtn onClick={saveVisita} style={{ background: FUP_C.blue, border: "none" }}>Registrar Visita</FupBtn>
        </div>
      </FupModal>

      {/* Modal Adicionar Referidor */}
      <FupModal open={!!refModal} onClose={() => setRefModal(null)} title="Adicionar Médico Referidor ao Evento">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Nome do Médico Referidor" value={refForm.medico} onChange={(v) => setRefForm({ ...refForm, medico: v })} required style={{ gridColumn: "span 2" }} />
          <FupInput label="Especialidade" value={refForm.especialidade} onChange={(v) => setRefForm({ ...refForm, especialidade: v })} />
          <FupSelect label="Possui CRM?" value={refForm.possuiCRM} onChange={(v) => setRefForm({ ...refForm, possuiCRM: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Não", label: "Não" }]} />
          <FupInput label="Indicações Mês 1" type="number" value={refForm.indicacoesM1} onChange={(v) => setRefForm({ ...refForm, indicacoesM1: v })} />
          <FupInput label="Indicações Mês 2" type="number" value={refForm.indicacoesM2} onChange={(v) => setRefForm({ ...refForm, indicacoesM2: v })} />

                                  <span style={{ color: FUP_C.text, fontWeight: 600, fontSize: 13 }}>{"Visita " + (idx+1) + " · " + (f.data || "Sem data") + " · " + (f.tipo || "")}</span>
                                  {f.risco && <span style={{ color: f.risco === "Verde" ? FUP_C.green : f.risco === "Vermelho" ? FUP_C.red : FUP_C.yellow, fontSize: 11, fontWeight: 700 }}>{f.risco === "Verde" ? "🟢" : f.risco === "Amarelo" ? "🟡" : "🔴"} {f.risco}</span>}
                                </div>
                                <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 16px" }}>
                                  {f.encaminhouMaterial && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Material: <b style={{ color: FUP_C.text }}>{f.encaminhouMaterial}</b></span>}
                                  {f.possuiCRM && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>CRM: <b style={{ color: FUP_C.text }}>{f.possuiCRM}</b></span>}
                                  {f.qtdContatosEnviados && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Contatos: <b style={{ color: FUP_C.blue }}>{f.qtdContatosEnviados}</b></span>}
                                  {f.avaliacoes && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Avaliações: <b style={{ color: FUP_C.teal }}>{f.avaliacoes}</b></span>}
                                  {f.procedimentos && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Procedimentos: <b style={{ color: FUP_C.green }}>{f.procedimentos}</b></span>}
                                  {f.scoreImpl && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Score: <b style={{ color: +f.scoreImpl >= 7 ? FUP_C.green : FUP_C.yellow }}>{f.scoreImpl}/10</b></span>}
                                </div>
                                {f.obs && <div style={{ color: FUP_C.textMuted, fontSize: 12, marginTop: 6, fontStyle: "italic" }}>💬 {f.obs}</div>}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                  <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
                    <FupBtn size="sm" variant="ghost" onClick={() => { setEditMedico({ ...m }); setModal(true); }}>✏️ Editar</FupBtn>
                    <FupBtn size="sm" onClick={() => setFupModal(m.id)} style={{ background: FUP_C.orange, border: "none" }}>+ FUP</FupBtn>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
          <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20, gridColumn: "span 2" }}>
            <FupSectionTitle accent={FUP_C.orange}>Radar de Performance por Médico</FupSectionTitle>
            <div style={{color:"#4A6580",textAlign:"center",padding:"20px",fontSize:12}}>📊 Gráfico disponível após inserir dados</div>
          </div>
          <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20, gridColumn: "span 2" }}>
            <FupSectionTitle accent={FUP_C.orange}>📋 KPIs e SLAs — Curso IAS Cirurgiões Bariátricos</FupSectionTitle>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
              {[
                { kpi: "Encaminhou material pós-curso", meta: "100% em D+1", freq: "Imediato", alerta: "Não enviou = oportunidade perdida no CRM" },
                { kpi: "Possui CRM estruturado", meta: "100% em D+30", freq: "M1", alerta: "Sem CRM = impraticável rastrear pacientes" },
                { kpi: "Qtd contatos disparados pelo CRM", meta: "≥ 50 em D+30", freq: "M1", alerta: "< 20 = não está ativando a base" },
                { kpi: "Avaliações ESG agendadas", meta: "≥ 5 em M1", freq: "Mensal", alerta: "0 avaliações M1 = risco alto de abandono" },
                { kpi: "Procedimentos ESG realizados", meta: "≥ 2 em M1, ≥ 5 em M3", freq: "Mensal", alerta: "0 em M2 = intervenção urgente" },
                { kpi: "Score de Implementação", meta: "≥ 7 em M3", freq: "Por visita", alerta: "Score < 4 após M2 = revisar suporte" },
                { kpi: "Visita de follow-up account", meta: "M1, M2, M3 (mensal)", freq: "Mensal", alerta: "Sem visita = engagement cai" },
                { kpi: "Risco semáforo", meta: "Verde em M3", freq: "Por visita", alerta: "Vermelho = escalar para gestão" },
                { kpi: "Devolutiva de status ao médico", meta: "Quinzenal", freq: "Quinzenal", alerta: "Médico sem feedback = desengaja" },
              ].map((s, i) => (
                <div key={i} style={{ background: FUP_C.bg, borderRadius: 8, padding: 14, border: `1px solid ${FUP_C.border}` }}>
                  <div style={{ color: FUP_C.orange, fontSize: 12, fontWeight: 700, marginBottom: 6 }}>{s.kpi}</div>
                  <div style={{ color: FUP_C.text, fontSize: 13, fontWeight: 600 }}>Meta: {s.meta}</div>
                  <div style={{ color: FUP_C.textMuted, fontSize: 11, marginTop: 4 }}>Freq: {s.freq}</div>
                  <div style={{ color: FUP_C.red, fontSize: 11, marginTop: 4 }}>⚠ {s.alerta}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Edit Medico Modal */}
      <FupModal open={modal && !!editMedico} onClose={() => setModal(false)} title="Editar Médico">
        {editMedico && (
          <>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
              <FupInput label="Nome" value={editMedico.nome} onChange={(v) => setEditMedico({ ...editMedico, nome: v })} style={{ gridColumn: "span 2" }} />
              <FupInput label="Email" value={editMedico.email} onChange={(v) => setEditMedico({ ...editMedico, email: v })} />
              <FupInput label="Cidade" value={editMedico.cidade || ""} onChange={(v) => setEditMedico({ ...editMedico, cidade: v })} />
              <FupInput label="CRM" value={editMedico.crm || ""} onChange={(v) => setEditMedico({ ...editMedico, crm: v })} />
              <FupSelect label="Possui CRM Estruturado?" value={editMedico.possuiCRM || "Não"} onChange={(v) => setEditMedico({ ...editMedico, possuiCRM: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Parcial", label: "Parcial" }, { value: "Não", label: "Não" }]} />
            </div>
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
              <FupBtn variant="ghost" onClick={() => setModal(false)}>Cancelar</FupBtn>
              <FupBtn onClick={saveMedico} style={{ background: FUP_C.orange }}>Salvar</FupBtn>
            </div>
          </>
        )}
      </FupModal>

      {/* FUP Modal */}
      <FupModal open={!!fupModal} onClose={() => setFupModal(null)} title={`Registrar Follow-up — ${medicos.find((m) => m.id === fupModal)?.nome?.split(" ")[0] || ""}`}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data da Visita" type="date" value={fupForm.data} onChange={(v) => setFupForm({ ...fupForm, data: v })} />
          <FupSelect label="Tipo" value={fupForm.tipo} onChange={(v) => setFupForm({ ...fupForm, tipo: v })} options={["Visita presencial", "Call", "WhatsApp", "E-mail"].map((s) => ({ value: s, label: s }))} />
          <FupSelect label="Encaminhou material pós-curso?" value={fupForm.encaminhouMaterial} onChange={(v) => setFupForm({ ...fupForm, encaminhouMaterial: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Não", label: "Não" }]} />
          <FupSelect label="Possui CRM?" value={fupForm.possuiCRM} onChange={(v) => setFupForm({ ...fupForm, possuiCRM: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Parcial", label: "Parcial" }, { value: "Não", label: "Não" }]} />
          <FupInput label="Contatos disparados pelo CRM" type="number" value={fupForm.qtdContatosEnviados} onChange={(v) => setFupForm({ ...fupForm, qtdContatosEnviados: v })} />
          <FupInput label="Respostas recebidas" type="number" value={fupForm.respostas} onChange={(v) => setFupForm({ ...fupForm, respostas: v })} />
          <FupInput label="Avaliações ESG agendadas" type="number" value={fupForm.avaliacoes} onChange={(v) => setFupForm({ ...fupForm, avaliacoes: v })} />
          <FupInput label="Procedimentos ESG realizados" type="number" value={fupForm.procedimentos} onChange={(v) => setFupForm({ ...fupForm, procedimentos: v })} />
          <FupInput label="Score Implementação (0–10)" type="number" value={fupForm.scoreImpl} onChange={(v) => setFupForm({ ...fupForm, scoreImpl: v })} />
          <FupSelect label="Risco (Semáforo)" value={fupForm.risco} onChange={(v) => setFupForm({ ...fupForm, risco: v })} options={["Verde", "Amarelo", "Vermelho"].map((s) => ({ value: s, label: s }))} />
          <div style={{ gridColumn: "span 2" }}>
            <FupInput label="Observações / Próxima Ação" value={fupForm.obs} onChange={(v) => setFupForm({ ...fupForm, obs: v })} />
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
          <FupBtn variant="ghost" onClick={() => setFupModal(null)}>Cancelar</FupBtn>
          <FupBtn onClick={saveFUP} style={{ background: FUP_C.orange }}>Registrar FUP</FupBtn>
        </div>
      </FupModal>
    </div>
  );
}

// CURSO ENDOSCOPISTAS
// ════════════════════════════════════════════════════════════════════════════
function CursoEndoscopistasProject({ data, onChange }) {
  const [fupModal, setFupModal] = useState(null);
  const [editModal, setEditModal] = useState(false);
  const [expandedEndo, setExpandedEndo] = useState(null);
  const [editMedico, setEditMedico] = useState(null);
  const [activeTab, setActiveTab] = useState("medicos");
  const [fupForm, setFupForm] = useState({
    data: "", tipo: "Visita presencial", realizandoProcedimentos: "Sim",
    procedimentos30d: "", avaliacoesAgendadas: "", possuiCRM: "Não",
    scoreImpl: "", risco: "Verde", obs: "",
  });

  const medicos = data?.medicos || fupInitialState.cursoEndoscopistas.medicos;
  const followups = data?.followups || [];

  const update = (m) => onChange({ medicos: m, followups });
  const updateFUPs = (f) => onChange({ medicos, followups: f });

  const totals = {
    totalProced: followups.reduce((a, f) => a + (+f.procedimentos30d || 0), 0),
    totalAval: followups.reduce((a, f) => a + (+f.avaliacoesAgendadas || 0), 0),
    comCRM: medicos.filter((m) => m.possuiCRM === "Sim").length,
  };

  const saveFUP = () => {
    updateFUPs([...followups, { ...fupForm, medicoId: fupModal, id: fupUid() }]);
    setFupModal(null);
    setFupForm({ data: "", tipo: "Visita presencial", realizandoProcedimentos: "Sim", procedimentos30d: "", avaliacoesAgendadas: "", possuiCRM: "Não", scoreImpl: "", risco: "Verde", obs: "" });
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 28 }}>
        <FupKPICard label="Endoscopistas" value={medicos.length} icon="🔬" />
        <FupKPICard label="Procedimentos Total" value={totals.totalProced} color={FUP_C.green} icon="✓" />
        <FupKPICard label="Avaliações Geradas" value={totals.totalAval} color={FUP_C.teal} />
        <FupKPICard label="Com CRM" value={totals.comCRM} color={FUP_C.blue} />
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {["medicos", "dashboard"].map((t) => (
          <button key={t} onClick={() => setActiveTab(t)} style={{
            padding: "8px 20px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
            background: activeTab === t ? FUP_C.green : "transparent",
            color: activeTab === t ? "#fff" : FUP_C.textMuted,
            border: `1px solid ${activeTab === t ? FUP_C.green : FUP_C.border}`,
          }}>{t === "medicos" ? "👨‍⚕️ Médicos" : "📊 Dashboard"}</button>
        ))}
      </div>

      {activeTab === "medicos" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {medicos.map((m, idx) => {
            const fups = followups.filter((f) => f.medicoId === m.id);
            const lastFup = fups[fups.length - 1];
            return (
              <div key={m.id} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ color: FUP_C.text, fontWeight: 700, fontSize: 15, marginBottom: 4 }}>
                      {m.nome || `Endoscopista ${idx + 1}`}
                    </div>
                    <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                      {m.email && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>📧 {m.email}</span>}
                      {m.cidade && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>📍 {m.cidade}</span>}
                      <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>
                        Procedimentos: <b style={{ color: FUP_C.green }}>{fups.reduce((a, f) => a + (+f.procedimentos30d || 0), 0)}</b>
                      </span>
                      <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>
                        Avaliações: <b style={{ color: FUP_C.teal }}>{fups.reduce((a, f) => a + (+f.avaliacoesAgendadas || 0), 0)}</b>
                      </span>
                      {lastFup?.risco && <FupPill label={lastFup.risco} color={lastFup.risco.toLowerCase()} />}
                      <button onClick={() => setExpandedEndo(expandedEndo === m.id ? null : m.id)} style={{ background: "none", border: "none", color: FUP_C.green, fontSize: 12, fontWeight: 600, cursor: "pointer", padding: 0 }}>
                        {expandedEndo === m.id ? "▼ Ocultar visitas" : "▶ Ver " + fups.length + " visita(s)"}
                      </button>
                    </div>
                    {expandedEndo === m.id && fups.length > 0 && (
                      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 8 }}>
                        {fups.map((f, idx) => (
                          <div key={f.id || idx} style={{ background: FUP_C.bg, borderRadius: 8, padding: "10px 14px", border: "1px solid " + FUP_C.border, borderLeft: "3px solid " + (f.risco === "Verde" ? FUP_C.green : f.risco === "Vermelho" ? FUP_C.red : FUP_C.yellow) }}>
                            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                              <span style={{ color: FUP_C.text, fontWeight: 600, fontSize: 13 }}>{"Visita " + (idx+1) + " · " + (f.data || "Sem data") + " · " + (f.tipo || "")}</span>
                              {f.risco && <span style={{ color: f.risco === "Verde" ? FUP_C.green : f.risco === "Vermelho" ? FUP_C.red : FUP_C.yellow, fontSize: 11, fontWeight: 700 }}>{f.risco === "Verde" ? "🟢" : f.risco === "Amarelo" ? "🟡" : "🔴"} {f.risco}</span>}
                            </div>
                            <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 16px" }}>
                              {f.procedimentos30d && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Procedimentos: <b style={{ color: FUP_C.green }}>{f.procedimentos30d}</b></span>}
                              {f.avaliacoesAgendadas && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Avaliações: <b style={{ color: FUP_C.teal }}>{f.avaliacoesAgendadas}</b></span>}
                              {f.scoreImpl && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Score: <b style={{ color: +f.scoreImpl >= 7 ? FUP_C.green : FUP_C.yellow }}>{f.scoreImpl}/10</b></span>}
                            </div>
                            {f.obs && <div style={{ color: FUP_C.textMuted, fontSize: 12, marginTop: 6, fontStyle: "italic" }}>💬 {f.obs}</div>}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <FupBtn size="sm" variant="ghost" onClick={() => { setEditMedico({ ...m, _idx: idx }); setEditModal(true); }}>✏️ Editar</FupBtn>
                    <FupBtn size="sm" onClick={() => setFupModal(m.id)} style={{ background: FUP_C.green, border: "none" }}>+ FUP</FupBtn>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      ) : (
        <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
          <FupSectionTitle accent={FUP_C.green}>📋 KPIs e SLAs — Curso IAS Endoscopistas</FupSectionTitle>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
            {[
              { kpi: "Primeiro ESG autônomo", meta: "D+60 pós-curso", freq: "M2", alerta: "0 em D+60 = necessita supervisão" },
              { kpi: "Procedimentos/mês", meta: "≥ 2 em M1, ≥ 4 em M3", freq: "Mensal", alerta: "0 em M1 = risco de não adoção" },
              { kpi: "Avaliações geradas", meta: "≥ 5 em M1", freq: "Mensal", alerta: "Sem avaliações = sem pipeline" },
              { kpi: "Score Implementação", meta: "≥ 7 em M3", freq: "Por visita", alerta: "< 4 em M2 = intervenção técnica" },
              { kpi: "Visita account", meta: "Mensal (M1, M2, M3)", freq: "Mensal", alerta: "Sem visita = abandono técnico" },
              { kpi: "CRM estruturado", meta: "Sim em M1", freq: "M1", alerta: "Sem CRM = sem rastreabilidade" },
            ].map((s, i) => (
              <div key={i} style={{ background: FUP_C.bg, borderRadius: 8, padding: 14, border: `1px solid ${FUP_C.border}` }}>
                <div style={{ color: FUP_C.green, fontSize: 12, fontWeight: 700, marginBottom: 6 }}>{s.kpi}</div>
                <div style={{ color: FUP_C.text, fontSize: 13, fontWeight: 600 }}>Meta: {s.meta}</div>
                <div style={{ color: FUP_C.textMuted, fontSize: 11, marginTop: 4 }}>Freq: {s.freq}</div>
                <div style={{ color: FUP_C.red, fontSize: 11, marginTop: 4 }}>⚠ {s.alerta}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      <FupModal open={!!fupModal} onClose={() => setFupModal(null)} title="Registrar Follow-up — Endoscopista">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data" type="date" value={fupForm.data} onChange={(v) => setFupForm({ ...fupForm, data: v })} />
          <FupSelect label="Tipo" value={fupForm.tipo} onChange={(v) => setFupForm({ ...fupForm, tipo: v })} options={["Visita presencial", "Call", "WhatsApp"].map((s) => ({ value: s, label: s }))} />
          <FupSelect label="Realizando procedimentos?" value={fupForm.realizandoProcedimentos} onChange={(v) => setFupForm({ ...fupForm, realizandoProcedimentos: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Não", label: "Não" }]} />
          <FupSelect label="Possui CRM?" value={fupForm.possuiCRM} onChange={(v) => setFupForm({ ...fupForm, possuiCRM: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Não", label: "Não" }]} />
          <FupInput label="Procedimentos ESG (30d)" type="number" value={fupForm.procedimentos30d} onChange={(v) => setFupForm({ ...fupForm, procedimentos30d: v })} />
          <FupInput label="Avaliações Agendadas" type="number" value={fupForm.avaliacoesAgendadas} onChange={(v) => setFupForm({ ...fupForm, avaliacoesAgendadas: v })} />
          <FupInput label="Score Implementação (0–10)" type="number" value={fupForm.scoreImpl} onChange={(v) => setFupForm({ ...fupForm, scoreImpl: v })} />
          <FupSelect label="Risco" value={fupForm.risco} onChange={(v) => setFupForm({ ...fupForm, risco: v })} options={["Verde", "Amarelo", "Vermelho"].map((s) => ({ value: s, label: s }))} />
          <div style={{ gridColumn: "span 2" }}>
            <FupInput label="Observações" value={fupForm.obs} onChange={(v) => setFupForm({ ...fupForm, obs: v })} />
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
          <FupBtn variant="ghost" onClick={() => setFupModal(null)}>Cancelar</FupBtn>
          <FupBtn onClick={saveFUP} style={{ background: FUP_C.green }}>Registrar FUP</FupBtn>
        </div>
      </FupModal>

      <FupModal open={editModal && !!editMedico} onClose={() => setEditModal(false)} title="Editar Endoscopista">
        {editMedico && (
          <>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
              <FupInput label="Nome" value={editMedico.nome} onChange={(v) => setEditMedico({ ...editMedico, nome: v })} style={{ gridColumn: "span 2" }} />
              <FupInput label="Email" value={editMedico.email} onChange={(v) => setEditMedico({ ...editMedico, email: v })} />
              <FupInput label="Cidade" value={editMedico.cidade || ""} onChange={(v) => setEditMedico({ ...editMedico, cidade: v })} />
              <FupSelect label="Possui CRM?" value={editMedico.possuiCRM || "Não"} onChange={(v) => setEditMedico({ ...editMedico, possuiCRM: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Não", label: "Não" }]} />
            </div>
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
              <FupBtn variant="ghost" onClick={() => setEditModal(false)}>Cancelar</FupBtn>
              <FupBtn onClick={() => {
                const updated = [...medicos];
                updated[editMedico._idx] = { ...editMedico };
                update(updated);
                setEditModal(false);
              }} style={{ background: FUP_C.green }}>Salvar</FupBtn>
            </div>
          </>
        )}
      </FupModal>
    </div>
  );
}

// PACIENTES REFERIDORES
// ════════════════════════════════════════════════════════════════════════════
function PacientesReferidoresProject({ data, onChange }) {
  const [modal, setModal] = useState(false);
  const [editModal, setEditModal] = useState(null);
  const [detalheId, setDetalheId] = useState(null);
  const [fupModal, setFupModal] = useState(null);
  const [fupForm, setFupForm] = useState({ data: "", tipo: "Call", resultado: "", obs: "" });
  const [form, setForm] = useState({
    dataEntrada: "", paciente: "", telefone: "", medicoReferidor: "",
    clinicaReferidor: "", cidade: "", owner: "",
    statusContato: "Novo Lead", dataContato1: "", tempoPrimContato: "",
    statusAgendamento: "Não agendado", dataAgendamento: "", dataConsulta: "",
    statusComparecimento: "Pendente", statusFunil: "Em andamento",
    procedimentoFechado: "Não", dataProcedimento: "", obs: "",
  });
  const [activeTab, setActiveTab] = useState("funil");
  const records = data || [];

  const statusContatoOptions = ["Novo Lead", "Tentativa 1", "Tentativa 2", "Tentativa 3", "Contato Realizado", "Não Atende", "Não Quer Contato"];
  const statusAgendOptions = ["Não agendado", "Agendado", "Confirmado", "Remarcado", "Cancelado"];
  const statusCompOptions = ["Pendente", "Compareceu", "Faltou", "Remarcou"];
  const statusFunilOptions = ["Em andamento", "Aguardando retorno", "Perdido", "Convertido"];

  const totals = {
    total: records.length,
    contatados: records.filter((r) => r.statusContato === "Contato Realizado").length,
    agendados: records.filter((r) => ["Agendado", "Confirmado"].includes(r.statusAgendamento)).length,
    compareceram: records.filter((r) => r.statusComparecimento === "Compareceu").length,
    procedimentos: records.filter((r) => r.procedimentoFechado === "Sim").length,
    perdidos: records.filter((r) => r.statusFunil === "Perdido").length,
  };

  const convRate = totals.total > 0 ? ((totals.procedimentos / totals.total) * 100).toFixed(1) : 0;
  const slaOk = records.filter((r) => +r.tempoPrimContato <= 30 && r.tempoPrimContato !== "").length;

  const funilData = [
    { stage: "Leads Recebidos", value: totals.total },
    { stage: "Contatados", value: totals.contatados },
    { stage: "Agendados", value: totals.agendados },
    { stage: "Compareceram", value: totals.compareceram },
    { stage: "Procedimentos", value: totals.procedimentos },
  ];

  const save = () => {
    onChange([...records, { ...form, id: fupUid() }]);
    setModal(false);
    setForm({ dataEntrada: "", paciente: "", telefone: "", medicoReferidor: "", clinicaReferidor: "", cidade: "", owner: "", statusContato: "Novo Lead", dataContato1: "", tempoPrimContato: "", statusAgendamento: "Não agendado", dataAgendamento: "", dataConsulta: "", statusComparecimento: "Pendente", statusFunil: "Em andamento", procedimentoFechado: "Não", dataProcedimento: "", obs: "" });
  };

  const update = (id, field, val) => onChange(records.map((r) => r.id === id ? { ...r, [field]: val } : r));
  const saveEditP = (u) => { onChange(records.map((r) => r.id === u.id ? u : r)); setEditModal(null); };
  const saveFupP = () => { if (!fupModal) return; onChange(records.map((r) => r.id === fupModal ? { ...r, followups: [...(r.followups||[]), { ...fupForm, id: fupUid() }] } : r)); setFupModal(null); setFupForm({ data: "", tipo: "Call", resultado: "", obs: "" }); };

  return (
    <div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 28 }}>
        <FupKPICard label="Leads Totais" value={totals.total} icon="👥" />
        <FupKPICard label="Contatados" value={totals.contatados} color={FUP_C.blue} sub={`SLA ≤30min: ${slaOk}`} />
        <FupKPICard label="Agendados" value={totals.agendados} color={FUP_C.teal} />
        <FupKPICard label="Compareceram" value={totals.compareceram} color={FUP_C.purple} />
        <FupKPICard label="Procedimentos" value={totals.procedimentos} color={FUP_C.green} icon="✓" />
        <FupKPICard label="Conversão" value={`${convRate}%`} color={convRate >= 40 ? FUP_C.green : convRate >= 25 ? FUP_C.yellow : FUP_C.red} sub="Meta: 40–50%" />
        <FupKPICard label="Perdidos" value={totals.perdidos} color={FUP_C.red} icon="✗" />
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {["funil", "dashboard"].map((t) => (
          <button key={t} onClick={() => setActiveTab(t)} style={{
            padding: "8px 20px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
            background: activeTab === t ? "#F43F5E" : "transparent",
            color: activeTab === t ? "#fff" : FUP_C.textMuted,
            border: `1px solid ${activeTab === t ? "#F43F5E" : FUP_C.border}`,
          }}>{t === "funil" ? "📋 Pacientes" : "📊 Dashboard"}</button>
        ))}
        <FupBtn onClick={() => setModal(true)} style={{ marginLeft: "auto", background: "#F43F5E", border: "none" }}>+ Novo Paciente</FupBtn>
      </div>

      {activeTab === "funil" ? (
        records.length === 0 ? (
          <div style={{ textAlign: "center", padding: 48, color: FUP_C.textDim }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>👥</div>
            <div>Nenhum paciente registrado.</div>
          </div>
        ) : (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <thead>
                <tr style={{ borderBottom: `1px solid ${FUP_C.border}` }}>
                  {["Paciente", "Referidor", "Owner", "Contato", "Agendamento", "Comparec.", "Proced.", ""].map((h) => (
                    <th key={h} style={{ padding: "10px 10px", textAlign: "left", color: FUP_C.textMuted, fontWeight: 600, fontSize: 11 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {records.map((r) => (
                  <tr key={r.id} style={{ borderBottom: `1px solid ${FUP_C.border}` }}>
                    <td style={{ padding: "10px", color: FUP_C.text, fontWeight: 600 }}>
                      <div>{r.paciente || "—"}</div>
                      <div style={{ color: FUP_C.textMuted, fontSize: 11 }}>{r.cidade}</div>
                    </td>
                    <td style={{ padding: "10px", color: FUP_C.textMuted }}>{r.medicoReferidor || "—"}</td>
                    <td style={{ padding: "10px", color: FUP_C.textMuted }}>{r.owner || "—"}</td>
                    <td style={{ padding: "10px" }}>
                      <select value={r.statusContato} onChange={(e) => update(r.id, "statusContato", e.target.value)}
                        style={{ background: FUP_C.bg, border: `1px solid ${FUP_C.border}`, borderRadius: 6, color: FUP_C.text, fontSize: 10, padding: "3px 6px" }}>
                        {statusContatoOptions.map((s) => <option key={s}>{s}</option>)}
                      </select>
                    </td>
                    <td style={{ padding: "10px" }}>
                      <select value={r.statusAgendamento} onChange={(e) => update(r.id, "statusAgendamento", e.target.value)}
                        style={{ background: FUP_C.bg, border: `1px solid ${FUP_C.border}`, borderRadius: 6, color: FUP_C.text, fontSize: 10, padding: "3px 6px" }}>
                        {statusAgendOptions.map((s) => <option key={s}>{s}</option>)}
                      </select>
                    </td>
                    <td style={{ padding: "10px" }}>
                      <select value={r.statusComparecimento} onChange={(e) => update(r.id, "statusComparecimento", e.target.value)}
                        style={{ background: FUP_C.bg, border: `1px solid ${FUP_C.border}`, borderRadius: 6, color: FUP_C.text, fontSize: 10, padding: "3px 6px" }}>
                        {statusCompOptions.map((s) => <option key={s}>{s}</option>)}
                      </select>
                    </td>
                    <td style={{ padding: "10px" }}>
                      <FupPill label={r.procedimentoFechado === "Sim" ? "Sim ✓" : "Não"} color={r.procedimentoFechado === "Sim" ? "verde" : "cinza"} />
                    </td>
                    <td style={{ padding: "10px" }}>
                      <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                        <FupBtn size="sm" variant="ghost" onClick={() => { const u = records.map((x) => x.id === r.id ? { ...x, procedimentoFechado: x.procedimentoFechado === "Sim" ? "Não" : "Sim" } : x); onChange(u); }}>{r.procedimentoFechado === "Sim" ? "↩" : "✓"}</FupBtn>
                        <FupBtn size="sm" variant="ghost" onClick={() => setDetalheId(detalheId === r.id ? null : r.id)}>📋</FupBtn>
                        <FupBtn size="sm" variant="ghost" onClick={() => setEditModal({ ...r })}>✏️</FupBtn>
                        <FupBtn variant="danger" size="sm" onClick={() => onChange(records.filter((x) => x.id !== r.id))}>✕</FupBtn>
                      </div>
                    </td>
                  </tr>
                  {detalheId === r.id && (
                    <tr key={r.id + "_det"}>
                      <td colSpan={8} style={{ padding: "0 10px 14px", background: FUP_C.bg }}>
                        <div style={{ borderLeft: "3px solid #F43F5E", paddingLeft: 16, paddingTop: 10 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                            <span style={{ color: "#F43F5E", fontWeight: 700, fontSize: 13 }}>Seguimento — {r.paciente}</span>
                            <FupBtn size="sm" onClick={() => setFupModal(r.id)} style={{ background: "#F43F5E", border: "none" }}>+ Nova Ação</FupBtn>
                          </div>
                          {(r.followups || []).length > 0 && (r.followups || []).map((f, fi) => (
                            <div key={f.id || fi} style={{ background: FUP_C.card, borderRadius: 8, padding: "7px 12px", border: `1px solid ${FUP_C.border}`, borderLeft: "3px solid #F43F5E", marginBottom: 6, fontSize: 12 }}>
                              <span style={{ color: FUP_C.text, fontWeight: 600 }}>{"A" + (fi+1) + " · " + (f.data||"—") + " · " + (f.tipo||"")}</span>
                              {f.resultado && <span style={{ color: FUP_C.teal, marginLeft: 12 }}>{f.resultado}</span>}
                              {f.obs && <span style={{ color: FUP_C.textMuted, marginLeft: 12, fontStyle: "italic" }}>{"💬 " + f.obs}</span>}
                            </div>
                          ))}
                        </div>
                      </td>
                    </tr>
                  )}
                ))}
              </tbody>
            </table>
          </div>
        )
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
          <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
            <FupSectionTitle accent="#F43F5E">Funil Completo</FupSectionTitle>
            <div style={{color:"#4A6580",textAlign:"center",padding:"20px",fontSize:12}}>📊 Gráfico disponível após inserir dados</div>
          </div>
          <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20, gridColumn: "span 1" }}>
            <FupSectionTitle accent="#F43F5E">📋 SLAs Operacionais (Playbook)</FupSectionTitle>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {[
                { label: "1ª Tentativa de Contato", meta: "≤ 15–30 min após entrada", color: "#F43F5E" },
                { label: "Tentativas no 1º dia", meta: "3 tentativas (canal + horário variados)", color: FUP_C.orange },
                { label: "Janela total de prospecção", meta: "72 horas com múltiplas tentativas", color: FUP_C.yellow },
                { label: "Confirmação de consulta", meta: "48h antes e no dia anterior", color: FUP_C.teal },
                { label: "Registro no CRM", meta: "Imediato após cada interação", color: FUP_C.blue },
                { label: "Devolutiva ao referidor", meta: "Por marco: agendamento + comparecimento", color: FUP_C.purple },
              ].map((s, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: FUP_C.bg, borderRadius: 8, border: `1px solid ${FUP_C.border}` }}>
                  <span style={{ color: s.color, fontSize: 12, fontWeight: 600 }}>{s.label}</span>
                  <span style={{ color: FUP_C.text, fontSize: 12 }}>{s.meta}</span>
                </div>
              ))}
            </div>
          </div>
          <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20, gridColumn: "span 2" }}>
            <FupSectionTitle accent="#F43F5E">📋 KPIs — Pacientes Indicados por Referidores</FupSectionTitle>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
              {[
                { kpi: "SLA 1º Contato", meta: "≤ 30 min (ideal ≤ 15 min)", freq: "Por lead", alerta: "> 2h = conversão cai 60%" },
                { kpi: "Taxa de Contato Ativo", meta: "≥ 85%", freq: "Semanal", alerta: "< 75% = problema operacional" },
                { kpi: "Taxa de Agendamento", meta: "60–70%", freq: "Semanal", alerta: "< 50% = revisar script" },
                { kpi: "Taxa de Comparecimento", meta: "≥ 75%", freq: "Por semana", alerta: "< 60% = confirmar D-1 e dia" },
                { kpi: "Conversão Consulta→Proced.", meta: "40–50%", freq: "Mensal", alerta: "< 25% = rever elegibilidade" },
                { kpi: "Devolutiva ao Referidor", meta: "≤ 7 dias por marco", freq: "Por evento", alerta: "Sem devolutiva = perde canal" },
              ].map((s, i) => (
                <div key={i} style={{ background: FUP_C.bg, borderRadius: 8, padding: 14, border: `1px solid ${FUP_C.border}` }}>
                  <div style={{ color: "#F43F5E", fontSize: 12, fontWeight: 700, marginBottom: 6 }}>{s.kpi}</div>
                  <div style={{ color: FUP_C.text, fontSize: 13, fontWeight: 600 }}>Meta: {s.meta}</div>
                  <div style={{ color: FUP_C.textMuted, fontSize: 11, marginTop: 4 }}>Freq: {s.freq}</div>
                  <div style={{ color: FUP_C.red, fontSize: 11, marginTop: 4 }}>⚠ {s.alerta}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <FupModal open={!!editModal} onClose={() => setEditModal(null)} title="Editar Paciente">
        {editModal && (<div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Paciente" value={editModal.paciente} onChange={(v) => setEditModal({ ...editModal, paciente: v })} />
          <FupInput label="Médico Referidor" value={editModal.medicoReferidor} onChange={(v) => setEditModal({ ...editModal, medicoReferidor: v })} />
          <FupInput label="Telefone" value={editModal.telefone} onChange={(v) => setEditModal({ ...editModal, telefone: v })} />
          <FupInput label="Owner" value={editModal.owner} onChange={(v) => setEditModal({ ...editModal, owner: v })} />
          <FupSelect label="Procedimento Fechado?" value={editModal.procedimentoFechado} onChange={(v) => setEditModal({ ...editModal, procedimentoFechado: v })} options={[{value:"Não",label:"Não"},{value:"Sim",label:"Sim"}]} />
          <FupInput label="Obs" value={editModal.obs} onChange={(v) => setEditModal({ ...editModal, obs: v })} />
          <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end", gap: 12 }}>
            <FupBtn variant="ghost" onClick={() => setEditModal(null)}>Cancelar</FupBtn>
            <FupBtn onClick={() => saveEditP(editModal)} style={{ background: "#F43F5E", border: "none" }}>Salvar</FupBtn>
          </div>
        </div>)}
      </FupModal>
      <FupModal open={!!fupModal} onClose={() => setFupModal(null)} title="Registrar Nova Ação — Paciente">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data" type="date" value={fupForm.data} onChange={(v) => setFupForm({ ...fupForm, data: v })} />
          <FupSelect label="Tipo" value={fupForm.tipo} onChange={(v) => setFupForm({ ...fupForm, tipo: v })} options={["Call","WhatsApp","E-mail","Visita presencial"].map(s=>({value:s,label:s}))} />
          <FupInput label="Resultado / Status" value={fupForm.resultado} onChange={(v) => setFupForm({ ...fupForm, resultado: v })} />
          <FupInput label="Observações" value={fupForm.obs} onChange={(v) => setFupForm({ ...fupForm, obs: v })} />
          <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end", gap: 12 }}>
            <FupBtn variant="ghost" onClick={() => setFupModal(null)}>Cancelar</FupBtn>
            <FupBtn onClick={saveFupP} style={{ background: "#F43F5E", border: "none" }}>Registrar</FupBtn>
          </div>
        </div>
      </FupModal>
      <FupModal open={modal} onClose={() => setModal(false)} title="Registrar Paciente — Indicado por Referidor" width={720}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data de Entrada" type="date" value={form.dataEntrada} onChange={(v) => setForm({ ...form, dataEntrada: v })} />
          <FupInput label="Nome do Paciente" value={form.paciente} onChange={(v) => setForm({ ...form, paciente: v })} required />
          <FupInput label="Telefone" value={form.telefone} onChange={(v) => setForm({ ...form, telefone: v })} />
          <FupInput label="Médico Referidor" value={form.medicoReferidor} onChange={(v) => setForm({ ...form, medicoReferidor: v })} required />
          <FupInput label="Clínica Referidor" value={form.clinicaReferidor} onChange={(v) => setForm({ ...form, clinicaReferidor: v })} />
          <FupInput label="Cidade" value={form.cidade} onChange={(v) => setForm({ ...form, cidade: v })} />
          <FupInput label="Owner (Inside Sales)" value={form.owner} onChange={(v) => setForm({ ...form, owner: v })} />
          <FupInput label="Tempo 1º Contato (min)" type="number" value={form.tempoPrimContato} onChange={(v) => setForm({ ...form, tempoPrimContato: v })} />
          <FupSelect label="Status Contato" value={form.statusContato} onChange={(v) => setForm({ ...form, statusContato: v })} options={statusContatoOptions.map((s) => ({ value: s, label: s }))} />
          <FupSelect label="Status Agendamento" value={form.statusAgendamento} onChange={(v) => setForm({ ...form, statusAgendamento: v })} options={statusAgendOptions.map((s) => ({ value: s, label: s }))} />
          <FupInput label="Data Consulta" type="date" value={form.dataConsulta} onChange={(v) => setForm({ ...form, dataConsulta: v })} />
          <FupSelect label="Comparecimento" value={form.statusComparecimento} onChange={(v) => setForm({ ...form, statusComparecimento: v })} options={statusCompOptions.map((s) => ({ value: s, label: s }))} />
          <FupSelect label="Procedimento Fechado?" value={form.procedimentoFechado} onChange={(v) => setForm({ ...form, procedimentoFechado: v })} options={[{ value: "Não", label: "Não" }, { value: "Sim", label: "Sim" }]} />
          <div style={{ gridColumn: "span 2" }}>
            <FupInput label="Observações" value={form.obs} onChange={(v) => setForm({ ...form, obs: v })} />
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
          <FupBtn variant="ghost" onClick={() => setModal(false)}>Cancelar</FupBtn>
          <FupBtn onClick={save} style={{ background: "#F43F5E", border: "none" }}>Salvar Paciente</FupBtn>
        </div>
      </FupModal>
    </div>
  );
}

// IMERSÃO MARKETING
// ════════════════════════════════════════════════════════════════════════════
function ImersaoMarketingProject({ data, onChange }) {
  const [modal, setModal] = useState(false);
  const [fupModal, setFupModal] = useState(null);
  const [expandedImersao, setExpandedImersao] = useState(null);
  const [activeTab, setActiveTab] = useState("medicos");
  const [form, setForm] = useState({ nome: "", especialidade: "", cidade: "", email: "", instagram: "", site: "" });
  const [fupForm, setFupForm] = useState({
    data: "", tipo: "Visita", instagramAtivo: "Sim", seguidores: "", postsMes: "",
    geoScore: "", llmVisivelChatGPT: "Não", llmVisivelGoogle: "Não",
    leadsOrganicos: "", procedimentosGerados: "", acoesConcluidas: "", obs: "",
  });

  const medicos = data?.medicos || [];
  const acoes = data?.acoes || [];

  const updateM = (m) => onChange({ medicos: m, acoes });
  const updateA = (a) => onChange({ medicos, acoes: a });

  const totals = {
    medicos: medicos.length,
    comSite: medicos.filter((m) => m.site).length,
    comInsta: medicos.filter((m) => m.instagram).length,
    leadsGerados: acoes.reduce((a, f) => a + (+f.leadsOrganicos || 0), 0),
    procedimentos: acoes.reduce((a, f) => a + (+f.procedimentosGerados || 0), 0),
    mediaGEO: acoes.length > 0 ? (acoes.reduce((a, f) => a + (+f.geoScore || 0), 0) / acoes.length).toFixed(1) : 0,
  };

  const saveMedico = () => {
    updateM([...medicos, { ...form, id: fupUid() }]);
    setModal(false);
    setForm({ nome: "", especialidade: "", cidade: "", email: "", instagram: "", site: "" });
  };

  const saveFUP = () => {
    updateA([...acoes, { ...fupForm, medicoId: fupModal, id: fupUid() }]);
    setFupModal(null);
    setFupForm({ data: "", tipo: "Visita", instagramAtivo: "Sim", seguidores: "", postsMes: "", geoScore: "", llmVisivelChatGPT: "Não", llmVisivelGoogle: "Não", leadsOrganicos: "", procedimentosGerados: "", acoesConcluidas: "", obs: "" });
  };

  const geoData = medicos.map((m) => {
    const mAcoes = acoes.filter((a) => a.medicoId === m.id);
    const last = mAcoes[mAcoes.length - 1];
    return { name: m.nome.split(" ")[0] || "—", GEO: +last?.geoScore || 0, Leads: +last?.leadsOrganicos || 0, Proced: +last?.procedimentosGerados || 0 };
  });

  return (
    <div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 28 }}>
        <FupKPICard label="Médicos" value={totals.medicos} icon="📡" />
        <FupKPICard label="Com Site" value={totals.comSite} color={FUP_C.blue} />
        <FupKPICard label="Com Instagram" value={totals.comInsta} color={FUP_C.purple} />
        <FupKPICard label="Leads Orgânicos" value={totals.leadsGerados} color={FUP_C.teal} />
        <FupKPICard label="Procedimentos" value={totals.procedimentos} color={FUP_C.green} />
        <FupKPICard label="GEO Score Médio" value={totals.mediaGEO + "/10"} color={totals.mediaGEO >= 6 ? FUP_C.green : FUP_C.yellow} sub="Meta: ≥ 6" />
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {["medicos", "dashboard"].map((t) => (
          <button key={t} onClick={() => setActiveTab(t)} style={{
            padding: "8px 20px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
            background: activeTab === t ? FUP_C.yellow : "transparent",
            color: activeTab === t ? "#000" : FUP_C.textMuted,
            border: `1px solid ${activeTab === t ? FUP_C.yellow : FUP_C.border}`,

                      </div>

                    <div style={{ display: "flex", gap: 8 }}>
                      <FupBtn size="sm" variant="danger" onClick={() => updateM(medicos.filter((x) => x.id !== m.id))}>✕</FupBtn>
                      <FupBtn size="sm" onClick={() => setFupModal(m.id)} style={{ background: FUP_C.yellow, color: "#000", border: "none" }}>+ FUP</FupBtn>
                    </div>

      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
          {geoData.length > 0 && (
            <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20, gridColumn: "span 2" }}>
              <FupSectionTitle accent={FUP_C.yellow}>GEO Score, Leads e Procedimentos por Médico</FupSectionTitle>
              <div style={{color:"#4A6580",textAlign:"center",padding:"20px",fontSize:12}}>📊 Gráfico disponível após inserir dados</div>
            </div>
          )}
          <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20, gridColumn: "span 2" }}>
            <FupSectionTitle accent={FUP_C.yellow}>📋 KPIs — Imersão Marketing (GEO + Visibilidade Digital)</FupSectionTitle>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
              {[
                { kpi: "GEO Score do Médico", meta: "≥ 6/10 em M3", freq: "Mensal", alerta: "< 4 = risco de invisibilidade em IA" },
                { kpi: "Presença em ChatGPT/Gemini", meta: "Mencionado em 3+ queries", freq: "Mensal", alerta: "Não mencionado = Schema/conteúdo incompleto" },
                { kpi: "Posts/mês (Instagram)", meta: "≥ 12 (3/semana)", freq: "Mensal", alerta: "< 8 = algoritmo penaliza alcance" },
                { kpi: "Leads orgânicos gerados", meta: "≥ 5/mês em M2", freq: "Mensal", alerta: "0 em M2 = estratégia sem efeito" },
                { kpi: "Conversão leads digitais", meta: "20–30%", freq: "Mensal", alerta: "< 15% = qualidade do lead ruim" },
                { kpi: "Procedimentos digitais", meta: "≥ 2/mês em M3", freq: "Mensal", alerta: "0 em M3 = ROI não justificado" },
                { kpi: "Follow-up account", meta: "Quinzenal (M1), Mensal (M2+)", freq: "Quinzenal/Mensal", alerta: "Sem FUP = perde momentum" },
                { kpi: "Schema Markup implementado", meta: "FAQ + Person + Medical em D+30", freq: "M1", alerta: "Sem schema = GEO score não sobe" },
                { kpi: "NPS do médico sobre a imersão", meta: "≥ 8 em M3", freq: "Trimestral", alerta: "< 7 = reposicionar suporte" },
              ].map((s, i) => (
                <div key={i} style={{ background: FUP_C.bg, borderRadius: 8, padding: 14, border: `1px solid ${FUP_C.border}` }}>
                  <div style={{ color: FUP_C.yellow, fontSize: 12, fontWeight: 700, marginBottom: 6 }}>{s.kpi}</div>
                  <div style={{ color: FUP_C.text, fontSize: 13, fontWeight: 600 }}>Meta: {s.meta}</div>
                  <div style={{ color: FUP_C.textMuted, fontSize: 11, marginTop: 4 }}>Freq: {s.freq}</div>
                  <div style={{ color: FUP_C.red, fontSize: 11, marginTop: 4 }}>⚠ {s.alerta}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <FupModal open={modal} onClose={() => setModal(false)} title="Adicionar Médico — Imersão Marketing">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Nome" value={form.nome} onChange={(v) => setForm({ ...form, nome: v })} required style={{ gridColumn: "span 2" }} />
          <FupInput label="Especialidade" value={form.especialidade} onChange={(v) => setForm({ ...form, especialidade: v })} />
          <FupInput label="Cidade" value={form.cidade} onChange={(v) => setForm({ ...form, cidade: v })} />
          <FupInput label="Email" value={form.email} onChange={(v) => setForm({ ...form, email: v })} />
          <FupInput label="Instagram (sem @)" value={form.instagram} onChange={(v) => setForm({ ...form, instagram: v })} />
          <FupInput label="Site" value={form.site} onChange={(v) => setForm({ ...form, site: v })} style={{ gridColumn: "span 2" }} />
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
          <FupBtn variant="ghost" onClick={() => setModal(false)}>Cancelar</FupBtn>
          <FupBtn onClick={saveMedico} style={{ background: FUP_C.yellow, color: "#000" }}>Adicionar</FupBtn>
        </div>
      </FupModal>

      <FupModal open={!!fupModal} onClose={() => setFupModal(null)} title="Follow-up — Imersão Marketing">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data" type="date" value={fupForm.data} onChange={(v) => setFupForm({ ...fupForm, data: v })} />
          <FupSelect label="Tipo" value={fupForm.tipo} onChange={(v) => setFupForm({ ...fupForm, tipo: v })} options={["Visita", "Call", "WhatsApp", "E-mail"].map((s) => ({ value: s, label: s }))} />
          <FupSelect label="Instagram Ativo?" value={fupForm.instagramAtivo} onChange={(v) => setFupForm({ ...fupForm, instagramAtivo: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Não", label: "Não" }]} />
          <FupInput label="Seguidores" type="number" value={fupForm.seguidores} onChange={(v) => setFupForm({ ...fupForm, seguidores: v })} />
          <FupInput label="Posts/mês" type="number" value={fupForm.postsMes} onChange={(v) => setFupForm({ ...fupForm, postsMes: v })} />
          <FupInput label="GEO Score (0–10)" type="number" value={fupForm.geoScore} onChange={(v) => setFupForm({ ...fupForm, geoScore: v })} />
          <FupSelect label="Visível no ChatGPT?" value={fupForm.llmVisivelChatGPT} onChange={(v) => setFupForm({ ...fupForm, llmVisivelChatGPT: v })} options={[{ value: "Não", label: "Não" }, { value: "Sim", label: "Sim" }, { value: "Parcial", label: "Parcial" }]} />
          <FupSelect label="Visível no Google/Gemini?" value={fupForm.llmVisivelGoogle} onChange={(v) => setFupForm({ ...fupForm, llmVisivelGoogle: v })} options={[{ value: "Não", label: "Não" }, { value: "Sim", label: "Sim" }, { value: "Parcial", label: "Parcial" }]} />
          <FupInput label="Leads Orgânicos" type="number" value={fupForm.leadsOrganicos} onChange={(v) => setFupForm({ ...fupForm, leadsOrganicos: v })} />
          <FupInput label="Procedimentos Gerados" type="number" value={fupForm.procedimentosGerados} onChange={(v) => setFupForm({ ...fupForm, procedimentosGerados: v })} />
