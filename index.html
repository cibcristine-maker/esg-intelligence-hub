// ─── UTILS ─────────────────────────────────────────────────────────────────
const initials = (name) => name ? name.split(" ").slice(0,2).map(w => w[0]).join("").toUpperCase() : "?";
const isConfigured = true;

function probBadge(prob) {
  const map = { Alto: "badge-alto", Médio: "badge-medio", Baixo: "badge-baixo", "Sem previsão": "badge-sem" };
  return <span className={`badge ${map[prob] || "badge-sem"}`}>{prob || "—"}</span>;
}

function Toast({ msg, onHide }) {
  useEffect(() => { const t = setTimeout(onHide, 2800); return () => clearTimeout(t); }, []);
  return <div className="toast">✓ {msg}</div>;
}

// ─── HOOKS ─────────────────────────────────────────────────────────────────
function useSupabase(table, deps = []) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const fetch = useCallback(async () => {
    if (!isConfigured) { setLoading(false); return; }
    setLoading(true);
    const { data: rows } = await supabaseClient.from(table).select("*");
    setData(rows || []);
    setLoading(false);
  }, deps);
  useEffect(() => { fetch(); }, [fetch]);
  return { data, loading, refresh: fetch };
}

function Visitas() {
  const { data: visitas, loading, refresh } = useSupabase("visitas");
  const { data: medicos } = useSupabase("perfil_medico");
  const [showForm, setShowForm] = useState(false);
  const [search, setSearch] = useState("");
  const [filterResp, setFilterResp] = useState("");
  const [toast, setToast] = useState(null);
  const [selectedVisita, setSelectedVisita] = useState(null);

  const sorted = [...visitas]
    .sort((a,b) => new Date(b.data_contato) - new Date(a.data_contato))
    .filter(v => {
      const q = search.toLowerCase();
      return (!q || v.medico_nome?.toLowerCase().includes(q) || v.obs?.toLowerCase().includes(q))
        && (!filterResp || v.responsavel === filterResp);
    });

  const handleSave = async (form) => {
    if (!isConfigured) return;
    const payload = {
      data_contato: form.data_contato || null,
      responsavel: form.responsavel || null,
      medico_nome: form.medico_nome || null,
      referidor: form.referidor === "Sim",
      especialidade: form.especialidade || null,
      canal: form.canal || null,
      ultimo_tp: form.ultimo_tp || null,
      acao_prevista: form.acao_prevista || null,
      probabilidade: form.probabilidade || null,
      valor_esperado: form.valor_esperado ? Number(form.valor_esperado) : null,
      suporte_marketing: form.suporte_marketing === "Sim",
      acao_mkt: form.acao_mkt || null,
      obs: form.obs || null,
      mes: form.mes || "JUNHO 26",
      fios_esg_estoque: form.fios_esg_estoque ? Number(form.fios_esg_estoque) : null,
      proc_marcados_esg: form.proc_marcados_esg ? Number(form.proc_marcados_esg) : null,
      baloes_estoque: form.baloes_estoque ? Number(form.baloes_estoque) : null,
      proc_marcados_balao: form.proc_marcados_balao ? Number(form.proc_marcados_balao) : null,
    };
    const { error } = await supabaseClient.from("visitas").insert([payload]);
    if (error) { alert("Erro ao salvar: " + error.message); return; }
    setToast("Visita registrada!");
    setShowForm(false);
    refresh();
  };

  const handleDelete = async (id) => {
    const { error } = await supabaseClient.from("visitas").delete().eq("id", id);
    if (error) { alert("Erro ao excluir: " + error.message); return; }
    setToast("Visita excluída!");
    setSelectedVisita(null);
    refresh();
  };

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Registro de Visitas</div>
          <div className="section-sub">{visitas.length} visitas · clique na linha para ver detalhes</div>
        </div>
        <button className="btn btn-primary" onClick={() => setShowForm(true)}>+ Nova Visita</button>
      </div>

      {!isConfigured && <ConfigBanner />}

      <div className="search-row">
        <input className="search-input" placeholder="Buscar médico ou observação..." value={search} onChange={e => setSearch(e.target.value)} />
        <select className="search-select" value={filterResp} onChange={e => setFilterResp(e.target.value)}>
          <option value="">Todos responsáveis</option>
          {RESPONSAVEIS.filter(r => !r.startsWith("──")).map(r => <option key={r}>{r}</option>)}
        </select>
      </div>

      {loading ? <div className="loading"><div className="spinner" /> Carregando...</div> : (
        <div className="card" style={{padding:0}}>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Responsável</th>
                  <th>Médico</th>
                  <th>Canal</th>
                  <th>Último TP</th>
                  <th>Prob.</th>
                  <th>MKT</th>
                  <th>Observação</th>
                </tr>
              </thead>
              <tbody>
                {sorted.length === 0 ? (
                  <tr><td colSpan={8}><div className="empty">Nenhuma visita registrada.</div></td></tr>
                ) : sorted.map(v => (
                  <tr key={v.id} style={{cursor:"pointer"}} onClick={() => setSelectedVisita(v)}>
                    <td className="td-muted" style={{fontFamily:"DM Mono",fontSize:12}}>
                      {v.data_contato ? new Date(v.data_contato + "T00:00:00").toLocaleDateString("pt-BR") : "—"}
                    </td>
                    <td>{v.responsavel || "—"}</td>
                    <td style={{fontWeight:500}}>{v.medico_nome}</td>
                    <td><span className="badge badge-canal">{v.canal || "—"}</span></td>
                    <td className="td-muted">{v.ultimo_tp || "—"}</td>
                    <td>{v.probabilidade ? probBadge(v.probabilidade) : "—"}</td>
                    <td style={{color: v.suporte_marketing ? "var(--teal)" : "var(--muted)", fontSize:12}}>
                      {v.suporte_marketing ? "✓ Sim" : "—"}
                    </td>
                    <td className="td-muted" style={{maxWidth:220, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
                      {v.obs || "—"}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {showForm && (
        <VisitaModal
          medicos={medicos}
          onSave={handleSave}
          onClose={() => setShowForm(false)}
        />
      )}
      {selectedVisita && (
        <VisitaDetalheModal
          visita={selectedVisita}
          onClose={() => setSelectedVisita(null)}
          onDelete={handleDelete}
        />
      )}
      {toast && <Toast msg={toast} onHide={() => setToast(null)} />}
    </div>
  );
}

function Medicos() {
  const { data: medicos, loading, refresh } = useSupabase("perfil_medico");
  const [search, setSearch] = useState("");
  const [filterTier, setFilterTier] = useState("");
  const [selected, setSelected] = useState(null);
  const [editingAccount, setEditingAccount] = useState(null);
  const [accountVal, setAccountVal] = useState("");
  const [toast, setToast] = useState(null);

  const filtered = medicos.filter(m => {
    const q = search.toLowerCase();
    return (!q || m.nome?.toLowerCase().includes(q) || m.estado?.toLowerCase().includes(q))
      && (!filterTier || String(m.tier) === filterTier);
  }).sort((a,b) => (a.tier||99) - (b.tier||99));

  const saveAccount = async (medicoId, val) => {
    const { error } = await supabaseClient.from("perfil_medico").update({account: val || null}).eq("id", medicoId);
    if (error) { alert("Erro: " + error.message); return; }
    setToast("Account salvo!");
    setEditingAccount(null);
    refresh();
  };

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Carteira de Médicos</div>
          <div className="section-sub">{medicos.length} médicos cadastrados</div>
        </div>
      </div>

      {!isConfigured && <ConfigBanner />}

      <div className="search-row">
        <input className="search-input" placeholder="Buscar médico, estado..." value={search} onChange={e => setSearch(e.target.value)} />
        <select className="search-select" value={filterTier} onChange={e => setFilterTier(e.target.value)}>
          <option value="">Todos os tiers</option>
          {["ST","1","2","3","4","5"].map(t => <option key={t} value={t}>Tier {t}</option>)}
        </select>
      </div>

      {loading ? <div className="loading"><div className="spinner" /> Carregando...</div> : (
        <div className="card" style={{padding:0}}>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Médico</th>
                  <th>Tier</th>
                  <th>Estado</th>
                  <th>Clínica</th>
                  <th>Account</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(m => (
                  <tr key={m.id}>
                    <td style={{cursor:"pointer"}} onClick={() => setSelected(m)}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <div className="medico-avatar" style={{width:32,height:32,fontSize:12}}>
                          {initials(m.nome)}
                        </div>
                        <span style={{fontWeight:500}}>{m.nome}</span>
                      </div>
                    </td>
                    <td>
                      <span className="badge badge-tier" style={{background:`${TIER_COLOR[m.tier] || "#888"}22`, color: TIER_COLOR[m.tier] || "#888"}}>
                        {m.tier === "ST" ? "STAR" : m.tier ? `T${m.tier}` : "—"}
                      </span>
                    </td>
                    <td className="td-muted">{m.estado || "—"}</td>
                    <td className="td-muted" style={{maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.clinica || "—"}</td>
                    <td onClick={e => e.stopPropagation()}>
                      {editingAccount === m.id ? (
                        <div style={{display:"flex",gap:4,alignItems:"center"}}>
                          <input
                            className="form-input"
                            style={{padding:"3px 6px",fontSize:12,width:130}}
                            value={accountVal}
                            autoFocus
                            onChange={e => setAccountVal(e.target.value)}
                            onKeyDown={e => {
                              if(e.key==="Enter") saveAccount(m.id, accountVal);
                              if(e.key==="Escape") setEditingAccount(null);
                            }}
                          />
                          <button className="btn btn-primary btn-sm" style={{padding:"3px 8px"}} onClick={() => saveAccount(m.id, accountVal)}>✓</button>
                          <button className="btn btn-ghost btn-sm" style={{padding:"3px 8px"}} onClick={() => setEditingAccount(null)}>✕</button>
                        </div>
                      ) : (
                        <div
                          style={{cursor:"pointer",fontSize:12,color:m.account?"var(--text)":"var(--muted)"}}
                          onClick={() => { setEditingAccount(m.id); setAccountVal(m.account||""); }}
                          title="Clique para editar"
                        >
                          {m.account || <span style={{fontStyle:"italic",color:"var(--muted)"}}>clique para editar</span>}
                        </div>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {selected && <MedicoModal medico={selected} onClose={() => setSelected(null)} />}
      {toast && <Toast msg={toast} onHide={() => setToast(null)} />}
    </div>
  );
}

function EditableCell({ value, onSave, placeholder, prefix }) {
  const [editing, setEditing] = React.useState(false);
  const [val, setVal] = React.useState(value || "");

  const handleSave = () => {
    setEditing(false);
    if (String(val) !== String(value || "")) onSave(val);
  };

  if (editing) return (
    <input
      className="form-input"
      style={{padding:"3px 6px",fontSize:12,width:90}}
      value={val}
      autoFocus
      onChange={e => setVal(e.target.value)}
      onBlur={handleSave}
      onClick={e => e.stopPropagation()}
      onKeyDown={e => { if(e.key==="Enter") handleSave(); if(e.key==="Escape") setEditing(false); }}
    />
  );

  return (
    <div
      onClick={(e) => { e.stopPropagation(); setVal(value||""); setEditing(true); }}
      style={{cursor:"pointer",fontSize:12,fontFamily:"DM Mono",color:value?"var(--text)":"var(--muted)",padding:"2px 4px"}}
      title="Clique para editar"
    >
      {value ? `${prefix||""}${Number(value).toLocaleString("pt-BR")}` : (placeholder||"—")}
    </div>
  );
}

function Ativacao() {
  const { data: medicos, refresh: refreshMedicos } = useSupabase("perfil_medico");
  const { data: tpsDef } = useSupabase("tps_definicoes");
  const { data: medicoTps, loading, refresh } = useSupabase("medico_tps");
  const [selectedMedico, setSelectedMedico] = useState(null);
  const [toast, setToast] = useState(null);
  const [filterTier, setFilterTier] = useState("");

  const medicosFilt = medicos.filter(m => !filterTier || String(m.tier) === filterTier)
    .sort((a,b) => (a.tier||99)-(b.tier||99));

  const getProgress = (medicoId) => {
    const mTps = medicoTps.filter(t => t.medico_id === medicoId);
    const done = mTps.filter(t => t.concluido).length;
    return { done, pct: Math.round(done/23*100), total: 23 };
  };

  const getTpStatus = (medicoId, tpId) =>
    medicoTps.find(t => t.medico_id === medicoId && t.tp_id === tpId);

  const toggleTp = async (medicoId, tpId) => {
    if (!isConfigured) return;
    const existing = getTpStatus(medicoId, tpId);
    if (existing) {
      const { error } = await supabaseClient.from("medico_tps").update({
        concluido: !existing.concluido,
        data_conclusao: !existing.concluido ? new Date().toISOString().slice(0,10) : null
      }).eq("id", existing.id);
      if (error) { alert("Erro: " + error.message); return; }
    } else {
      const { error } = await supabaseClient.from("medico_tps").insert([{
        medico_id: medicoId,
        tp_id: tpId,
        concluido: true,
        data_conclusao: new Date().toISOString().slice(0,10)
      }]);
      if (error) { alert("Erro: " + error.message); return; }
    }
    setToast("TP atualizado!");
    refresh();
  };

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Ativação de TPs</div>
          <div className="section-sub">Acompanhe os 23 touchpoints por médico</div>
        </div>
        <select className="search-select" value={filterTier} onChange={e => setFilterTier(e.target.value)}>
          <option value="">Todos os tiers</option>
          {["ST","1","2","3","4","5"].map(t => <option key={t} value={t}>Tier {t}</option>)}
        </select>
      </div>

      {!isConfigured && <ConfigBanner />}
      {loading ? <div className="loading"><div className="spinner" /> Carregando...</div> : (
        <div>
          {selectedMedico ? (
            <div>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:1.25+'rem'}}>
                <button className="btn btn-ghost btn-sm" onClick={() => setSelectedMedico(null)}>← Voltar</button>
                <div className="medico-avatar" style={{width:36,height:36,fontSize:13}}>{initials(selectedMedico.nome)}</div>
                <div>
                  <div style={{fontWeight:600,fontSize:15}}>{selectedMedico.nome}</div>
                  <div style={{fontSize:12,color:"var(--muted)"}}>
                    {selectedMedico.tier ? `T${selectedMedico.tier}` : ""} · {selectedMedico.estado}
                  </div>
                </div>
              </div>

              <div className="tp-grid">
                {tpsDef.map(tp => {
                  const status = getTpStatus(selectedMedico.id, tp.id);
                  const done = status?.concluido;
                  return (
                    <div
                      key={tp.id}
                      className={`tp-card ${done ? "done" : ""}`}
                      onClick={() => toggleTp(selectedMedico.id, tp.id)}
                    >
                      <div className="tp-header">
                        <span className="tp-code" style={{color: BLOCOS_COLOR[tp.bloco] || "var(--teal)"}}>
                          {tp.codigo}
                        </span>
                        <div className={`tp-check ${done ? "done" : ""}`}>
                          {done ? "✓" : ""}
                        </div>
                      </div>
                      <div className="tp-name">{tp.nome}</div>
                      <div className="tp-bloco" style={{color: BLOCOS_COLOR[tp.bloco] || "var(--muted)"}}>
                        {tp.bloco}
                      </div>
                      {tp.o_que_validar && (
                        <div style={{fontSize:11,color:"var(--muted)",marginTop:6,lineHeight:1.5}}>
                          {tp.o_que_validar}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
            <div className="card" style={{padding:0}}>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Médico</th>
                      <th>Tier</th>
                      <th>Estado</th>
                      <th>TPs Concluídos</th>
                      <th>Cota Anual ($)</th>
                      <th>Vendas ($)</th>
                      <th>% Meta</th>
                      <th>Progresso</th>
                    </tr>
                  </thead>
                  <tbody>
                    {medicosFilt.map(m => {
                      const prog = getProgress(m.id);
                      const alerta = prog.pct >= 70 ? { icon: "🟢", label: "Alta ativação" } :
                        prog.pct >= 40 ? { icon: "🟡", label: "Em progresso" } :
                        { icon: "🔴", label: "Baixa ativação" };
                      return (
                        <tr key={m.id}>
                          <td style={{fontWeight:500,cursor:"pointer"}} onClick={() => setSelectedMedico(m)}>{m.nome}</td>
                          <td>
                            <span className="badge badge-tier" style={{background:`${TIER_COLOR[m.tier]||"#888"}22`,color:TIER_COLOR[m.tier]||"#888"}}>
                              {m.tier === "ST" ? "STAR" : m.tier ? `T${m.tier}` : "—"}
                            </span>
                          </td>
                          <td className="td-muted">{m.estado || "—"}</td>
                          <td style={{minWidth:140}}>
                            <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>
                              {prog.done}/23 · {prog.pct}%
                            </div>
                            <div className="progress-wrap">
                              <div className="progress-bar" style={{
                                width:`${prog.pct}%`,
                                background: prog.pct >= 70 ? "var(--success)" : prog.pct >= 40 ? "var(--warn)" : "var(--danger)"
                              }} />
                            </div>
                          </td>
                          <td onClick={e => e.stopPropagation()}>
                            <EditableCell
                              value={m.cota_anual}
                              placeholder="—"
                              prefix="$"
                              onSave={async (val) => {
                                const { error } = await supabaseClient.from("perfil_medico").update({cota_anual: val ? Number(val) : null}).eq("id", m.id);
                                if(error) alert("Erro: "+error.message);
                                else refreshMedicos();
                              }}
                            />
                          </td>
                          <td onClick={e => e.stopPropagation()}>
                            <EditableCell
                              value={m.vendas_realizadas}
                              placeholder="—"
                              prefix="$"
                              onSave={async (val) => {
                                const { error } = await supabaseClient.from("perfil_medico").update({vendas_realizadas: val ? Number(val) : null}).eq("id", m.id);
                                if(error) alert("Erro: "+error.message);
                                else refreshMedicos();
                              }}
                            />
                          </td>
                          <td style={{fontFamily:"DM Mono",fontSize:12}}>
                            {m.cota_anual && m.vendas_realizadas
                              ? `${Math.round(m.vendas_realizadas/m.cota_anual*100)}%`
                              : <span className="td-muted">—</span>}
                          </td>
                          <td style={{minWidth:100}}>
                            {m.cota_anual && m.vendas_realizadas ? (
                              <div className="progress-wrap" style={{minWidth:80}}>
                                <div className="progress-bar" style={{
                                  width:`${Math.min(Math.round(m.vendas_realizadas/m.cota_anual*100),100)}%`,
                                  background: m.vendas_realizadas/m.cota_anual>=1 ? "var(--success)" : m.vendas_realizadas/m.cota_anual>=0.6 ? "var(--warn)" : "var(--danger)"
                                }}/>
                              </div>
                            ) : <span className="td-muted">—</span>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      )}
      {toast && <Toast msg={toast} onHide={() => setToast(null)} />}
    </div>
  );
}


// ─── INTELIGÊNCIA ESTRATÉGICA ──────────────────────────────────────────────
function Inteligencia() {
  const { data: visitas, loading } = useSupabase("visitas");
  const { data: medicos } = useSupabase("perfil_medico");
  const { data: medicoTps } = useSupabase("medico_tps");

  if (loading) return <div className="loading"><div className="spinner"/>Carregando...</div>;

  const MARKETING = ["Cibele","Guilherme","Sarah","Catharina","Júlia"];
  const COMERCIAL = ["Marcell","Fernanda","Ana Marieta","Inside Sales"];
  const TIER_PRIORITY = ["ST","1","2","3"];

  // ── Médicos sem TP registrado (comercial only)
  const semTP = medicos.filter(m =>
    !visitas.some(v => v.medico_nome === m.nome)
  );

  // ── Alta probabilidade
  const altaProb = visitas.filter(v => v.probabilidade === "Alto");

  // ── Cobertura por tier
  const tierCoverage = ["1","2","3","4","5"].map(tier => {
    const mTier = medicos.filter(m => String(m.tier) === tier);
    const visitados = mTier.filter(m => visitas.some(v => v.medico_nome === m.nome && v.canal === "Presencial"));
    const pct = mTier.length ? Math.round(visitados.length/mTier.length*100) : 0;
    const alert = pct===0 ? "🔴 SEM PRESENCIAL" : pct>=60 ? "🟢 BOA COBERTURA" : pct>=30 ? "🟡 ATENÇÃO" : "🔴 CRÍTICO";
    return {tier, total:mTier.length, visitados:visitados.length, faltantes:mTier.length-visitados.length, pct, alert};
  });

  // ── Alerta T1/2/3 — detalhado
  const alertaMedicos = medicos
    .filter(m => ["ST","1","2","3"].includes(String(m.tier)))
    .map(m => {
      const ultimaVisita = visitas.filter(v => v.medico_nome === m.nome).sort((a,b) => new Date(b.data_contato)-new Date(a.data_contato))[0];
      const mTps = medicoTps.filter(t => t.medico_id === m.id && t.concluido);
      const urgencia = ["ST","1"].includes(String(m.tier)) ? "🔴 CRÍTICO — agendar ESTA semana" : "🟡 URGENTE — incluir na rota";
      return {
        ...m,
        canal: ultimaVisita?.canal || "— sem registro —",
        ultimoTp: ultimaVisita?.ultimo_tp || "— sem TP —",
        probabilidade: ultimaVisita?.probabilidade || "—",
        valorEsperado: ultimaVisita?.valor_esperado || "—",
        temPresencial: visitas.some(v => v.medico_nome === m.nome && v.canal === "Presencial"),
        urgencia,
      };
    })
    .sort((a,b) => (a.tier||"9").localeCompare(b.tier||"9"));

  // ── GAP Estratégico — T ST/1/2/3 sem nenhuma ação
  const gapMedicos = medicos
    .filter(m => ["ST","1","2","3"].includes(String(m.tier)) && !visitas.some(v => v.medico_nome === m.nome))
    .sort((a,b) => (a.tier||"9").localeCompare(b.tier||"9"));

  // ── Visitas Time Marketing
  const visMarketing = visitas.filter(v => MARKETING.some(n => v.responsavel?.includes(n)));
  const mkByResp = MARKETING.map(resp => {
    const v = visitas.filter(vi => vi.responsavel === resp);
    return {
      resp,
      total: v.length,
      presencial: v.filter(vi => vi.canal === "Presencial").length,
      whatsapp: v.filter(vi => vi.canal === "WhatsApp").length,
      medicos: new Set(v.map(vi => vi.medico_nome)).size,
      obs: v.filter(vi => vi.obs).length,
    };
  });
  const mkTotals = {
    total: visMarketing.length,
    presencial: visMarketing.filter(v => v.canal === "Presencial").length,
    whatsapp: visMarketing.filter(v => v.canal === "WhatsApp").length,
    medicos: new Set(visMarketing.map(v => v.medico_nome)).size,
  };

  // ── Estoque ESG (Fios) — puxado de visitas (último registro por médico)
  const estoqueESG = medicos.map(m => {
    const vs = visitas.filter(v => v.medico_nome === m.nome).sort((a,b) => new Date(b.data_contato)-new Date(a.data_contato));
    const last = vs[0];
    const fios = last?.fios_esg_estoque ?? "—";
    const proc = last?.proc_marcados_esg ?? "—";
    const necessarios = (typeof fios === "number" && typeof proc === "number") ? Math.max(0, proc - fios) : "—";
    const saldo = (typeof fios === "number" && typeof proc === "number") ? fios - proc : "—";
    const status = typeof saldo === "number" ? (saldo <= 0 ? "🔴 SEM ESTOQUE" : saldo <= 2 ? "🟡 BAIXO" : "🟢 OK") : "— sem estoque —";
    const alerta = typeof saldo === "number" && saldo <= 2 ? "⚠ Agendar compra" : "—";
    return { nome: m.nome, account: m.account, tier: m.tier, fios, proc, necessarios, saldo, status, alerta };
  }).filter(m => m.fios !== "—" || m.proc !== "—");

  // ── Estoque Balões
  const estoqueBaloes = medicos.map(m => {
    const vs = visitas.filter(v => v.medico_nome === m.nome).sort((a,b) => new Date(b.data_contato)-new Date(a.data_contato));
    const last = vs[0];
    const baloes = last?.baloes_estoque ?? "—";
    const proc = last?.proc_marcados_balao ?? "—";
    const saldo = (typeof baloes === "number" && typeof proc === "number") ? baloes - proc : "—";
    const status = typeof saldo === "number" ? (saldo <= 0 ? "🔴 SEM ESTOQUE" : saldo <= 1 ? "🟡 BAIXO" : "🟢 OK") : "— sem estoque —";
    const alerta = typeof saldo === "number" && saldo <= 1 ? "⚠ Agendar compra" : "—";
    return { nome: m.nome, account: m.account, tier: m.tier, baloes, proc, saldo, status, alerta };
  }).filter(m => m.baloes !== "—" || m.proc !== "—");

  // ── Referenciadores — visitas onde referidor=true
  const visRef = visitas.filter(v => v.referidor);
  const refByResp = [...COMERCIAL, ...MARKETING].map(resp => {
    const v = visRef.filter(vi => vi.responsavel === resp);
    return { resp, total: v.length, presencial: v.filter(vi => vi.canal === "Presencial").length, whatsapp: v.filter(vi => vi.canal === "WhatsApp").length, pct: v.length ? Math.round(v.filter(vi => vi.canal==="Presencial").length/v.length*100) : 0 };
  }).filter(r => r.total > 0);

  const espDist = {};
  visRef.forEach(v => { if(v.especialidade) espDist[v.especialidade] = (espDist[v.especialidade]||0)+1; });

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Inteligência Estratégica</div>
          <div className="section-sub">Análise cruzada · atualiza automaticamente com as visitas</div>
        </div>
      </div>

      {/* ROW 1: Sem TP + Alta Prob */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <div className="card">
          <div className="card-title">⚡ Sem TP Registrado</div>
          {semTP.length === 0 ? <div className="empty">Todos têm TP registrado 🎉</div> :
            semTP.slice(0,8).map(m => (
              <div key={m.id} style={{fontSize:13,padding:"5px 0",borderBottom:"1px solid var(--border)",display:"flex",gap:8,alignItems:"center"}}>
                <span style={{color:"var(--danger)"}}>●</span>
                <span style={{fontWeight:500}}>{m.nome}</span>
                <span className="badge badge-tier" style={{background:`${TIER_COLOR[m.tier]||"#888"}22`,color:TIER_COLOR[m.tier]||"#888",fontSize:10}}>T{m.tier}</span>
              </div>
            ))
          }
        </div>
        <div className="card">
          <div className="card-title">🔥 Alta Probabilidade</div>
          {altaProb.length === 0 ? <div className="empty">Nenhum médico com alta probabilidade.</div> :
            altaProb.map(v => (
              <div key={v.id} style={{fontSize:13,padding:"5px 0",borderBottom:"1px solid var(--border)"}}>
                <div style={{fontWeight:500}}>{v.medico_nome}</div>
                <div style={{fontSize:11,color:"var(--muted)"}}>{v.responsavel} · {v.canal} · {v.acao_prevista||"—"}</div>
              </div>
            ))
          }
        </div>
      </div>

      {/* Cobertura por Tier */}
      <div className="card" style={{marginBottom:12}}>
        <div className="card-title">▶ Cobertura por Tier</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Tier</th><th>Total Carteira</th><th>Na Planilha</th><th>% Cobertura</th><th>Faltantes</th><th>Alerta</th></tr></thead>
            <tbody>
              {tierCoverage.map(t => (
                <tr key={t.tier}>
                  <td><span className="badge badge-tier" style={{background:`${TIER_COLOR[t.tier]||"#888"}22`,color:TIER_COLOR[t.tier]||"#888"}}>T{t.tier}</span></td>
                  <td style={{fontFamily:"DM Mono"}}>{t.total}</td>
                  <td style={{fontFamily:"DM Mono"}}>{t.visitados}</td>
                  <td>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div className="progress-wrap" style={{flex:1}}><div className="progress-bar" style={{width:`${t.pct}%`,background:t.pct>=60?"var(--success)":t.pct>=30?"var(--warn)":"var(--danger)"}}/></div>
                      <span style={{fontFamily:"DM Mono",fontSize:12,minWidth:36}}>{t.pct}%</span>

                  </td>
                  <td style={{fontFamily:"DM Mono",fontSize:12,color:"var(--danger)"}}>{t.faltantes}</td>
                  <td style={{fontSize:12}}>{t.alert}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Alerta T1/2/3 detalhado */}
      <div className="card" style={{marginBottom:12}}>
        <div className="card-title">🚨 Alerta — Médicos T1/2/3 Sem Visita Presencial</div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Tier</th><th>Médico</th><th>Account</th><th>Estado</th><th>Canal Atual</th><th>Último TP</th><th>Prob.</th><th>Urgência</th></tr></thead>
            <tbody>
              {alertaMedicos.filter(m => !m.temPresencial).map(m => (
                <tr key={m.id}>
                  <td><span className="badge badge-tier" style={{background:`${TIER_COLOR[m.tier]||"#888"}22`,color:TIER_COLOR[m.tier]||"#888"}}>T{m.tier||"ST"}</span></td>
                  <td style={{fontWeight:500}}>{m.nome}</td>
                  <td className="td-muted">{m.account||"—"}</td>
                  <td className="td-muted">{m.estado||"—"}</td>
                  <td className="td-muted" style={{fontSize:11}}>{m.canal}</td>
                  <td className="td-muted" style={{fontSize:11}}>{m.ultimoTp}</td>

            </tbody>
          </table>
        </div>

      {/* GAP Estratégico */}
      {gapMedicos.length > 0 && (
        <div className="card" style={{marginBottom:12}}>
          <div className="card-title">📍 GAP Estratégico — T ST/1/2/3 Sem Nenhuma Ação</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {gapMedicos.map(m => (
              <span key={m.id} style={{background:"rgba(239,68,68,0.08)",border:"1px solid rgba(239,68,68,0.25)",borderRadius:6,padding:"4px 10px",fontSize:12,display:"flex",gap:6,alignItems:"center"}}>
                <span style={{color:TIER_COLOR[m.tier]||"#888",fontFamily:"DM Mono",fontSize:10}}>T{m.tier}</span>
                {m.nome}
                <span className="td-muted" style={{fontSize:10}}>{m.account}</span>
              </span>

        <div className="kpi-row" style={{marginBottom:"1rem"}}>
          {[
            {label:"Total Visitas MKT", val: mkTotals.total},
            {label:"WhatsApp MKT", val: mkTotals.whatsapp},
            {label:"Presenciais MKT", val: mkTotals.presencial},
            {label:"Médicos Atendidos", val: mkTotals.medicos},
          ].map(k => (
            <div className="kpi" key={k.label}>
              <div className="kpi-label">{k.label}</div>
              <div className="kpi-value" style={{fontSize:22}}>{k.val}</div>
            </div>
          ))}
        </div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Responsável</th><th>Total</th><th>Presencial</th><th>WhatsApp</th><th>Médicos</th><th>Obs. Registradas</th></tr></thead>
            <tbody>
              {mkByResp.map(r => (
                <tr key={r.resp}>
                  <td style={{fontWeight:500}}>{r.resp}</td>
                  <td style={{fontFamily:"DM Mono"}}>{r.total}</td>
                  <td style={{fontFamily:"DM Mono"}}>{r.presencial}</td>
                  <td style={{fontFamily:"DM Mono"}}>{r.whatsapp}</td>
                  <td style={{fontFamily:"DM Mono"}}>{r.medicos}</td>
                  <td style={{fontFamily:"DM Mono"}}>{r.obs}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Estoque ESG Fios */}
      <div className="card" style={{marginBottom:12}}>
        <div className="card-title">🔧 Inteligência de Estoque — ESG (Fios)</div>
        {estoqueESG.length === 0 ? <div className="empty">Nenhum dado de estoque registrado ainda.</div> : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Médico</th><th>Account</th><th>Fios Estoque</th><th>Proc. Marcados</th><th>Fios Necessários</th><th>Saldo Fios</th><th>Status</th><th>Alerta</th></tr></thead>
              <tbody>
                {estoqueESG.map((m,i) => (

// ─── METAS MENSAIS ─────────────────────────────────────────────────────────
const MESES = [
  "JANEIRO 26","FEVEREIRO 26","MARÇO 26","ABRIL 26","MAIO 26","JUNHO 26",
  "JULHO 26","AGOSTO 26","SETEMBRO 26","OUTUBRO 26","NOVEMBRO 26","DEZEMBRO 26"
];
const TEAM = ["Marcell","Fernanda","Ana Marieta","Inside Sales","Cibele","Guilherme","Sarah","Catharina","Júlia"];

function Metas() {
  const { data: visitas } = useSupabase("visitas");
  const { data: medicoTps } = useSupabase("medico_tps");
  const [metas, setMetas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [mes, setMes] = useState("JUNHO 26");
  const [editing, setEditing] = useState(null);
  const [toast, setToast] = useState(null);

  const fetchMetas = useCallback(async () => {
    if (!isConfigured) { setLoading(false); return; }
    const { data } = await supabaseClient.from("metas").select("*").eq("mes", mes);
    setMetas(data || []);
    setLoading(false);
  }, [mes]);

  useEffect(() => { fetchMetas(); }, [fetchMetas]);

  const getMeta = (resp) => metas.find(m => m.responsavel === resp) || {
    responsavel: resp, mes,
    meta_visitas: 0, meta_presenciais: 0,
    meta_procedimentos: 0, meta_receita: 0
  };

  const getReal = (resp) => {
    const v = visitas.filter(vi => vi.responsavel === resp && vi.mes === mes);
    const tpsDone = medicoTps.filter(t => t.concluido).length;
    return {
      visitas: v.length,
      presenciais: v.filter(vi => vi.canal === "Presencial").length,
      procedimentos: v.reduce((s, vi) => s + (vi.proc_marcados_esg || 0), 0),
      receita: v.reduce((s, vi) => s + (vi.valor_esperado || 0), 0),
      tps: tpsDone,
    };
  };

  const saveMeta = async (form) => {
    if (!isConfigured) return;
    const existing = metas.find(m => m.responsavel === form.responsavel);
    if (existing) {
      await supabaseClient.from("metas").update(form).eq("id", existing.id);
    } else {
      await supabaseClient.from("metas").insert([form]);
    }
    setToast("Meta salva!");
    setEditing(null);
    fetchMetas();
  };

  const pct = (real, meta) => meta > 0 ? Math.min(Math.round((real / meta) * 100), 100) : 0;
  const color = (p) => p >= 100 ? "var(--success)" : p >= 60 ? "var(--warn)" : "var(--danger)";

  const totais = TEAM.reduce((acc, r) => {
    const real = getReal(r);
    const meta = getMeta(r);
    acc.visitas_real += real.visitas;
    acc.presenciais_real += real.presenciais;
    acc.proc_real += real.procedimentos;
    acc.receita_real += real.receita;
    acc.visitas_meta += meta.meta_visitas;
    acc.presenciais_meta += meta.meta_presenciais;
    acc.proc_meta += meta.meta_procedimentos;
    acc.receita_meta += meta.meta_receita;
    return acc;
  }, { visitas_real:0, presenciais_real:0, proc_real:0, receita_real:0,
       visitas_meta:0, presenciais_meta:0, proc_meta:0, receita_meta:0 });

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Metas Mensais</div>
          <div className="section-sub">Realizado vs. meta por responsável</div>
        </div>
        <select className="search-select" value={mes} onChange={e => setMes(e.target.value)}>
          {MESES.map(m => <option key={m}>{m}</option>)}
        </select>
      </div>

      {!isConfigured && <ConfigBanner />}

      {/* KPIs do time */}
      <div className="kpi-row" style={{marginBottom:"1.25rem"}}>
        {[
          { label:"Visitas Time", real: totais.visitas_real, meta: totais.visitas_meta },
          { label:"Presenciais", real: totais.presenciais_real, meta: totais.presenciais_meta },
          { label:"Procedimentos", real: totais.proc_real, meta: totais.proc_meta },
          { label:"Receita Esperada $", real: totais.receita_real, meta: totais.receita_meta, money: true },
        ].map(k => {
          const p = pct(k.real, k.meta);
          return (
            <div className="kpi" key={k.label}>
              <div className="kpi-label">{k.label}</div>
              <div className="kpi-value" style={{color: color(p), fontSize:22}}>
                {k.money ? `$${k.real.toLocaleString("pt-BR")}` : k.real}
              </div>
              <div style={{marginTop:6}}>
                <div className="progress-wrap">
                  <div className="progress-bar" style={{width:`${p}%`, background: color(p)}} />
                </div>
                <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>
                  {p}% de {k.money ? `$${k.meta.toLocaleString("pt-BR")}` : k.meta}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Tabela por responsável */}
      <div className="card" style={{padding:0}}>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Responsável</th>
                <th>Visitas</th>
                <th>Presenciais</th>
                <th>Procedimentos</th>
                <th>Receita $</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {TEAM.map(resp => {
                const real = getReal(resp);
                const meta = getMeta(resp);
                return (
                  <tr key={resp}>
                    <td style={{fontWeight:600}}>{resp}</td>
                    {[
                      [real.visitas, meta.meta_visitas],
                      [real.presenciais, meta.meta_presenciais],
                      [real.procedimentos, meta.meta_procedimentos],
                      [real.receita, meta.meta_receita, true],
                    ].map(([r, m, money], i) => {
                      const p = pct(r, m);
                      return (
                        <td key={i} style={{minWidth:100}}>
                          <div style={{fontSize:13,fontWeight:500,marginBottom:3}}>
                            <span style={{color: color(p)}}>
                              {money ? `$${r.toLocaleString("pt-BR")}` : r}
                            </span>
                            <span style={{color:"var(--muted)",fontSize:11}}> / {money ? `$${m.toLocaleString("pt-BR")}` : m}</span>
                          </div>
                          <div className="progress-wrap">
                            <div className="progress-bar" style={{width:`${p}%`, background: color(p)}} />
                          </div>
                        </td>
                      );
                    })}
                    <td>
                      <button className="btn btn-ghost btn-sm" onClick={() => setEditing(meta)}>
                        Definir Meta
                      </button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {editing && (
        <MetaModal
          meta={editing}
          mes={mes}
          onSave={saveMeta}
          onClose={() => setEditing(null)}
        />
      )}
      {toast && <Toast msg={toast} onHide={() => setToast(null)} />}
    </div>
  );
}

function MetaModal({ meta, mes, onSave, onClose }) {
  const [form, setForm] = useState({
    responsavel: meta.responsavel,
    mes,
    meta_visitas: meta.meta_visitas || 0,
    meta_presenciais: meta.meta_presenciais || 0,
    meta_procedimentos: meta.meta_procedimentos || 0,
    meta_receita: meta.meta_receita || 0,
  });
  const set = (k, v) => setForm(f => ({...f, [k]: Number(v)}));

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">
          Meta — {meta.responsavel}
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div style={{fontSize:12,color:"var(--muted)",marginBottom:"1rem"}}>{mes}</div>
        <div className="form-grid">
          {[
            ["meta_visitas", "Meta Visitas"],
            ["meta_presenciais", "Meta Presenciais"],
            ["meta_procedimentos", "Meta Procedimentos (ESG)"],
            ["meta_receita", "Meta Receita ($)"],
          ].map(([key, label]) => (
            <div className="form-group" key={key}>
              <label className="form-label">{label}</label>
              <input
                className="form-input"
                type="number"
                value={form[key]}
                onChange={e => set(key, e.target.value)}
              />
            </div>
          ))}
        </div>
        <div className="btn-row">
          <button className="btn btn-primary" onClick={() => onSave(form)}>Salvar Meta</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}



// ─── HISTÓRICO SEMANAL ─────────────────────────────────────────────────────
function Historico() {
  const { data: visitas, loading, refresh } = useSupabase("visitas");
  const [filterResp, setFilterResp] = useState("");
  const [filterCanal, setFilterCanal] = useState("");
  const [filterSemana, setFilterSemana] = useState("");
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState(null);
  const [selectedVisita, setSelectedVisita] = useState(null);

  const handleDelete = async (id) => {
    const { error } = await supabaseClient.from("visitas").delete().eq("id", id);
    if (error) { alert("Erro ao excluir: " + error.message); return; }
    setToast("Visita excluída!");
    setSelectedVisita(null);
    refresh();
  };

  // Group by week
  const getSemana = (data) => {
    if (!data) return "Sem data";
    const d = new Date(data + "T00:00:00");
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    const monday = new Date(d.setDate(diff));
    return monday.toLocaleDateString("pt-BR", {day:"2-digit",month:"2-digit",year:"numeric"});
  };

  const semanas = [...new Set(visitas.map(v => getSemana(v.data_contato)))].sort((a,b) => {
    const [da,ma,ya] = a.split("/"); const [db,mb,yb] = b.split("/");
    return new Date(`${yb}-${mb}-${db}`) - new Date(`${ya}-${ma}-${da}`);
  });

  const filtered = [...visitas]
    .filter(v => {
      const q = search.toLowerCase();
      return (!q || v.medico_nome?.toLowerCase().includes(q) || v.obs?.toLowerCase().includes(q))
        && (!filterResp || v.responsavel === filterResp)
        && (!filterCanal || v.canal === filterCanal)
        && (!filterSemana || getSemana(v.data_contato) === filterSemana);
    })
    .sort((a,b) => new Date(b.data_contato||0) - new Date(a.data_contato||0));

  // KPIs of filtered
  const kpis = {
    total: filtered.length,
    presenciais: filtered.filter(v => v.canal === "Presencial").length,
    whatsapp: filtered.filter(v => v.canal === "WhatsApp").length,
    medicos: new Set(filtered.map(v => v.medico_nome)).size,
    mktSupport: filtered.filter(v => v.suporte_marketing).length,
    altaProb: filtered.filter(v => v.probabilidade === "Alto").length,
  };

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Histórico de Visitas</div>
          <div className="section-sub">{visitas.length} visitas registradas no total</div>
        </div>
      </div>

      {/* KPIs */}
      <div className="kpi-row" style={{marginBottom:"1rem"}}>
        <div className="kpi"><div className="kpi-label">Visitas</div><div className="kpi-value">{kpis.total}</div></div>
        <div className="kpi"><div className="kpi-label">Presenciais</div><div className="kpi-value" style={{color:"var(--teal)"}}>{kpis.presenciais}</div></div>
        <div className="kpi"><div className="kpi-label">WhatsApp</div><div className="kpi-value" style={{color:"var(--warn)"}}>{kpis.whatsapp}</div></div>
        <div className="kpi"><div className="kpi-label">Médicos Únicos</div><div className="kpi-value">{kpis.medicos}</div></div>
        <div className="kpi"><div className="kpi-label">Alta Prob.</div><div className="kpi-value" style={{color:"var(--success)"}}>{kpis.altaProb}</div></div>
        <div className="kpi"><div className="kpi-label">Suporte MKT</div><div className="kpi-value" style={{color:"#8b5cf6"}}>{kpis.mktSupport}</div></div>
      </div>

      {/* Filters */}
      <div className="search-row">
        <input className="search-input" placeholder="Buscar médico ou observação..." value={search} onChange={e => setSearch(e.target.value)} />
        <select className="search-select" value={filterSemana} onChange={e => setFilterSemana(e.target.value)}>
          <option value="">Todas as semanas</option>
          {semanas.map(s => <option key={s} value={s}>Semana de {s}</option>)}
        </select>
        <select className="search-select" value={filterResp} onChange={e => setFilterResp(e.target.value)}>
          <option value="">Todos responsáveis</option>
          {RESPONSAVEIS.filter(r => !r.startsWith("──")).map(r => <option key={r}>{r}</option>)}
        </select>
        <select className="search-select" value={filterCanal} onChange={e => setFilterCanal(e.target.value)}>
          <option value="">Todos os canais</option>
          {CANAIS.map(c => <option key={c}>{c}</option>)}
        </select>
      </div>

      {loading ? <div className="loading"><div className="spinner"/>Carregando...</div> : (
        <div className="card" style={{padding:0}}>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Semana</th>
                  <th>Responsável</th>
                  <th>Médico</th>
                  <th>Referidor?</th>

function BaseDados() {
  const { data: medicos, loading: loadingM } = useSupabase("perfil_medico");
  const [selected, setSelected] = useState(null);
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState(null);

  const [showNew, setShowNew] = useState(false);
  const [toast2, setToast2] = useState(null);

  const filtered = medicos.filter(m =>
    !search || m.nome?.toLowerCase().includes(search.toLowerCase()) ||
    m.estado?.toLowerCase().includes(search.toLowerCase())
  ).sort((a,b) => (a.tier||"9").localeCompare(b.tier||"9"));

  const completeness = (m) => {
    const filled = PERFIL_FIELDS.filter(f => m[f.key] && m[f.key] !== "").length;
    return Math.round((filled / PERFIL_FIELDS.length) * 100);
  };

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">Base de Dados</div>
          <div className="section-sub">{medicos.length} médicos · clique para editar</div>
        </div>
      </div>

      <div className="search-row">
        <input className="search-input" placeholder="Buscar médico, estado..." value={search} onChange={e => setSearch(e.target.value)} />
        <button className="btn btn-primary" onClick={() => setShowNew(true)}>+ Novo Médico</button>
      </div>

      {showNew && (
        <EditMedicoModal
          medico={{nome:"", tier:"", estado:"", regiao:"", clinica:""}}
          isNew={true}
          onSave={async (form) => {
            if (!isConfigured) return;
            await supabaseClient.from("perfil_medico").insert([form]);
            setToast2("Médico cadastrado!");
            setShowNew(false);
          }}
          onClose={() => setShowNew(false)}
        />
      )}
      {toast2 && <Toast msg={toast2} onHide={() => setToast2(null)} />}

      {loadingM ? <div className="loading"><div className="spinner"/>Carregando...</div> : (
        <div className="card" style={{padding:0}}>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Médico</th>
                  <th>Tier</th>
                  <th>Estado</th>
                  <th>Perfil</th>
                  <th>Core</th>
                  <th>Preenchimento</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(m => {
                  const pct = completeness(m);
                  return (
                    <tr key={m.id} style={{cursor:"pointer"}} onClick={() => setSelected(m)}>
                      <td style={{fontWeight:500}}>{m.nome}</td>
                      <td><span className="badge badge-tier" style={{background:`${TIER_COLOR[m.tier]||"#888"}22`,color:TIER_COLOR[m.tier]||"#888"}}>{m.tier ? `T${m.tier}` : "—"}</span></td>
                      <td className="td-muted">{m.estado || "—"}</td>
                      <td className="td-muted" style={{fontSize:12}}>{m.perfil_medico || "—"}</td>
                      <td className="td-muted">{m.core || "—"}</td>
                      <td style={{minWidth:120}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <div className="progress-wrap" style={{flex:1}}>
                            <div className="progress-bar" style={{width:`${pct}%`, background: pct>=70?"var(--success)":pct>=40?"var(--warn)":"var(--danger)"}} />
                          </div>
                          <span style={{fontSize:11,color:"var(--muted)",minWidth:30}}>{pct}%</span>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {selected && (
        <EditMedicoModal
          medico={selected}
          onSave={async (updated) => {
            if (!isConfigured) return;
            await supabaseClient.from("perfil_medico").update(updated).eq("id", selected.id);
            setToast("Dados salvos!");
            setSelected(null);
          }}
          onClose={() => setSelected(null)}
        />
      )}
      {toast && <Toast msg={toast} onHide={() => setToast(null)} />}
    </div>
  );
}

function EditMedicoModal({ medico, onSave, onClose }) {
  const [form, setForm] = useState({...medico});
  const set = (k, v) => setForm(f => ({...f, [k]: v}));

  const groups = [...new Set(PERFIL_FIELDS.map(f => f.group))];

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{maxWidth:680}}>
        <div className="modal-title">
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div className="medico-avatar">{initials(medico.nome)}</div>
            <div>
              <div>{medico.nome}</div>
              <div style={{fontSize:12,fontWeight:400,color:"var(--muted)"}}>{medico.clinica || medico.estado || "—"}</div>
            </div>
          </div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>

        <div style={{marginBottom:"1.25rem"}}>
          <div style={{fontSize:11,fontWeight:700,color:"var(--teal)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8,paddingBottom:4,borderBottom:"1px solid var(--border)"}}>
            Nome do Médico
          </div>
          <div className="form-group">
            <label className="form-label">Nome Completo *</label>
            <input className="form-input" value={form.nome || ""} onChange={e => set("nome", e.target.value)} placeholder="Ex: Dr. João Silva" />
          </div>
        </div>

        {groups.map(group => (
          <div key={group} style={{marginBottom:"1.25rem"}}>
            <div style={{fontSize:11,fontWeight:700,color:"var(--teal)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8,paddingBottom:4,borderBottom:"1px solid var(--border)"}}>
              {group}
            </div>
            <div className="form-grid">
              {PERFIL_FIELDS.filter(f => f.group === group).map(field => (
                <div className="form-group" key={field.key}>
                  <label className="form-label">{field.label}</label>
                  {field.type === "select" ? (
                    <select className="form-select" value={form[field.key] || ""} onChange={e => set(field.key, e.target.value)}>
                      <option value="">—</option>
                      {field.options.map(o => <option key={o}>{o}</option>)}
                    </select>
                  ) : (
                    <input className="form-input" value={form[field.key] || ""} onChange={e => set(field.key, e.target.value)} />
                  )}
                </div>
              ))}
            </div>
          </div>
        ))}

        <div className="btn-row">
          <button className="btn btn-primary" onClick={() => onSave(form)}>Salvar</button>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

        ...fupInitialState.cursoBariatricos,
        ...parsed.cursoBariatricos,
        medicos: parsed.cursoBariatricos?.medicos?.length
          ? parsed.cursoBariatricos.medicos
          : fupInitialState.cursoBariatricos.medicos,
      },
      cursoEndoscopistas: {
        ...fupInitialState.cursoEndoscopistas,
        ...parsed.cursoEndoscopistas,
      },
      imersaoMarketing: {
        ...fupInitialState.imersaoMarketing,
        ...parsed.imersaoMarketing,
      },
    };
  } catch (e) {
    console.error("Load error:", e);
    return fupInitialState;
  }
}

function fupSaveData(data) {
  try {
    localStorage.setItem(FUP_STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error("Save error:", e);
    return false;
  }
}
async function fupLoadRemote() {
  try {
    const { data, error } = await supabaseClient.from("fup_projetos").select("data").eq("id", "shared").single();
    if (error || !data) return null;
    return data.data || null;
  } catch(e) { return null; }
}
async function fupSaveRemote(d) {
  try {
    const { error } = await supabaseClient.from("fup_projetos").upsert({ id: "shared", data: d, updated_at: new Date().toISOString() });
    return !error;
  } catch(e) { return false; }
}

function EsgDayProject({ data, onChange }) {
  const [modal, setModal] = useState(false);
  const [editModal, setEditModal] = useState(null); // record being edited
  const [detalheId, setDetalheId] = useState(null); // clinica detail view
  const [fupModal, setFupModal] = useState(null); // clinica id for new follow-up
  const [fupForm, setFupForm] = useState({ data: "", tipo: "Visita presencial", procedimentosFechados: "", obs: "" });
  const [form, setForm] = useState({
    clinica: "", cidade: "", data: "", responsavel: "", medico: "",
    pacientesElegiveis: "", convidados: "", confirmados: "", compareceram: "",
    procedimentos30d: "", ticketMedio: "", custoEvento: "", obs: "",
  });
  const [activeTab, setActiveTab] = useState("form");

  const records = data || [];

  const totals = records.reduce((a, r) => ({
    eventos: a.eventos + 1,
    compareceram: a.compareceram + (+r.compareceram || 0),
    procedimentos: a.procedimentos + (+r.procedimentos30d || 0),
    receita: a.receita + ((+r.procedimentos30d || 0) * (+r.ticketMedio || 0)),
    custo: a.custo + (+r.custoEvento || 0),
  }), { eventos: 0, compareceram: 0, procedimentos: 0, receita: 0, custo: 0 });

  const conversaoMedia = totals.compareceram > 0
    ? ((totals.procedimentos / totals.compareceram) * 100).toFixed(1)
    : 0;
  const roi = totals.custo > 0
    ? (((totals.receita - totals.custo) / totals.custo) * 100).toFixed(0)
    : "—";

  const save = () => {
    const newRec = { ...form, id: fupUid() };
    onChange([...records, newRec]);
    setModal(false);
    setForm({ clinica: "", cidade: "", data: "", responsavel: "", medico: "", pacientesElegiveis: "", convidados: "", confirmados: "", compareceram: "", procedimentos30d: "", ticketMedio: "", custoEvento: "", obs: "" });
  };

  const del = (id) => onChange(records.filter((r) => r.id !== id));
  const saveEdit = (updated) => { onChange(records.map((r) => r.id === updated.id ? updated : r)); setEditModal(null); };
  const saveFup = () => {
    if (!fupModal) return;
    onChange(records.map((r) => r.id === fupModal
      ? { ...r, followups: [...(r.followups || []), { ...fupForm, id: fupUid() }] }
      : r));
    setFupModal(null);
    setFupForm({ data: "", tipo: "Visita presencial", procedimentosFechados: "", obs: "" });
  };
  const updateProcedimentos = (id, val) => onChange(records.map((r) => r.id === id ? { ...r, procedimentos30d: val } : r));

  const chartData = records.map((r) => ({
    name: r.clinica || "—",
    Convidados: +r.convidados || 0,
    Compareceram: +r.compareceram || 0,
    Fechados: +r.procedimentos30d || 0,
  }));

  const roiData = records
    .filter((r) => +r.custoEvento > 0)
    .map((r) => {
      const rec = (+r.procedimentos30d || 0) * (+r.ticketMedio || 0);
      const custo = +r.custoEvento;
      return { name: r.clinica, ROI: +((((rec - custo) / custo) * 100).toFixed(0)) };
    });

  return (
    <div>
      {/* KPIs */}
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 28 }}>
        <FupKPICard label="Total Eventos" value={totals.eventos} icon="🎯" />
        <FupKPICard label="Compareceram" value={totals.compareceram} icon="👥" />
        <FupKPICard label="Procedimentos 30d" value={totals.procedimentos} color={FUP_C.green} icon="✓" />
        <FupKPICard label="Conversão Média" value={`${conversaoMedia}%`} color={conversaoMedia >= 40 ? FUP_C.green : conversaoMedia >= 25 ? FUP_C.yellow : FUP_C.red} sub="Meta: ≥ 40%" icon="📊" />
        <FupKPICard label="Receita Total" value={`R$ ${(totals.receita / 1000).toFixed(0)}k`} color={FUP_C.teal} icon="💰" />
        <FupKPICard label="ROI Médio" value={`${roi}%`} color={FUP_C.purple} sub="Custo vs Receita" icon="📈" />
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {["form", "dashboard"].map((t) => (
          <button key={t} onClick={() => setActiveTab(t)} style={{
            padding: "8px 20px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
            background: activeTab === t ? FUP_C.teal : "transparent",
            color: activeTab === t ? "#fff" : FUP_C.textMuted,
            border: `1px solid ${activeTab === t ? FUP_C.teal : FUP_C.border}`,
          }}>{t === "form" ? "📋 Registros" : "📊 Dashboard"}</button>
        ))}
        <FupBtn onClick={() => setModal(true)} style={{ marginLeft: "auto" }}>+ Novo Evento</FupBtn>
      </div>

      {activeTab === "form" ? (
        <div>
          {records.length === 0 ? (
            <div style={{ textAlign: "center", padding: 48, color: FUP_C.textDim }}>
              <div style={{ fontSize: 40, marginBottom: 12 }}>🎯</div>
              <div>Nenhum evento cadastrado ainda.</div>
              <div style={{ fontSize: 12, marginTop: 6 }}>Clique em "+ Novo Evento" para adicionar.</div>
            </div>

            <div style={{ overflowX: "auto" }}>

                      <th key={h} style={{ padding: "10px 12px", textAlign: "left", color: FUP_C.textMuted, fontWeight: 600, fontSize: 11, letterSpacing: "0.06em" }}>{h}</th>
