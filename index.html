// AULAS REFERIDORES
// ════════════════════════════════════════════════════════════════════════════
function AulasReferidoresProject({ data, onChange }) {
  const [activeTab, setActiveTab] = useState("eventos");
  const [eventoModal, setEventoModal] = useState(false);
  const [refModal, setRefModal] = useState(null); // eventoId
  const [eventoForm, setEventoForm] = useState({
    nome: "", dataEvento: "", cidade: "", medicoExecutor: "", local: "", obs: "",
  });
  const [refForm, setRefForm] = useState({
    medico: "", especialidade: "", possuiCRM: "Não", indicacoesM1: "", indicacoesM2: "", indicacoesM3: "", procedimentosGerados: "", obs: "",
  });
  const [visitaModal, setVisitaModal] = useState(null);
  const [editVisitaModal, setEditVisitaModal] = useState(null); // { evId, refId, vi }
  const [expandedRef, setExpandedRef] = useState(null);
  const [visitaForm, setVisitaForm] = useState({ data: "", tipo: "Visita presencial", indicacoes: "", procedimentos: "", obs: "" });
  const [editEventoModal, setEditEventoModal] = useState(null);
  const [editRefModal, setEditRefModal] = useState(null);
  const eventos = data?.eventos || [];
  const updateEventos = (e) => onChange({ eventos: e });
  const saveEvento = () => {
    updateEventos([...eventos, { ...eventoForm, id: fupUid(), referidores: [] }]);
    setEventoModal(false);
    setEventoForm({ nome: "", dataEvento: "", cidade: "", medicoExecutor: "", local: "", obs: "" });
  };
  const saveReferidor = () => {
    const updated = eventos.map((ev) =>
      ev.id === refModal
        ? { ...ev, referidores: [...(ev.referidores || []), { ...refForm, id: fupUid() }] }
        : ev
    );
    updateEventos(updated);
    setRefModal(null);
    setRefForm({ medico: "", especialidade: "", possuiCRM: "Não", indicacoesM1: "", indicacoesM2: "", indicacoesM3: "", procedimentosGerados: "", obs: "" });
  };
  const saveVisita = () => {
    if (!visitaModal) return;
    const { evId, refId } = visitaModal;
    updateEventos(eventos.map((ev) => ev.id === evId
      ? { ...ev, referidores: (ev.referidores||[]).map((r) => r.id === refId
          ? { ...r, visitas: [...(r.visitas||[]), { ...visitaForm, id: fupUid() }] }
          : r) }
      : ev));
    setVisitaModal(null);
    setVisitaForm({ data: "", tipo: "Visita presencial", indicacoes: "", procedimentos: "", obs: "" });
  };
  const saveEditEvento = (ev) => { updateEventos(eventos.map((e) => e.id === ev.id ? ev : e)); setEditEventoModal(null); };
  const saveEditRef = ({ evId, ref }) => { updateEventos(eventos.map((ev) => ev.id === evId ? { ...ev, referidores: (ev.referidores||[]).map((r) => r.id === ref.id ? ref : r) } : ev)); setEditRefModal(null); };
  const saveEditVisita = ({ evId, refId, vi }) => {
    updateEventos(eventos.map((ev) => ev.id === evId
      ? { ...ev, referidores: (ev.referidores||[]).map((r) => r.id === refId
          ? { ...r, visitas: (r.visitas||[]).map((v, idx) => idx === vi ? { ...v, ...visitaForm } : v) }
          : r) }
      : ev));
    setEditVisitaModal(null);
    setVisitaForm({ data: "", tipo: "Visita presencial", indicacoes: "", procedimentos: "", obs: "" });
  };
  const deleteVisita = ({ evId, refId, vi }) => {
    updateEventos(eventos.map((ev) => ev.id === evId
      ? { ...ev, referidores: (ev.referidores||[]).map((r) => r.id === refId
          ? { ...r, visitas: (r.visitas||[]).filter((_, idx) => idx !== vi) }
          : r) }
      : ev));
  };
  const delEvento = (id) => updateEventos(eventos.filter((e) => e.id !== id));
  const delRef = (evId, refId) => updateEventos(eventos.map((ev) => ev.id === evId ? { ...ev, referidores: (ev.referidores||[]).filter((r) => r.id !== refId) } : ev));
  const totals = {
    eventos: eventos.length,
    referidores: eventos.reduce((a, ev) => a + (ev.referidores||[]).length, 0),
    comCRM: eventos.reduce((a, ev) => a + (ev.referidores||[]).filter((r) => r.possuiCRM === "Sim").length, 0),
    indicacoes: eventos.reduce((a, ev) => (ev.referidores||[]).reduce((b, r) => b + (+r.indicacoesM1||0) + (+r.indicacoesM2||0) + (+r.indicacoesM3||0) + (r.visitas||[]).reduce((c,v)=>c+(+v.indicacoes||0),0), a), 0),
    procedimentos: eventos.reduce((a, ev) => (ev.referidores||[]).reduce((b, r) => b + (+r.procedimentosGerados||0) + (r.visitas||[]).reduce((c,v)=>c+(+v.procedimentos||0),0), a), 0),
  };
  return (
    <div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 28 }}>
        <FupKPICard label="Eventos Realizados" value={totals.eventos} icon="📚" />
        <FupKPICard label="Referidores Treinados" value={totals.referidores} color={FUP_C.blue} />
        <FupKPICard label="Com CRM" value={totals.comCRM} color={FUP_C.teal} />
        <FupKPICard label="Indicações" value={totals.indicacoes} />
        <FupKPICard label="Procedimentos" value={totals.procedimentos} color={FUP_C.green} icon="✓" />
        <FupKPICard label="Receita Est." value={totals.procedimentos > 0 ? fmtReceita(totals.procedimentos * 1680) : "—"} color={FUP_C.teal} icon="💰" />
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {["eventos", "dashboard"].map((t) => (
          <button key={t} onClick={() => setActiveTab(t)} style={{
            padding: "8px 20px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
            background: activeTab === t ? FUP_C.blue : "transparent",
            color: activeTab === t ? "#fff" : FUP_C.textMuted,
            border: `1px solid ${activeTab === t ? FUP_C.blue : FUP_C.border}`,
          }}>{t === "eventos" ? "📋 Eventos" : "📊 Dashboard"}</button>
        ))}
        <FupBtn onClick={() => setEventoModal(true)} style={{ marginLeft: "auto" }}>+ Novo Evento</FupBtn>
      </div>
      {activeTab === "eventos" ? (
        eventos.length === 0 ? (
          <div style={{ textAlign: "center", padding: 48, color: FUP_C.textDim }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>📚</div>
            <div>Nenhum evento cadastrado. Clique em "+ Novo Evento".</div>
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {eventos.map((ev) => (
              <div key={ev.id} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                  <div>
                    <div style={{ color: FUP_C.text, fontWeight: 700, fontSize: 15 }}>{ev.nome || "Evento sem nome"}</div>
                    <div style={{ display: "flex", gap: 16, marginTop: 4, flexWrap: "wrap" }}>
                      {ev.dataEvento && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>📅 {ev.dataEvento}</span>}
                      {ev.cidade && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>📍 {ev.cidade}</span>}
                      {ev.medicoExecutor && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>👨‍⚕️ {ev.medicoExecutor}</span>}
                      <span style={{ color: FUP_C.blue, fontSize: 12 }}>{(ev.referidores||[]).length} referidor(es)</span>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <FupBtn size="sm" onClick={() => setRefModal(ev.id)} style={{ background: FUP_C.blue, border: "none" }}>+ Referidor</FupBtn>
                    <FupBtn size="sm" variant="ghost" onClick={() => setEditEventoModal({ ...ev })}>✏️</FupBtn>
                    <FupBtn size="sm" variant="danger" onClick={() => delEvento(ev.id)}>✕</FupBtn>
                  </div>
                </div>
                {(ev.referidores||[]).length > 0 && (
                  <div style={{ overflowX: "auto" }}>
                    <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                      <thead>
                        <tr style={{ borderBottom: `1px solid ${FUP_C.border}` }}>
                          {["Médico Referidor", "Especialidade", "CRM?", "Ind. M1", "Ind. M2", "Ind. M3", "Proced.", ""].map((h) => (
                            <th key={h} style={{ padding: "8px 10px", textAlign: "left", color: FUP_C.textMuted, fontWeight: 600, fontSize: 11 }}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {(ev.referidores||[]).map((r) => (
                          <tr key={r.id} style={{ borderBottom: `1px solid ${FUP_C.border}` }}>
                            <td style={{ padding: "8px 10px", color: FUP_C.text, fontWeight: 600 }}>{r.medico || "—"}</td>
                            <td style={{ padding: "8px 10px", color: FUP_C.textMuted }}>{r.especialidade || "—"}</td>
                            <td style={{ padding: "8px 10px" }}><FupPill label={r.possuiCRM} color={r.possuiCRM === "Sim" ? "verde" : "vermelho"} /></td>
                            <td style={{ padding: "8px 10px", color: FUP_C.text, textAlign: "center" }}>{+r.indicacoesM1||0}</td>
                            <td style={{ padding: "8px 10px", color: FUP_C.text, textAlign: "center" }}>{(+r.indicacoesM2||0)}</td>
                            <td style={{ padding: "8px 10px", color: FUP_C.text, textAlign: "center" }}>{(+r.indicacoesM3||0)}</td>
                            <td style={{ padding: "8px 10px", color: FUP_C.green, fontWeight: 700, textAlign: "center" }}>{(+r.procedimentosGerados||0) + (r.visitas||[]).reduce((a,v)=>a+(+v.procedimentos||0),0)}</td>
                            <td style={{ padding: "8px 10px" }}>
                              <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                                <button onClick={() => setVisitaModal({ evId: ev.id, refId: r.id })} style={{ background: FUP_C.blue, color: "#fff", border: "none", borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>+ Visita</button>
                                {(r.visitas||[]).length > 0 && <button onClick={() => setExpandedRef(expandedRef === r.id ? null : r.id)} style={{ background: "transparent", color: FUP_C.blue, border: "1px solid " + FUP_C.blue, borderRadius: 6, padding: "4px 8px", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>{expandedRef === r.id ? "▼" : "▶ " + (r.visitas||[]).length}</button>}
                                <button onClick={() => delRef(ev.id, r.id)} style={{ background: "transparent", color: FUP_C.red, border: "1px solid " + FUP_C.red, borderRadius: 6, padding: "4px 8px", fontSize: 11, cursor: "pointer" }}>✕</button>
                              </div>
                              {expandedRef === r.id && (r.visitas||[]).length > 0 && (
                                <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 6 }}>
                                  {(r.visitas||[]).map((v, vi) => (
                                    <div key={v.id||vi} style={{ background: FUP_C.bg, borderRadius: 6, padding: "6px 10px", border: "1px solid " + FUP_C.border, borderLeft: "3px solid " + FUP_C.blue, fontSize: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                                      <div>
                                        <span style={{ color: FUP_C.text, fontWeight: 600 }}>{"V" + (vi+1) + " · " + (v.data||"—") + " · " + (v.tipo||"")}</span>
                                        {v.indicacoes && <span style={{ color: FUP_C.teal, marginLeft: 10 }}>{"Ind: " + v.indicacoes}</span>}
                                        {v.procedimentos && <span style={{ color: FUP_C.green, marginLeft: 10 }}>{"Proced: " + v.procedimentos}</span>}
                                        {v.obs && <span style={{ color: FUP_C.textMuted, marginLeft: 10, fontStyle: "italic" }}>{"💬 " + v.obs}</span>}
                                      </div>
                                      <div style={{ display: "flex", gap: 4, marginLeft: 8 }}>
                                        <button onClick={() => { setVisitaForm({ data: v.data||"", tipo: v.tipo||"Visita presencial", indicacoes: v.indicacoes||"", procedimentos: v.procedimentos||"", obs: v.obs||"" }); setEditVisitaModal({ evId: ev.id, refId: r.id, vi }); }} style={{ background: "none", border: "1px solid " + FUP_C.border, borderRadius: 4, color: FUP_C.textMuted, fontSize: 10, cursor: "pointer", padding: "2px 5px" }}>✏️</button>
                                        <button onClick={() => deleteVisita({ evId: ev.id, refId: r.id, vi })} style={{ background: "none", border: "1px solid " + FUP_C.red, borderRadius: 4, color: FUP_C.red, fontSize: 10, cursor: "pointer", padding: "2px 5px" }}>✕</button>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            ))}
          </div>
        )
      ) : (
        <div style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
          <FupSectionTitle accent={FUP_C.blue}>📋 KPIs e SLAs — Aulas Referidores</FupSectionTitle>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
            {[
              { kpi: "Indicações por Referidor/mês", meta: "≥ 2", freq: "Mensal", alerta: "< 1 = visita de reativação" },
              { kpi: "CRM Estruturado", meta: "100% dos treinados", freq: "30d pós-aula", alerta: "Sem CRM = baixa rastreabilidade" },
              { kpi: "Devolutiva ao Referidor", meta: "≤ 7 dias após consulta", freq: "Por paciente", alerta: "Sem devolutiva = desmotiva indicação" },
              { kpi: "Taxa Conv. Indicação→Proced.", meta: "≥ 30%", freq: "Trimestral", alerta: "< 20% = revisar perfil indicado" },
              { kpi: "Visita de follow-up", meta: "Mensal (M1, M2, M3)", freq: "Mensal", alerta: "Sem visita = engagement cai 60%" },
              { kpi: "NPS do Referidor", meta: "≥ 8", freq: "Trimestral", alerta: "< 7 = risco de perder canal" },
            ].map((s, i) => (
              <div key={i} style={{ background: FUP_C.bg, borderRadius: 8, padding: 14, border: `1px solid ${FUP_C.border}` }}>
                <div style={{ color: FUP_C.blue, fontSize: 12, fontWeight: 700, marginBottom: 6 }}>{s.kpi}</div>
                <div style={{ color: FUP_C.text, fontSize: 13, fontWeight: 600 }}>Meta: {s.meta}</div>
                <div style={{ color: FUP_C.textMuted, fontSize: 11, marginTop: 4 }}>Freq: {s.freq}</div>
                <div style={{ color: FUP_C.red, fontSize: 11, marginTop: 4 }}>⚠ {s.alerta}</div>
              </div>
            ))}
          </div>
        </div>
      )}
      {/* Modal Novo Evento */}
      <FupModal open={eventoModal} onClose={() => setEventoModal(false)} title="Cadastrar Evento — Aula Referidores">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Nome do Evento" value={eventoForm.nome} onChange={(v) => setEventoForm({ ...eventoForm, nome: v })} required style={{ gridColumn: "span 2" }} />
          <FupInput label="Data do Evento" type="date" value={eventoForm.dataEvento} onChange={(v) => setEventoForm({ ...eventoForm, dataEvento: v })} />
          <FupInput label="Cidade" value={eventoForm.cidade} onChange={(v) => setEventoForm({ ...eventoForm, cidade: v })} />
          <FupInput label="Médico Executor (ministra a aula)" value={eventoForm.medicoExecutor} onChange={(v) => setEventoForm({ ...eventoForm, medicoExecutor: v })} style={{ gridColumn: "span 2" }} />
          <FupInput label="Local" value={eventoForm.local} onChange={(v) => setEventoForm({ ...eventoForm, local: v })} />
          <FupInput label="Observações" value={eventoForm.obs} onChange={(v) => setEventoForm({ ...eventoForm, obs: v })} />
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
          <FupBtn variant="ghost" onClick={() => setEventoModal(false)}>Cancelar</FupBtn>
          <FupBtn onClick={saveEvento}>Salvar Evento</FupBtn>
        </div>
      </FupModal>
      {/* Modal Editar Evento — Aulas Referidores */}
      <FupModal open={!!editEventoModal} onClose={() => setEditEventoModal(null)} title="Editar Evento">
        {editEventoModal && (
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            <FupInput label="Nome do Evento" value={editEventoModal.nome} onChange={(v) => setEditEventoModal({ ...editEventoModal, nome: v })} style={{ gridColumn: "span 2" }} />
            <FupInput label="Data" type="date" value={editEventoModal.dataEvento} onChange={(v) => setEditEventoModal({ ...editEventoModal, dataEvento: v })} />
            <FupInput label="Cidade" value={editEventoModal.cidade} onChange={(v) => setEditEventoModal({ ...editEventoModal, cidade: v })} />
            <FupInput label="Médico Executor" value={editEventoModal.medicoExecutor} onChange={(v) => setEditEventoModal({ ...editEventoModal, medicoExecutor: v })} style={{ gridColumn: "span 2" }} />
            <FupInput label="Local" value={editEventoModal.local} onChange={(v) => setEditEventoModal({ ...editEventoModal, local: v })} />
            <FupInput label="Obs" value={editEventoModal.obs} onChange={(v) => setEditEventoModal({ ...editEventoModal, obs: v })} />
            <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end", gap: 12 }}>
              <FupBtn variant="ghost" onClick={() => setEditEventoModal(null)}>Cancelar</FupBtn>
              <FupBtn onClick={() => saveEditEvento(editEventoModal)} style={{ background: FUP_C.blue, border: "none" }}>Salvar Alterações</FupBtn>
            </div>
          </div>
        )}
      </FupModal>
      {/* Modal Editar Referidor */}
      <FupModal open={!!editRefModal} onClose={() => setEditRefModal(null)} title="Editar Referidor">
        {editRefModal && (<div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Nome" value={editRefModal.ref.medico} onChange={(v) => setEditRefModal({ ...editRefModal, ref: { ...editRefModal.ref, medico: v } })} />
          <FupInput label="Especialidade" value={editRefModal.ref.especialidade} onChange={(v) => setEditRefModal({ ...editRefModal, ref: { ...editRefModal.ref, especialidade: v } })} />
          <FupSelect label="CRM?" value={editRefModal.ref.possuiCRM} onChange={(v) => setEditRefModal({ ...editRefModal, ref: { ...editRefModal.ref, possuiCRM: v } })} options={[{value:"Sim",label:"Sim"},{value:"Não",label:"Não"}]} />
          <FupInput label="Ind. M1" type="number" value={editRefModal.ref.indicacoesM1} onChange={(v) => setEditRefModal({ ...editRefModal, ref: { ...editRefModal.ref, indicacoesM1: v } })} />
          <FupInput label="Ind. M2" type="number" value={editRefModal.ref.indicacoesM2} onChange={(v) => setEditRefModal({ ...editRefModal, ref: { ...editRefModal.ref, indicacoesM2: v } })} />
          <FupInput label="Procedimentos" type="number" value={editRefModal.ref.procedimentosGerados} onChange={(v) => setEditRefModal({ ...editRefModal, ref: { ...editRefModal.ref, procedimentosGerados: v } })} />
          <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end", gap: 12 }}>
            <FupBtn variant="ghost" onClick={() => setEditRefModal(null)}>Cancelar</FupBtn>
            <FupBtn onClick={() => saveEditRef(editRefModal)} style={{ background: FUP_C.blue, border: "none" }}>Salvar</FupBtn>
          </div>
        </div>)}
      </FupModal>
      {/* Modal Editar Visita Referidor */}
      <FupModal open={!!editVisitaModal} onClose={() => setEditVisitaModal(null)} title="Editar Visita">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data" type="date" value={visitaForm.data} onChange={(v) => setVisitaForm({ ...visitaForm, data: v })} />
          <FupSelect label="Tipo" value={visitaForm.tipo} onChange={(v) => setVisitaForm({ ...visitaForm, tipo: v })} options={["Visita presencial","Call","WhatsApp","E-mail"].map((s) => ({ value: s, label: s }))} />
          <FupInput label="Indicações geradas" type="number" value={visitaForm.indicacoes} onChange={(v) => setVisitaForm({ ...visitaForm, indicacoes: v })} />
          <FupInput label="Procedimentos gerados" type="number" value={visitaForm.procedimentos} onChange={(v) => setVisitaForm({ ...visitaForm, procedimentos: v })} />
          <div style={{ gridColumn: "span 2" }}><FupInput label="Obs" value={visitaForm.obs} onChange={(v) => setVisitaForm({ ...visitaForm, obs: v })} /></div>
          <div style={{ gridColumn: "span 2", display: "flex", justifyContent: "flex-end", gap: 12 }}>
            <FupBtn variant="ghost" onClick={() => setEditVisitaModal(null)}>Cancelar</FupBtn>
            <FupBtn onClick={() => saveEditVisita(editVisitaModal)} style={{ background: FUP_C.blue, border: "none" }}>Salvar Alterações</FupBtn>
          </div>
        </div>
      </FupModal>
      {/* Modal Nova Visita */}
      <FupModal open={!!visitaModal} onClose={() => setVisitaModal(null)} title="Nova Visita ao Referidor">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data" type="date" value={visitaForm.data} onChange={(v) => setVisitaForm({ ...visitaForm, data: v })} />
          <FupSelect label="Tipo" value={visitaForm.tipo} onChange={(v) => setVisitaForm({ ...visitaForm, tipo: v })} options={["Visita presencial","Call","WhatsApp","E-mail"].map((s) => ({ value: s, label: s }))} />
          <FupInput label="Indicações geradas" type="number" value={visitaForm.indicacoes} onChange={(v) => setVisitaForm({ ...visitaForm, indicacoes: v })} />
          <FupInput label="Procedimentos gerados" type="number" value={visitaForm.procedimentos} onChange={(v) => setVisitaForm({ ...visitaForm, procedimentos: v })} />
          <div style={{ gridColumn: "span 2" }}><FupInput label="Observações" value={visitaForm.obs} onChange={(v) => setVisitaForm({ ...visitaForm, obs: v })} /></div>

      <FupModal open={!!fupModal} onClose={() => setFupModal(null)} title={`Registrar Follow-up — ${medicos.find((m) => m.id === fupModal)?.nome?.split(" ")[0] || ""}`}>

          <FupSelect label="Possui CRM?" value={fupForm.possuiCRM} onChange={(v) => setFupForm({ ...fupForm, possuiCRM: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Parcial", label: "Parcial" }, { value: "Não", label: "Não" }]} />
          <FupInput label="Contatos disparados pelo CRM" type="number" value={fupForm.qtdContatosEnviados} onChange={(v) => setFupForm({ ...fupForm, qtdContatosEnviados: v })} />
          <FupInput label="Respostas recebidas" type="number" value={fupForm.respostas} onChange={(v) => setFupForm({ ...fupForm, respostas: v })} />
          <FupInput label="Avaliações ESG agendadas" type="number" value={fupForm.avaliacoes} onChange={(v) => setFupForm({ ...fupForm, avaliacoes: v })} />
          <FupInput label="Procedimentos ESG realizados" type="number" value={fupForm.procedimentos} onChange={(v) => setFupForm({ ...fupForm, procedimentos: v })} />
          <FupInput label="Score Implementação (0–10)" type="number" value={fupForm.scoreImpl} onChange={(v) => setFupForm({ ...fupForm, scoreImpl: v })} />
          <FupSelect label="Risco (Semáforo)" value={fupForm.risco} onChange={(v) => setFupForm({ ...fupForm, risco: v })} options={["Verde", "Amarelo", "Vermelho"].map((s) => ({ value: s, label: s }))} />
          <div style={{ gridColumn: "span 2" }}>
            <FupInput label="Observações / Próxima Ação" value={fupForm.obs} onChange={(v) => setFupForm({ ...fupForm, obs: v })} />
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
          <FupBtn variant="ghost" onClick={() => setFupModal(null)}>Cancelar</FupBtn>
          <FupBtn onClick={saveFUP} style={{ background: FUP_C.orange }}>Registrar FUP</FupBtn>
        </div>
      </FupModal>
    </div>
  );
}

// CURSO ENDOSCOPISTAS

function CursoEndoscopistasProject({ data, onChange }) {
  const [fupModal, setFupModal] = useState(null);
  const [editModal, setEditModal] = useState(false);
  const [expandedEndo, setExpandedEndo] = useState(null);
  const [editMedico, setEditMedico] = useState(null);
  const [activeTab, setActiveTab] = useState("medicos");
  const [fupForm, setFupForm] = useState({
    data: "", tipo: "Visita presencial", realizandoProcedimentos: "Sim",
    procedimentos30d: "", avaliacoesAgendadas: "", possuiCRM: "Não",
    scoreImpl: "", risco: "Verde", obs: "",
  });
  const medicos = data?.medicos || fupInitialState.cursoEndoscopistas.medicos;
  const followups = data?.followups || [];
  const update = (m) => onChange({ medicos: m, followups });
  const updateFUPs = (f) => onChange({ medicos, followups: f });
  const totals = {
    totalProced: followups.reduce((a, f) => a + (+f.procedimentos30d || 0), 0),
    totalAval: followups.reduce((a, f) => a + (+f.avaliacoesAgendadas || 0), 0),
    comCRM: medicos.filter((m) => m.possuiCRM === "Sim").length,
  };
  const saveFUP = () => {
    updateFUPs([...followups, { ...fupForm, medicoId: fupModal, id: fupUid() }]);
    setFupModal(null);
    setFupForm({ data: "", tipo: "Visita presencial", realizandoProcedimentos: "Sim", procedimentos30d: "", avaliacoesAgendadas: "", possuiCRM: "Não", scoreImpl: "", risco: "Verde", obs: "" });
  };
  return (
    <div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 28 }}>
        <FupKPICard label="Endoscopistas" value={medicos.length} icon="🔬" />
        <FupKPICard label="Procedimentos Total" value={totals.totalProced} color={FUP_C.green} icon="✓" />
        <FupKPICard label="Avaliações Geradas" value={totals.totalAval} color={FUP_C.teal} />

      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {["medicos", "dashboard"].map((t) => (
          <button key={t} onClick={() => setActiveTab(t)} style={{
            padding: "8px 20px", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer",
            background: activeTab === t ? FUP_C.green : "transparent",
            color: activeTab === t ? "#fff" : FUP_C.textMuted,
            border: `1px solid ${activeTab === t ? FUP_C.green : FUP_C.border}`,
          }}>{t === "medicos" ? "👨‍⚕️ Médicos" : "📊 Dashboard"}</button>
        ))}
      </div>
      {activeTab === "medicos" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {medicos.map((m, idx) => {
            const fups = followups.filter((f) => f.medicoId === m.id);
            const lastFup = fups[fups.length - 1];
            return (
              <div key={m.id} style={{ background: FUP_C.card, border: `1px solid ${FUP_C.border}`, borderRadius: 12, padding: 20 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ color: FUP_C.text, fontWeight: 700, fontSize: 15, marginBottom: 4 }}>
                      {m.nome || `Endoscopista ${idx + 1}`}

                    <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                      {m.email && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>📧 {m.email}</span>}
                      {m.cidade && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>📍 {m.cidade}</span>}
                      <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>
                        Procedimentos: <b style={{ color: FUP_C.green }}>{fups.reduce((a, f) => a + (+f.procedimentos30d || 0), 0)}</b>
                      </span>
                      <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>

                              {f.scoreImpl && <span style={{ color: FUP_C.textMuted, fontSize: 12 }}>Score: <b style={{ color: +f.scoreImpl >= 7 ? FUP_C.green : FUP_C.yellow }}>{f.scoreImpl}/10</b></span>}
                            </div>
                            <FupObsExpandable obs={f.obs} style={{ fontSize: 12, marginTop: 6 }} />
                          </div>
                        ))}
                      </div>

                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <FupBtn size="sm" variant="ghost" onClick={() => { setEditMedico({ ...m, _idx: idx }); setEditModal(true); }}>✏️ Editar</FupBtn>
                    <FupBtn size="sm" onClick={() => setFupModal(m.id)} style={{ background: FUP_C.green, border: "none" }}>+ FUP</FupBtn>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

                <div style={{ color: FUP_C.red, fontSize: 11, marginTop: 4 }}>⚠ {s.alerta}</div>
              </div>
            ))}
          </div>
        </div>
      )}
      <FupModal open={!!fupModal} onClose={() => setFupModal(null)} title="Registrar Follow-up — Endoscopista">
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <FupInput label="Data" type="date" value={fupForm.data} onChange={(v) => setFupForm({ ...fupForm, data: v })} />
          <FupSelect label="Tipo" value={fupForm.tipo} onChange={(v) => setFupForm({ ...fupForm, tipo: v })} options={["Visita presencial", "Call", "WhatsApp"].map((s) => ({ value: s, label: s }))} />
          <FupSelect label="Realizando procedimentos?" value={fupForm.realizandoProcedimentos} onChange={(v) => setFupForm({ ...fupForm, realizandoProcedimentos: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Não", label: "Não" }]} />
          <FupSelect label="Possui CRM?" value={fupForm.possuiCRM} onChange={(v) => setFupForm({ ...fupForm, possuiCRM: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Não", label: "Não" }]} />
          <FupInput label="Procedimentos ESG (30d)" type="number" value={fupForm.procedimentos30d} onChange={(v) => setFupForm({ ...fupForm, procedimentos30d: v })} />

          <FupSelect label="Risco" value={fupForm.risco} onChange={(v) => setFupForm({ ...fupForm, risco: v })} options={["Verde", "Amarelo", "Vermelho"].map((s) => ({ value: s, label: s }))} />

              <FupInput label="Email" value={editMedico.email} onChange={(v) => setEditMedico({ ...editMedico, email: v })} />

              <FupSelect label="Possui CRM?" value={editMedico.possuiCRM || "Não"} onChange={(v) => setEditMedico({ ...editMedico, possuiCRM: v })} options={[{ value: "Sim", label: "Sim" }, { value: "Não", label: "Não" }]} />
            </div>
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 12, marginTop: 24 }}>
              <FupBtn variant="ghost" onClick={() => setEditModal(false)}>Cancelar</FupBtn>
              <FupBtn onClick={() => {
                const updated = [...medicos];
                updated[editMedico._idx] = { ...editMedico };
                update(updated);
                setEditModal(false);
              }} style={{ background: FUP_C.green }}>Salvar</FupBtn>
            </div>
          </>
        )}
      </FupModal>
    </div>
  );
}

// IMERSÃO MARKETING
// ════════════════════════════════════════════════════════════════════════════
function ImersaoMarketingProject({ data, onChange }) {
  const [modal, setModal] = useState(false);
  const [fupModal, setFupModal] = useState(null);
  const [expandedImersao, setExpandedImersao] = useState(null);
  const [activeTab, setActiveTab] = useState("medicos");
  const [form, setForm] = useState({ nome: "", especialidade: "", cidade: "", email: "", instagram: "", site: "" });
  const [fupForm, setFupForm] = useState({
    data: "", tipo: "Visita", instagramAtivo: "Sim", seguidores: "", postsMes: "",
    geoScore: "", llmVisivelChatGPT: "Não", llmVisivelGoogle: "Não",
    leadsOrganicos: "", procedimentosGerados: "", acoesConcluidas: "", obs: "",
  });
  const medicos = data?.medicos || [];
  const acoes = data?.acoes || [];
  const updateM = (m) => onChange({ medicos: m, acoes });
  const updateA = (a) => onChange({ medicos, acoes: a });
  const totals = {
    medicos: medicos.length,
    comSite: medicos.filter((m) => m.site).length,
    comInsta: medicos.filter((m) => m.instagram).length,
    leadsGerados: acoes.reduce((a, f) => a + (+f.leadsOrganicos || 0), 0),
    procedimentos: acoes.reduce((a, f) => a + (+f.procedimentosGerados || 0), 0),
    mediaGEO: acoes.length > 0 ? (acoes.reduce((a, f) => a + (+f.geoScore || 0), 0) / acoes.length).toFixed(1) : 0,
  };
  const saveMedico = () => {
    updateM([...medicos, { ...form, id: fupUid() }]);
    setModal(false);
    setForm({ nome: "", especialidade: "", cidade: "", email: "", instagram: "", site: "" });
  };
  const saveFUP = () => {
    updateA([...acoes, { ...fupForm, medicoId: fupModal, id: fupUid() }]);
    setFupModal(null);
    setFupForm({ data: "", tipo: "Visita", instagramAtivo: "Sim", seguidores: "", postsMes: "", geoScore: "", llmVisivelChatGPT: "Não", llmVisivelGoogle: "Não", leadsOrganicos: "", procedimentosGerados: "", acoesConcluidas: "", obs: "" });
  };
  const geoData = medicos.map((m) => {

function FupProjetos() {
  const [activeProject, setActiveProject] = useState(null);
  const [state, setState] = useState(() => fupLoadData());
  const [toast, setToast] = useState(null);
  const [saveTimer, setSaveTimer] = useState(null);
  const [syncing, setSyncing] = useState(true);
  // Load from Supabase on mount
  useEffect(() => {
    fupLoadRemote().then((remote) => {
      if (remote && Object.keys(remote).length > 0) {
        var merged = Object.assign({}, fupInitialState, remote);
        merged.congressoMetabolica = Object.assign({}, fupInitialState.congressoMetabolica, remote.congressoMetabolica || {});
        setState(merged);
        fupSaveData(merged);
      }
      setSyncing(false);
    });
  }, []);

  // ─── SYNC: visitas da aba Visitas → FUP Projetos ──────────────────────────

  // Matching semântico robusto: ignora acentos, Dr/Dra, títulos, espaços duplos
  const fupNorm = (s) => (s||"")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")  // remove acentos
    .replace(/\b(dr|dra|prof|profa|doutor|doutora)\.?\s*/g, "")  // remove títulos
    .replace(/[^a-z0-9 ]/g, "")
    .replace(/\s+/g, " ")
    .trim();

  // Match semântico: 1 token se qualquer lado tem só 1 token; 2 tokens se ambos têm 2+
  const fupMatch = (a, b) => {
    const ta = fupNorm(a).split(" ").filter(t => t.length >= 3);
    const tb = fupNorm(b).split(" ").filter(t => t.length >= 3);
    if (!ta.length || !tb.length) return false;
    const hits = ta.filter(t => tb.some(u => u.startsWith(t) || t.startsWith(u)));
    const needed = Math.min(ta.length, tb.length) >= 2 ? 2 : 1;
    return hits.length >= needed;
  };

  // Converte visita do Supabase → entry padrão do FUP
  const visitaToFupEntry = (v) => ({
    id: "sync_" + v.id,
    data: v.data_contato || new Date().toISOString().slice(0,10),
    tipo: v.canal || "Visita presencial",
    obs: "[Visitas] " + (v.obs || "—") + (v.responsavel ? " · " + v.responsavel : ""),
    procedimentosGerados: Number(v.proc_realizados_esg) || 0,
    syncedFromVisitas: true,
    visitaId: v.id,
  });

  // Aplica lista de visitas do Supabase sobre um estado FUP (sem duplicar por visitaId)
  const applyVisitasToState = (prev, todasVisitas) => {
    const next = JSON.parse(JSON.stringify(prev)); // deep clone

    todasVisitas.forEach(v => {
      if (!v.medico_nome) return;
      const entry = visitaToFupEntry(v);
      const jaExiste = (arr) => (arr||[]).some(f => f.visitaId === entry.visitaId);

      // ESG Day — compara medico E clinica (pode estar cadastrado por qualquer um)
      if (next.esgDay) {
        next.esgDay = next.esgDay.map(ev =>
          (fupMatch(ev.medico, v.medico_nome) || fupMatch(ev.clinica, v.medico_nome)) && !jaExiste(ev.followups)
            ? { ...ev, followups: [...(ev.followups||[]), entry] }
            : ev
        );
      }

      // Aulas Referidores
      if (next.aulasReferidores?.eventos) {
        next.aulasReferidores.eventos = next.aulasReferidores.eventos.map(ev => ({
          ...ev,
          referidores: (ev.referidores||[]).map(r =>
            fupMatch(r.medico, v.medico_nome) && !jaExiste(r.visitas)
              ? { ...r, visitas: [...(r.visitas||[]), entry] }
              : r
          )
        }));
      }

      // Curso Bariátricos
      if (next.cursoBariatricos?.medicos) {
        const med = next.cursoBariatricos.medicos.find(m => fupMatch(m.nome, v.medico_nome));
        if (med && !jaExiste(next.cursoBariatricos.followups?.filter(f => f.medicoId === med.id))) {
          next.cursoBariatricos.followups = [
            ...(next.cursoBariatricos.followups||[]),
            { ...entry, medicoId: med.id, medicoNome: med.nome }
          ];
        }
      }

      // Curso Endoscopistas
      if (next.cursoEndoscopistas?.medicos) {
        const med = next.cursoEndoscopistas.medicos.find(m => fupMatch(m.nome, v.medico_nome));
        if (med && !jaExiste(next.cursoEndoscopistas.followups?.filter(f => f.medicoId === med.id))) {
          next.cursoEndoscopistas.followups = [
            ...(next.cursoEndoscopistas.followups||[]),
            { ...entry, medicoId: med.id, medicoNome: med.nome }
          ];
        }
      }

      // Congresso Metabólica Pantanal
      if (next.congressoMetabolica && next.congressoMetabolica.contatos) {
        var contatoMatch = next.congressoMetabolica.contatos.find(function(c) { return fupMatch(c.nome, v.medico_nome); });
        if (contatoMatch) {
          var jaExisteSync = (contatoMatch.followups || []).some(function(f) { return f.visitaId === entry.visitaId; });
          if (!jaExisteSync) {
            next.congressoMetabolica.contatos = next.congressoMetabolica.contatos.map(function(c) {
              if (c.id !== contatoMatch.id) return c;
              return Object.assign({}, c, { followups: (c.followups || []).concat([entry]) });

      if (next.imersaoMarketing?.medicos) {

            ...(next.imersaoMarketing.acoes||[]),
            { ...entry, medicoId: med.id, medicoNome: med.nome }
          ];
        }
      }
    });

    return next;
  };

  // 1. CARGA INICIAL — puxa TODAS as visitas históricas ao montar

      conv: (() => {
        const comp = state.esgDay?.reduce((a, r) => a + (+r.compareceram || 0), 0) || 0;
        const proc = state.esgDay?.reduce((a, r) => a + (+r.procedimentos30d||0) + (r.followups||[]).filter(f=>!f.syncedFromVisitas).reduce((s,f)=>s+(+f.procedimentosFechados||0),0), 0) || 0;
        const pct = comp > 0 ? ((proc / comp) * 100) : 0;

// ─── LOGIN ─────────────────────────────────────────────────────────────────
function useAuth() {
  const [authed, setAuthed] = React.useState(() => {
    return sessionStorage.getItem('esg_hub_auth') === 'true';
  });
  const login = (token) => {
    sessionStorage.setItem('esg_hub_auth', 'true');
    sessionStorage.setItem('esg_hub_token', token);
    setAuthed(true);
  };
  const logout = () => {
    sessionStorage.removeItem('esg_hub_auth');
    sessionStorage.removeItem('esg_hub_token');
    setAuthed(false);
  };
  return { authed, login, logout };
}
function LoginScreen({ onLogin }) {
  const [username, setUsername] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [erro, setErro] = React.useState('');
  const handleLogin = async () => {
    if (!username || !password) return;
    setLoading(true);
    setErro('');
    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        onLogin(data.token);
      } else {
        setErro(data.error || 'Usuário ou senha incorretos.');
        setPassword('');
      }
    } catch (e) {
      setErro('Erro de conexão. Tente novamente.');
    } finally {
      setLoading(false);
    }
  };
  const inputStyle = {
    width: '100%', background: '#1a2235', border: '1px solid #1e2d45',
    borderRadius: 8, color: '#e2e8f0', fontSize: 14, padding: '12px 16px',
    outline: 'none', boxSizing: 'border-box',
    fontFamily: "'DM Sans', sans-serif", transition: 'border-color 0.15s',
  };
  return (
    <div style={{
      minHeight: '100vh', background: '#0a0e1a',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: "'DM Sans', sans-serif", padding: '20px',
    }}>
      <div style={{
        background: '#111827', border: '1px solid #1e2d45',
        borderRadius: 16, padding: '48px 40px', width: '100%', maxWidth: 400,
        boxShadow: '0 24px 64px rgba(0,0,0,0.5)',
      }}>
        {/* Logo */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 40, justifyContent: 'center' }}>
          <div style={{
            width: 44, height: 44, borderRadius: 10,
            background: 'linear-gradient(135deg, #00bfa5, #d4af37)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 20, fontWeight: 800, color: '#0a0e1a',
          }}>E</div>
          <div>
            <div style={{ color: '#e2e8f0', fontSize: 17, fontWeight: 700, letterSpacing: '-0.02em' }}>ESG Intelligence Hub</div>
            <div style={{ color: '#64748b', fontSize: 12, fontFamily: 'DM Mono, monospace' }}>Área restrita</div>
          </div>
        </div>
        {/* Campo usuário */}
        <div style={{ marginBottom: 14 }}>
          <label style={{ color: '#64748b', fontSize: 12, fontWeight: 600, display: 'block', marginBottom: 8 }}>USUÁRIO</label>
          <input
            type="text"
            value={username}
            onChange={e => setUsername(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleLogin()}
            placeholder="Seu usuário"
            autoFocus
            autoCapitalize="none"
            autoCorrect="off"
            style={inputStyle}
            onFocus={e => e.target.style.borderColor = '#00bfa5'}
            onBlur={e => e.target.style.borderColor = '#1e2d45'}
          />
        </div>
        {/* Campo senha */}
        <div style={{ marginBottom: 20 }}>
          <label style={{ color: '#64748b', fontSize: 12, fontWeight: 600, display: 'block', marginBottom: 8 }}>SENHA</label>
          <input
            type="password"
            value={password}
            onChange={e => setPassword(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && handleLogin()}
            placeholder="Sua senha"
            style={inputStyle}
            onFocus={e => e.target.style.borderColor = '#00bfa5'}
            onBlur={e => e.target.style.borderColor = '#1e2d45'}
          />
        </div>
        {/* Erro */}
        {erro && (
          <div style={{
            background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.3)',
            borderRadius: 8, padding: '10px 14px', marginBottom: 16,
            color: '#ef4444', fontSize: 13,
          }}>{erro}</div>
        )}
        {/* Botão */}
        <button
          onClick={handleLogin}
          disabled={loading || !username || !password}
          style={{
            width: '100%', padding: '13px', borderRadius: 8, border: 'none',
            background: (loading || !username || !password) ? '#1a2235' : 'linear-gradient(135deg, #00bfa5, #00897b)',
            color: (loading || !username || !password) ? '#64748b' : '#0a0e1a',
            fontSize: 14, fontWeight: 700,
            cursor: (loading || !username || !password) ? 'not-allowed' : 'pointer',
            fontFamily: "'DM Sans', sans-serif", transition: 'all 0.15s',
          }}
        >
          {loading ? 'Verificando...' : 'Entrar'}
        </button>
      </div>
    </div>
  );
}
