// ─── UTILS ─────────────────────────────────────────────────────────────────
const initials = (name) => name ? name.split(" ").slice(0,2).map(w => w[0]).join("").toUpperCase() : "?";
const isConfigured = true;

function probBadge(prob) {
  const map = { Alto: "badge-alto", Médio: "badge-medio", Baixo: "badge-baixo", "Sem previsão": "badge-sem" };
  return React.createElement('span', {className: `badge ${map[prob] || "badge-sem"}`}, prob || "—");
}

function Toast({ msg, onHide }) {
  useEffect(() => { const t = setTimeout(onHide, 2800); return () => clearTimeout(t); }, []);
  return <div className="toast">✓ {msg}</div>;
}

// ─── HOOK ──────────────────────────────────────────────────────────────────
function useSupabase(table, deps = []) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const fetch = useCallback(async () => {
    setLoading(true);
    const { data: rows } = await supabaseClient.from(table).select("*");
    setData(rows || []);
    setLoading(false);
  }, deps);
  useEffect(() => { fetch(); }, [fetch]);
  return { data, loading, refresh: fetch };
}

// ─── DASHBOARD ─────────────────────────────────────────────────────────────
function Dashboard() {
  const { data: visitas, loading } = useSupabase("visitas");
  const { data: medicos } = useSupabase("perfil_medico");
  const { data: medicoTps } = useSupabase("medico_tps");

  const totalVisitas = visitas.length;
  const presenciais = visitas.filter(v => v.canal === "Presencial").length;
  const altoProb = visitas.filter(v => v.probabilidade === "Alto").length;
  const suporteMkt = visitas.filter(v => v.suporte_marketing).length;
  const tpsConcluidos = medicoTps.filter(t => t.concluido).length;
  const byCanal = CANAIS.reduce((acc, c) => { acc[c] = visitas.filter(v => v.canal === c).length; return acc; }, {});
  const byResponsavel = {};
  visitas.forEach(v => { if (v.responsavel && !v.responsavel.startsWith("──")) byResponsavel[v.responsavel] = (byResponsavel[v.responsavel] || 0) + 1; });
  const byTier = ["ST",1,2,3,4,5].map(t => ({
    tier: t,
    total: medicos.filter(m => m.tier === t).length,
    visitados: visitas.filter(v => { const m = medicos.find(md => md.nome === v.medico_nome); return m?.tier === t; }).length
  }));

  return (
    <div>
      <div className="section-header">
        <div><div className="section-title">Dashboard</div><div className="section-sub">Visão em tempo real · atualiza com cada registro</div></div>
      </div>
      {loading ? <div className="loading"><div className="spinner" /> Carregando...</div> : (<>
        <div className="kpi-row">
          <div className="kpi"><div className="kpi-label">Total Visitas</div><div className="kpi-value">{totalVisitas}</div><div className="kpi-sub">{presenciais} presenciais</div></div>
          <div className="kpi"><div className="kpi-label">Alta Prob.</div><div className="kpi-value" style={{color:"#10b981"}}>{altoProb}</div><div className="kpi-sub">médicos quentes</div></div>
          <div className="kpi"><div className="kpi-label">Suporte MKT</div><div className="kpi-value" style={{color:"#f59e0b"}}>{suporteMkt}</div><div className="kpi-sub">solicitações ativas</div></div>
          <div className="kpi"><div className="kpi-label">TPs Concluídos</div><div className="kpi-value" style={{color:"#8b5cf6"}}>{tpsConcluidos}</div><div className="kpi-sub">de {medicoTps.length} registrados</div></div>
          <div className="kpi"><div className="kpi-label">Médicos Base</div><div className="kpi-value">{medicos.length}</div><div className="kpi-sub">na carteira</div></div>
        </div>
        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px"}}>
          <div className="card">
            <div className="card-title">Visitas por Canal</div>
            {Object.entries(byCanal).map(([canal, count]) => (
              <div key={canal} style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span>{canal}</span><span style={{fontFamily:"DM Mono",color:"var(--teal)"}}>{count}</span></div>
                <div className="progress-wrap"><div className="progress-bar" style={{width: totalVisitas ? `${(count/totalVisitas)*100}%` : "0%", background:"var(--teal)"}} /></div>
              </div>
            ))}
          </div>
          <div className="card">
            <div className="card-title">Cobertura por Tier</div>
            {byTier.map(({tier, total, visitados}) => (
              <div key={tier} className="tier-row">
                <span className="badge badge-tier" style={{minWidth:32,justifyContent:"center"}}>T{tier}</span>
                <span className="tier-name" style={{fontSize:12,color:"var(--muted)"}}>Tier {tier}</span>

                <span className="tier-count">{visitados}/{total}</span>

          <div className="card-title">Visitas por Responsável</div>

              </div>
            ))}

function Visitas() {
  const { data: visitas, loading, refresh } = useSupabase("visitas");
  const { data: medicos } = useSupabase("perfil_medico");
  const [showForm, setShowForm] = useState(false);
  const [search, setSearch] = useState("");
  const [filterResp, setFilterResp] = useState("");
  const [toast, setToast] = useState(null);
  const [selectedVisita, setSelectedVisita] = useState(null);

  const sorted = [...visitas].sort((a,b) => new Date(b.data_contato) - new Date(a.data_contato)).filter(v => {
    const q = search.toLowerCase();
    return (!q || v.medico_nome?.toLowerCase().includes(q) || v.obs?.toLowerCase().includes(q)) && (!filterResp || v.responsavel === filterResp);
  });

  const handleSave = async (form) => {
    const payload = {
      data_contato: form.data_contato||null, responsavel: form.responsavel||null, medico_nome: form.medico_nome||null,
      referidor: form.referidor==="Sim", especialidade: form.especialidade||null, canal: form.canal||null,
      ultimo_tp: form.ultimo_tp||null, acao_prevista: form.acao_prevista||null, probabilidade: form.probabilidade||null,
      valor_esperado: form.valor_esperado ? Number(form.valor_esperado) : null,
      suporte_marketing: form.suporte_marketing==="Sim", acao_mkt: form.acao_mkt||null, obs: form.obs||null,
      mes: form.mes||"JUNHO 26", fios_esg_estoque: form.fios_esg_estoque ? Number(form.fios_esg_estoque) : null,
      proc_marcados_esg: form.proc_marcados_esg ? Number(form.proc_marcados_esg) : null,
      baloes_estoque: form.baloes_estoque ? Number(form.baloes_estoque) : null,
      proc_marcados_balao: form.proc_marcados_balao ? Number(form.proc_marcados_balao) : null,
    };
    const { error } = await supabaseClient.from("visitas").insert([payload]);
    if (error) { alert("Erro ao salvar: " + error.message); return; }
    setToast("Visita registrada!"); setShowForm(false); refresh();
  };

  const handleDelete = async (id) => {
    const { error } = await supabaseClient.from("visitas").delete().eq("id", id);
    if (error) { alert("Erro ao excluir: " + error.message); return; }
    setToast("Visita excluída!"); setSelectedVisita(null); refresh();
  };

  return (
    <div>
      <div className="section-header">
        <div><div className="section-title">Registro de Visitas</div><div className="section-sub">{visitas.length} visitas · clique na linha para ver detalhes</div></div>
        <button className="btn btn-primary" onClick={() => setShowForm(true)}>+ Nova Visita</button>
      </div>
      <div className="search-row">
        <input className="search-input" placeholder="Buscar médico ou observação..." value={search} onChange={e => setSearch(e.target.value)} />
        <select className="search-select" value={filterResp} onChange={e => setFilterResp(e.target.value)}>
          <option value="">Todos responsáveis</option>
          {RESPONSAVEIS.filter(r => !r.startsWith("──")).map(r => <option key={r}>{r}</option>)}
        </select>
      </div>
      {loading ? <div className="loading"><div className="spinner" /> Carregando...</div> : (
        <div className="card" style={{padding:0}}>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Data</th><th>Responsável</th><th>Médico</th><th>Canal</th><th>Último TP</th><th>Prob.</th><th>MKT</th><th>Observação</th></tr></thead>
              <tbody>
                {sorted.length === 0 ? <tr><td colSpan={8}><div className="empty">Nenhuma visita registrada.</div></td></tr> : sorted.map(v => (
                  <tr key={v.id} style={{cursor:"pointer"}} onClick={() => setSelectedVisita(v)}>
                    <td className="td-muted" style={{fontFamily:"DM Mono",fontSize:12}}>{v.data_contato ? new Date(v.data_contato+"T00:00:00").toLocaleDateString("pt-BR") : "—"}</td>
                    <td>{v.responsavel||"—"}</td>
                    <td style={{fontWeight:500}}>{v.medico_nome}</td>
                    <td><span className="badge badge-canal">{v.canal||"—"}</span></td>
                    <td className="td-muted">{v.ultimo_tp||"—"}</td>
                    <td>{v.probabilidade ? probBadge(v.probabilidade) : "—"}</td>
                    <td style={{color:v.suporte_marketing?"var(--teal)":"var(--muted)",fontSize:12}}>{v.suporte_marketing?"✓ Sim":"—"}</td>
                    <td className="td-muted" style={{maxWidth:220,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.obs||"—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {showForm && <VisitaModal medicos={medicos} onSave={handleSave} onClose={() => setShowForm(false)} />}
      {selectedVisita && <VisitaDetalheModal visita={selectedVisita} onClose={() => setSelectedVisita(null)} onDelete={handleDelete} />}
      {toast && <Toast msg={toast} onHide={() => setToast(null)} />}
    </div>
  );
}

          {filtered.map(m => <div key={m.id} style={{padding:"8px 12px",cursor:"pointer",borderRadius:8,fontSize:13}} onClick={() => { setSelected(m); setSearch(m.nome); }} className="medico-list-item">{m.nome} <span style={{color:"var(--muted)",fontSize:11}}>· T{m.tier}</span></div>)}
        </div>
      )}
      {selected && (
        <div>
          <div className="card">
            <div className="medico-header">
              <div className="medico-avatar">{initials(selected.nome)}</div>
              <div>
                <div style={{fontSize:18,fontWeight:700}}>{selected.nome}</div>
                <div style={{display:"flex",gap:8,marginTop:4,flexWrap:"wrap"}}>
                  <span className="badge badge-tier">T{selected.tier}</span>
                  {selected.especialidade && <span className="badge badge-canal">{selected.especialidade}</span>}
                  {selected.regiao && <span className="badge badge-canal">{selected.regiao}</span>}
                </div>
                <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>{selected.clinica}</div>

            </div>
          </div>
          {visitasMedico.length > 0 && (
            <div className="card">
              <div className="card-title">Últimas Visitas ({visitasMedico.length})</div>
              <div className="table-wrap">
                <table>
                  <thead><tr><th>Data</th><th>Responsável</th><th>Canal</th><th>TP</th><th>Prob.</th><th>Observação</th></tr></thead>
                  <tbody>
                    {visitasMedico.slice(0,5).map(v => (
                      <tr key={v.id}>
                        <td className="td-muted" style={{fontFamily:"DM Mono",fontSize:11}}>{v.data_contato ? new Date(v.data_contato+"T00:00:00").toLocaleDateString("pt-BR") : "—"}</td>
                        <td style={{fontSize:12}}>{v.responsavel||"—"}</td>
                        <td><span className="badge badge-canal">{v.canal||"—"}</span></td>
                        <td className="td-muted">{v.ultimo_tp||"—"}</td>
                        <td>{v.probabilidade ? probBadge(v.probabilidade) : "—"}</td>
                        <td className="td-muted" style={{maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.obs||"—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── INTELIGÊNCIA DE ABORDAGEM ─────────────────────────────────────────────
function Inteligencia() {
  const { data: medicos, loading: loadingMed } = useSupabase("perfil_medico");
  const { data: todasVisitas, loading: loadingVis } = useSupabase("visitas");
  const { data: baseDados, loading: loadingBase } = useSupabase("base_dados");
  const [search, setSearch] = useState("");
  const [selectedMedico, setSelectedMedico] = useState(null);
  const [briefing, setBriefing] = useState(null);
  const [gerando, setGerando] = useState(false);
  const [erro, setErro] = useState(null);

  const visitasMedico = selectedMedico
    ? [...todasVisitas].filter(v => v.medico_nome === selectedMedico.nome).sort((a,b) => new Date(b.data_contato)-new Date(a.data_contato))
    : [];
  const ultimaVisita = visitasMedico[0] || null;
  const segmentacao = selectedMedico ? baseDados.find(b => b.nome === selectedMedico.nome) : null;

  const medicosFiltrados = medicos.filter(m => !search || m.nome?.toLowerCase().includes(search.toLowerCase()));

  const selecionarMedico = (m) => { setSelectedMedico(m); setBriefing(null); setErro(null); };

  async function gerarBriefing() {
    if (!ultimaVisita) { setErro("Nenhuma visita registrada para este médico ainda."); return; }
    setGerando(true); setBriefing(null); setErro(null);

    const historico = visitasMedico.slice(0,5).map((v,i) =>
      `Visita ${i+1} (${v.data_contato||"?"}): TP=${v.ultimo_tp||"—"} | Prob=${v.probabilidade||"—"} | Obs=${(v.obs||"—").slice(0,100)} | Ação=${v.acao_prevista||"—"}`
    ).join("\n");

    const segStr = segmentacao ? `
## MATRIZ DE SEGMENTAÇÃO (Base de Dados)
Perfil Médico: ${segmentacao.perfil_medico||"—"}
Estágio com BSCI: ${segmentacao.estagio_bsci||"—"}
Potencial de Expansão 12m: ${segmentacao.potencial_expansao||"—"}
Objetivo 12 Meses: ${segmentacao.objetivo_12m||"—"}
GAPs Relatados: ${segmentacao.gaps_relatados||"—"}
Pontos Fortes: ${segmentacao.pontos_fortes||"—"}
Driver de Decisão: ${segmentacao.driver_decisao||"—"}
Barreira para Ampliar: ${segmentacao.barreira_ampliar||"—"}
Perfil de Adoção de Tecnologia: ${segmentacao.perfil_adocao||"—"}
Indica GLP-1: ${segmentacao.indica_glp1||"—"}
Coloca Balão: ${segmentacao.coloca_balao||"—"}
Conduta quando recusa ESG por preço: ${segmentacao.conduta_recusa_esg||"—"}
Agendamentos Obesidade/Mês: ${segmentacao.agend_obesidade_mes||"—"}
Procedimentos ESG/Mês: ${segmentacao.proc_esg_mes||"—"}
Conversão Consulta→Procedimento: ${segmentacao.conversao_pct||"—"}%
Maturidade Gestão Clínica: ${segmentacao.maturidade_gestao||"—"}
Posts/Mês: ${segmentacao.posts_mes||"—"}
Investimento em Mídia: ${segmentacao.invest_midia||"—"}
Capacitação Técnica: ${segmentacao.cap_tecnica||"—"}
Capacitação Comercial: ${segmentacao.cap_comercial||"—"}
Capacitação Digital: ${segmentacao.cap_digital||"—"}
Cirurgião Parceiro: ${segmentacao.cirurgiao_parceiro||"—"}
Referidor Parceiro: ${segmentacao.referidor_parceiro||"—"}
Comissiona Secretária: ${segmentacao.comissiona_secretaria||"—"}
` : "Dados de segmentação não encontrados para este médico.";

    const prompt = `Você é especialista em estratégia comercial médica da divisão de Endobariatrica (ESG - Sleeve Endoscópico e BIB - Balão Intragástrico).

Analise TODOS os dados abaixo e gere um BRIEFING DE ABORDAGEM cirúrgico para a PRÓXIMA VISITA.

## MÉDICO
Nome: ${selectedMedico.nome}
Tier: ${selectedMedico.tier||"—"}
Especialidade: ${ultimaVisita.especialidade||selectedMedico.especialidade||"—"}
Clínica: ${selectedMedico.clinica||"—"}
Região: ${selectedMedico.regiao||"—"}
Total de visitas registradas: ${visitasMedico.length}

## ÚLTIMA VISITA (${ultimaVisita.data_contato||"?"})
Responsável: ${ultimaVisita.responsavel||"—"}
Canal: ${ultimaVisita.canal||"—"}
Último TP trabalhado: ${ultimaVisita.ultimo_tp||"—"}
Probabilidade de fechar: ${ultimaVisita.probabilidade||"—"}
Valor esperado no mês: R$ ${ultimaVisita.valor_esperado||0}
Fios ESG em estoque: ${ultimaVisita.fios_esg_estoque??("—")}
Balões em estoque: ${ultimaVisita.baloes_estoque??("—")}
Proc. ESG marcados: ${ultimaVisita.proc_marcados_esg??("—")}
Suporte marketing solicitado: ${ultimaVisita.suporte_marketing?"Sim":"Não"}
Ação prevista: ${ultimaVisita.acao_prevista||"—"}
Observações: ${ultimaVisita.obs||"—"}

## HISTÓRICO DE VISITAS
${historico}

${segStr}

## CONTEXTO ESTRATÉGICO
- ESG e GLP-1 são COMPLEMENTARES, nunca competitivos
- Paciente pós-GLP-1 com reganho de peso = perfil de maior conversão
- Evidências: MERIT Trial (Lancet 2022), IFSO 2024 meta-análise (n=15.714), ASGE-ESGE 2024
- Programa INSPIRA: rede de pacientes embaixadores ESG
- TPs disponíveis: TP1 a TP23 cobrindo introdução, perfil paciente, evidências, complementaridade GLP-1, diferencial técnico, suporte, parceria, follow-up, INSPIRA

## INSTRUÇÕES
Use TODOS os dados — especialmente a matriz de segmentação — para personalizar ao máximo o briefing.
Responda APENAS com JSON válido, sem markdown, sem texto fora do JSON:
{
  "resumo_situacao": "2-3 frases sobre o momento atual deste relacionamento cruzando visitas + segmentação",
  "objetivo_visita": "objetivo claro e específico para a próxima visita baseado no estágio e gaps",
  "tp_recomendado": "qual TP trabalhar, por quê, e como conectar com o driver de decisão deste médico",
  "abertura_sugerida": "frase de abertura natural e consultiva baseada no histórico e perfil",
  "argumento_principal": "argumento central personalizado para este médico — use pontos fortes, barreira, driver de decisão",
  "material_recomendado": ["material 1", "material 2", "material 3"],
  "sinais_de_avanco": ["sinal 1", "sinal 2"],
  "alerta": "ponto de atenção ou risco específico deste médico (string ou null)",
  "proximos_tps": ["TP desta visita", "TP da visita seguinte"],
  "acao_marketing": "ação de marketing recomendada baseada no perfil digital e gaps (ou null)"
}`;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
      });
      const data = await response.json();
      const texto = (data.content||[]).map(b => b.text||"").join("");
      const limpo = texto.replace(/```json|```/g,"").trim();
      setBriefing(JSON.parse(limpo));
    } catch(e) {
      setErro("Erro ao gerar briefing. Tente novamente."); console.error(e);
    } finally { setGerando(false); }
  }

  const loading = loadingMed || loadingVis || loadingBase;

  return (
    <div>
      <div className="section-header">
        <div><div className="section-title">🧠 Inteligência de Abordagem</div><div className="section-sub">Cruzamento de visitas + segmentação + IA para briefing personalizado</div></div>
      </div>
      <div className="intel-grid">
        {/* Lista de médicos */}

                  const temSeg = baseDados.some(b => b.nome === m.nome);
                  const isSelected = selectedMedico?.id === m.id;
                  return (
                    <div key={m.id} className={`medico-list-item ${isSelected?"selected":""}`} onClick={() => selecionarMedico(m)}>
                      <div className="medico-avatar-sm">{initials(m.nome)}</div>

                      {selectedMedico.tier && <span className="badge badge-tier">Tier {selectedMedico.tier}</span>}
                      {ultimaVisita?.especialidade && <span className="badge badge-canal">{ultimaVisita.especialidade}</span>}

                        {briefing.proximos_tps.map((tp,i) => (
                          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:"var(--bg)",borderRadius:8}}>
                            <div style={{width:22,height:22,borderRadius:"50%",background:i===0?"var(--teal)":"var(--border)",color:i===0?"#0a0e1a":"var(--muted)",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
                            <span style={{fontSize:12,color:i===0?"var(--text)":"var(--muted)"}}>{tp}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <button onClick={() => setBriefing(null)} style={{width:"100%",padding:"10px",marginTop:4,borderRadius:8,border:"1px solid var(--border)",background:"transparent",color:"var(--muted)",fontSize:12,fontFamily:"DM Sans,sans-serif",cursor:"pointer"}}>
                    ↩ Limpar e gerar novamente
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
